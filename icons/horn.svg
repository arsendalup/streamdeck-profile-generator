<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffaa00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8800;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcc00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9900;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Horn main body -->
  <path d="M12 32 Q8 36 12 40 L28 40 Q36 40 44 36 Q48 34 48 32 Q48 30 44 28 Q36 24 28 24 L12 24 Q8 28 12 32 Z" 
        fill="url(#hornGrad)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Horn bell -->
  <ellipse cx="52" cy="32" rx="12" ry="16" fill="url(#bellGrad)" stroke="#ffffff" stroke-width="2" transform="rotate(15 52 32)">
    <animateTransform attributeName="transform" type="rotate" values="15 52 32;18 52 32;15 52 32" dur="0.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Horn inner -->
  <ellipse cx="52" cy="32" rx="8" ry="12" fill="#000000" stroke="#ffcc00" stroke-width="1" transform="rotate(15 52 32)">
    <animateTransform attributeName="transform" type="rotate" values="15 52 32;18 52 32;15 52 32" dur="0.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Sound waves -->
  <g opacity="0.7">
    <path d="M64 26 Q68 28 68 32 Q68 36 64 38" stroke="#ffff00" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M66 22 Q72 26 72 32 Q72 38 66 42" stroke="#ffff00" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0;1;0" dur="0.8s" begin="0.2s" repeatCount="indefinite"/>
    </path>
    <path d="M68 18 Q76 24 76 32 Q76 40 68 46" stroke="#ffff00" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0;1;0" dur="0.8s" begin="0.4s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Horn button -->
  <circle cx="20" cy="32" r="4" fill="#ff3333" stroke="#ffffff" stroke-width="2">
    <animate attributeName="r" values="4;5;4" dur="0.5s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#ff3333;#ffff00;#ff3333" dur="0.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Mounting bracket -->
  <rect x="10" y="28" width="4" height="8" rx="2" fill="#666666" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Sound intensity indicators -->
  <g>
    <rect x="30" y="30" width="2" height="4" fill="#00ff00">
      <animate attributeName="height" values="4;8;4" dur="0.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="30;28;30" dur="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="34" y="29" width="2" height="6" fill="#ffff00">
      <animate attributeName="height" values="6;10;6" dur="0.3s" begin="0.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="29;27;29" dur="0.3s" begin="0.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="38" y="28" width="2" height="8" fill="#ff6600">
      <animate attributeName="height" values="8;12;8" dur="0.3s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="28;26;28" dur="0.3s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Emergency/police horn stripes -->
  <rect x="14" y="26" width="2" height="12" fill="#ff3333">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="0.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="24" y="26" width="2" height="12" fill="#ff3333">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="0.5s" begin="0.25s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Volume control -->
  <circle cx="16" cy="24" r="2" fill="#333333" stroke="#ffffff" stroke-width="1"/>
  <line x1="15" y1="24" x2="17" y2="24" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Pressure waves -->
  <circle cx="52" cy="32" r="18" fill="none" stroke="#ffff00" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="15;22;15" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="0.8s" repeatCount="indefinite"/>
  </circle>
</svg>