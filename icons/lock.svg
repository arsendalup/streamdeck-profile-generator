<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffaa00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff8800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc4400;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ffaa00;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#663300;stop-opacity:0.3" />
    </radialGradient>
    <filter id="lockFilter">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#ffaa00" stroke-width="2"/>
  
  <!-- Lock shackle -->
  <path d="M52 45 Q52 30 72 30 Q92 30 92 45" 
        stroke="url(#lockGrad)" 
        stroke-width="6" 
        fill="none" 
        stroke-linecap="round"
        filter="url(#lockFilter)"/>
  
  <!-- Lock body -->
  <rect x="50" y="60" width="44" height="50" fill="url(#lockGrad)" rx="8" filter="url(#lockFilter)"/>
  
  <!-- Keyhole -->
  <circle cx="72" cy="80" r="6" fill="#003366" stroke="#00ffff" stroke-width="2"/>
  <rect x="69" y="80" width="6" height="15" fill="#003366" rx="3"/>
  
  <!-- Lock mechanism -->
  <circle cx="72" cy="80" r="3" fill="url(#lockGlow)">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Security indicators -->
  <circle cx="60" cy="70" r="2" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="84" cy="70" r="2" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  
  <circle cx="60" cy="95" r="2" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="1.5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <circle cx="84" cy="95" r="2" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="1.5s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  
  <!-- Digital lock display -->
  <rect x="65" y="100" width="14" height="6" fill="#003366" stroke="#00ffff" stroke-width="1" rx="2"/>
  <rect x="67" y="102" width="2" height="2" fill="#00ff00"/>
  <rect x="71" y="102" width="2" height="2" fill="#00ff00"/>
  <rect x="75" y="102" width="2" height="2" fill="#ffff00"/>
  
  <!-- Security field -->
  <circle cx="72" cy="80" r="30" fill="none" stroke="#ffaa00" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="30;35;30" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Lock engagement -->
  <rect x="94" y="72" width="8" height="4" fill="url(#lockGrad)" rx="2">
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0 0;5 0;0 0" 
      dur="4s" 
      repeatCount="indefinite"/>
  </rect>
  
  <!-- Secured indicator -->
  <text x="72" y="25" font-family="Arial" font-size="8" fill="#ffaa00" text-anchor="middle">SECURED</text>
  
  <!-- Quantum encryption -->
  <path d="M40 50 Q45 45 50 50" stroke="#00ffff" stroke-width="1" fill="none" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <path d="M94 50 Q99 45 104 50" stroke="#00ffff" stroke-width="1" fill="none" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1s"/>
  </path>
</svg>