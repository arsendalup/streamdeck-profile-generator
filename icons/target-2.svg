<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="advancedTargetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ff4444;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#330000;stop-opacity:0.3" />
    </radialGradient>
    <filter id="targetAdvGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#ffff00" stroke-width="2"/>
  
  <!-- Advanced targeting grid -->
  <circle cx="72" cy="72" r="45" fill="none" stroke="#ffff00" stroke-width="2" opacity="0.8">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 72 72;360 72 72" 
      dur="3s" 
      repeatCount="indefinite"/>
  </circle>
  
  <circle cx="72" cy="72" r="30" fill="none" stroke="#ff8800" stroke-width="2" opacity="0.6">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 72 72;-360 72 72" 
      dur="2s" 
      repeatCount="indefinite"/>
  </circle>
  
  <circle cx="72" cy="72" r="15" fill="none" stroke="#ff4444" stroke-width="2" opacity="0.9">
    <animate attributeName="stroke-opacity" values="0.9;0.3;0.9" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Precision crosshair -->
  <path d="M72 25 L72 40 M72 104 L72 119 M25 72 L40 72 M104 72 L119 72" 
        stroke="#ffff00" 
        stroke-width="2" 
        stroke-linecap="round"
        filter="url(#targetAdvGlow)">
    <animate attributeName="stroke-opacity" values="1;0.5;1" dur="0.8s" repeatCount="indefinite"/>
  </path>
  
  <!-- Target lock indicators -->
  <path d="M50 50 L58 50 L58 58 M86 50 L94 50 L94 58 M50 94 L58 94 L58 86 M86 94 L94 94 L94 86" 
        stroke="#ff0000" 
        stroke-width="3" 
        fill="none"
        filter="url(#targetAdvGlow)"/>
  
  <!-- Central targeting reticle -->
  <circle cx="72" cy="72" r="8" fill="none" stroke="#ffffff" stroke-width="2">
    <animate attributeName="r" values="8;12;8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="72" cy="72" r="3" fill="#ff0000">
    <animate attributeName="fill" values="#ff0000;#ffff00;#ff0000" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Tracking lines -->
  <path d="M60 60 L84 84" stroke="#00ff00" stroke-width="1" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <path d="M84 60 L60 84" stroke="#00ff00" stroke-width="1" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite" begin="1s"/>
  </path>
  
  <!-- Range finder -->
  <rect x="25" y="25" width="12" height="3" fill="#00ffff" opacity="0.8"/>
  <rect x="107" y="25" width="12" height="3" fill="#00ffff" opacity="0.8"/>
  <rect x="25" y="116" width="12" height="3" fill="#00ffff" opacity="0.8"/>
  <rect x="107" y="116" width="12" height="3" fill="#00ffff" opacity="0.8"/>
  
  <!-- Distance markers -->
  <text x="30" y="35" font-family="monospace" font-size="8" fill="#00ffff" opacity="0.8">1.2K</text>
  <text x="110" y="35" font-family="monospace" font-size="8" fill="#00ffff" opacity="0.8">VEL</text>
  
  <!-- Lock-on confirmation -->
  <circle cx="72" cy="30" r="4" fill="#00ff00" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite" begin="2s"/>
  </circle>
  
  <!-- Target acquired pulse -->
  <circle cx="72" cy="72" r="25" fill="none" stroke="#ff0000" stroke-width="1" opacity="0">
    <animate attributeName="r" values="25;45;25" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>