<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="micOffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#555555;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="meshOffGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#666666;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:0.5" />
    </radialGradient>
  </defs>
  
  <!-- Microphone capsule (muted) -->
  <ellipse cx="36" cy="26" rx="10" ry="14" fill="url(#micOffGrad)" stroke="#666666" stroke-width="2" opacity="0.6"/>
  
  <!-- Mesh grille (dimmed) -->
  <ellipse cx="36" cy="26" rx="8" ry="12" fill="url(#meshOffGrad)" stroke="#444444" stroke-width="1" opacity="0.5"/>
  
  <!-- Mesh pattern (dimmed) -->
  <g opacity="0.4">
    <line x1="30" y1="18" x2="42" y2="18" stroke="#666666" stroke-width="0.5"/>
    <line x1="30" y1="22" x2="42" y2="22" stroke="#666666" stroke-width="0.5"/>
    <line x1="30" y1="26" x2="42" y2="26" stroke="#666666" stroke-width="0.5"/>
    <line x1="30" y1="30" x2="42" y2="30" stroke="#666666" stroke-width="0.5"/>
    <line x1="30" y1="34" x2="42" y2="34" stroke="#666666" stroke-width="0.5"/>
    
    <line x1="32" y1="14" x2="32" y2="38" stroke="#666666" stroke-width="0.5"/>
    <line x1="36" y1="14" x2="36" y2="38" stroke="#666666" stroke-width="0.5"/>
    <line x1="40" y1="14" x2="40" y2="38" stroke="#666666" stroke-width="0.5"/>
  </g>
  
  <!-- Microphone stand (dimmed) -->
  <rect x="34" y="40" width="4" height="16" rx="2" fill="url(#micOffGrad)" stroke="#666666" stroke-width="1" opacity="0.6"/>
  
  <!-- Base (dimmed) -->
  <ellipse cx="36" cy="58" rx="8" ry="3" fill="url(#micOffGrad)" stroke="#666666" stroke-width="2" opacity="0.6"/>
  <ellipse cx="36" cy="56" rx="6" ry="2" fill="#444444" opacity="0.5"/>
  
  <!-- Mute indicator - large X -->
  <g stroke="#ff3333" stroke-width="4" stroke-linecap="round">
    <line x1="20" y1="16" x2="52" y2="48">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="52" y1="16" x2="20" y2="48">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1s" begin="0.5s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Mute circle background -->
  <circle cx="36" cy="32" r="18" fill="none" stroke="#ff3333" stroke-width="3" opacity="0.7">
    <animate attributeName="r" values="16;20;16" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- No sound waves (X marks) -->
  <g opacity="0.6">
    <g transform="translate(52, 24)">
      <line x1="-2" y1="-2" x2="2" y2="2" stroke="#ff3333" stroke-width="2"/>
      <line x1="2" y1="-2" x2="-2" y2="2" stroke="#ff3333" stroke-width="2"/>
    </g>
    <g transform="translate(56, 26)">
      <line x1="-3" y1="-3" x2="3" y2="3" stroke="#ff3333" stroke-width="2"/>
      <line x1="3" y1="-3" x2="-3" y2="3" stroke="#ff3333" stroke-width="2"/>
    </g>
    <g transform="translate(60, 28)">
      <line x1="-4" y1="-4" x2="4" y2="4" stroke="#ff3333" stroke-width="2"/>
      <line x1="4" y1="-4" x2="-4" y2="4" stroke="#ff3333" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Audio level indicator (off) -->
  <rect x="18" y="26" width="2" height="2" fill="#666666" opacity="0.3"/>
  <rect x="22" y="26" width="2" height="2" fill="#666666" opacity="0.3"/>
  <rect x="26" y="26" width="2" height="2" fill="#666666" opacity="0.3"/>
  
  <!-- Power LED (off/red) -->
  <circle cx="36" cy="44" r="2" fill="#ff3333" stroke="#ffffff" stroke-width="1">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Brand label (dimmed) -->
  <rect x="32" y="48" width="8" height="3" rx="1" fill="#333333" stroke="#666666" stroke-width="0.5" opacity="0.5"/>
  <text x="36" y="50.5" text-anchor="middle" font-family="Arial" font-size="4" fill="#888888" opacity="0.5">MIC</text>
  
  <!-- Shock mount (dimmed) -->
  <g opacity="0.3">
    <ellipse cx="36" cy="26" rx="12" ry="16" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="24" cy="26" r="1" fill="#666666"/>
    <circle cx="48" cy="26" r="1" fill="#666666"/>
    <circle cx="36" cy="10" r="1" fill="#666666"/>
    <circle cx="36" cy="42" r="1" fill="#666666"/>
  </g>
  
  <!-- Mute status indicator -->
  <text x="36" y="66" text-anchor="middle" font-family="monospace" font-size="6" fill="#ff3333" opacity="0.8">
    MUTED
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1s" repeatCount="indefinite"/>
  </text>
  
  <!-- Warning triangle -->
  <g transform="translate(8, 8)" opacity="0.8">
    <polygon points="4,0 8,6 0,6" fill="#ff3333" stroke="#ffffff" stroke-width="1"/>
    <text x="4" y="5" text-anchor="middle" font-family="Arial" font-size="4" font-weight="bold" fill="#ffffff">!</text>
  </g>
  
  <!-- Prohibition sign -->
  <circle cx="36" cy="32" r="20" fill="none" stroke="#ff3333" stroke-width="2" opacity="0.4" stroke-dasharray="8,4">
    <animateTransform attributeName="transform" type="rotate" values="0 36 32;360 36 32" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>