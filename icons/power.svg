<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="powerCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#0080ff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:0.3" />
    </radialGradient>
    <filter id="powerGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#0a1a2e" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Power symbol circle -->
  <circle cx="72" cy="72" r="40" fill="none" stroke="#00ffff" stroke-width="6" 
          stroke-dasharray="220 30" 
          stroke-linecap="round"
          filter="url(#powerGlow)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 72 72;360 72 72" 
      dur="8s" 
      repeatCount="indefinite"/>
  </circle>
  
  <!-- Power line -->
  <rect x="69" y="35" width="6" height="25" fill="#00ffff" rx="3"
        filter="url(#powerGlow)">
    <animate attributeName="fill-opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Core energy -->
  <circle cx="72" cy="72" r="20" fill="url(#powerCore)">
    <animate attributeName="r" values="20;25;20" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Energy pulses -->
  <circle cx="72" cy="72" r="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="15;30;15" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Power indicators -->
  <circle cx="72" cy="30" r="3" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="115" cy="72" r="3" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  
  <circle cx="72" cy="115" r="3" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="1.5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <circle cx="29" cy="72" r="3" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="1.5s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
</svg>