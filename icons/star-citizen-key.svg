<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(8, 8)">
    <\!-- Keyboard base -->
    <rect x="2" y="32" width="52" height="20" fill="#2d4a5a" stroke="#ffffff" stroke-width="2" rx="4"/>
    
    <\!-- Keys -->
    <g fill="#1a2836" stroke="#ffffff" stroke-width="1">
      <rect x="6" y="36" width="6" height="4" rx="1"/>
      <rect x="14" y="36" width="6" height="4" rx="1"/>
      <rect x="22" y="36" width="6" height="4" rx="1"/>
      <rect x="30" y="36" width="6" height="4" rx="1"/>
      <rect x="38" y="36" width="6" height="4" rx="1"/>
      <rect x="46" y="36" width="6" height="4" rx="1"/>
      
      <rect x="10" y="42" width="6" height="4" rx="1"/>
      <rect x="18" y="42" width="6" height="4" rx="1"/>
      <rect x="26" y="42" width="6" height="4" rx="1"/>
      <rect x="34" y="42" width="6" height="4" rx="1"/>
      <rect x="42" y="42" width="6" height="4" rx="1"/>
    </g>
    
    <\!-- Star Citizen logo star -->
    <g transform="translate(28, 8)">
      <path d="M0,-8 L2,-2 L8,-2 L3,1 L5,7 L0,4 L-5,7 L-3,1 L-8,-2 L-2,-2 Z" 
            fill="#4a9eff" stroke="#ffffff" stroke-width="1"/>
    </g>
    
    <\!-- SC text -->
    <text x="16" y="26" text-anchor="start" fill="#ffffff" font-size="8" font-weight="bold">S</text>
    <text x="32" y="26" text-anchor="start" fill="#ffffff" font-size="8" font-weight="bold">C</text>
    
    <\!-- Key highlight -->
    <rect x="22" y="36" width="6" height="4" fill="#4a9eff" opacity="0.5" rx="1"/>
  </g>
</svg>
