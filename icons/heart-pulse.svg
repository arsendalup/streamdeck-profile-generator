<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6666;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc3333;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Heart shape -->
  <path d="M36 54 C24 42 12 34 12 24 C12 18 18 12 24 12 C30 12 36 18 36 24 C36 18 42 12 48 12 C54 12 60 18 60 24 C60 34 48 42 36 54 Z" 
        fill="url(#heartGrad)" stroke="#ffffff" stroke-width="2">
    <animate attributeName="transform" values="scale(1); scale(1.05); scale(1)" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Heart glow -->
  <path d="M36 54 C24 42 12 34 12 24 C12 18 18 12 24 12 C30 12 36 18 36 24 C36 18 42 12 48 12 C54 12 60 18 60 24 C60 34 48 42 36 54 Z" 
        fill="none" stroke="#ff6666" stroke-width="4" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Pulse line background -->
  <rect x="8" y="58" width="56" height="8" rx="4" fill="#000000" stroke="#00d4ff" stroke-width="1" opacity="0.8"/>
  
  <!-- ECG/Pulse line -->
  <g stroke="#00ff00" stroke-width="2" fill="none">
    <path d="M10 62 L16 62 L18 58 L20 66 L22 58 L24 62 L28 62 L30 60 L32 64 L34 62 L38 62 L40 58 L42 66 L44 58 L46 62 L50 62 L52 60 L54 64 L56 62 L62 62">
      <animate attributeName="stroke-dasharray" values="0,200;100,100;200,0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;-200" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Pulse indicators -->
  <circle cx="20" cy="62" r="2" fill="#00ff00">
    <animate attributeName="r" values="1;3;1" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="42" cy="62" r="2" fill="#00ff00">
    <animate attributeName="r" values="1;3;1" dur="1s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Heart rate monitor screens -->
  <rect x="4" y="56" width="12" height="12" rx="2" fill="#000000" stroke="#00d4ff" stroke-width="1"/>
  <text x="10" y="64" text-anchor="middle" font-family="monospace" font-size="8" fill="#00ff00">72</text>
  
  <rect x="56" y="56" width="12" height="12" rx="2" fill="#000000" stroke="#00d4ff" stroke-width="1"/>
  <text x="62" y="64" text-anchor="middle" font-family="monospace" font-size="8" fill="#00ff00">BPM</text>
  
  <!-- Vital signs -->
  <g opacity="0.7">
    <circle cx="24" cy="24" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="48" cy="24" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Medical cross -->
  <g transform="translate(36, 32)" opacity="0.8">
    <rect x="-1" y="-4" width="2" height="8" fill="#ffffff"/>
    <rect x="-4" y="-1" width="8" height="2" fill="#ffffff"/>
  </g>
  
  <!-- Emergency pulse -->
  <circle cx="36" cy="32" r="20" fill="none" stroke="#ff3333" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="15;25;15" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>