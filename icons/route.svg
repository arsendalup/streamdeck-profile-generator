<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#666666;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main route path -->
  <path d="M12 60 Q20 50 28 48 Q36 46 44 32 Q52 18 60 12" 
        fill="none" stroke="url(#roadGrad)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Route center line -->
  <path d="M12 60 Q20 50 28 48 Q36 46 44 32 Q52 18 60 12" 
        fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;10" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Start point -->
  <circle cx="12" cy="60" r="4" fill="#00ff00" stroke="#ffffff" stroke-width="2">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="8" y="56" font-family="Arial" font-size="6" fill="#00ff00" font-weight="bold">A</text>
  
  <!-- End point -->
  <circle cx="60" cy="12" r="4" fill="#ff3333" stroke="#ffffff" stroke-width="2">
    <animate attributeName="r" values="3;5;3" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <text x="56" y="8" font-family="Arial" font-size="6" fill="#ff3333" font-weight="bold">B</text>
  
  <!-- Waypoints -->
  <circle cx="28" cy="48" r="3" fill="#ffff00" stroke="#ffffff" stroke-width="1">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="24" y="44" font-family="Arial" font-size="5" fill="#ffff00">1</text>
  
  <circle cx="44" cy="32" r="3" fill="#ffff00" stroke="#ffffff" stroke-width="1">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <text x="40" y="28" font-family="Arial" font-size="5" fill="#ffff00">2</text>
  
  <!-- Moving vehicle -->
  <g>
    <circle cx="12" cy="60" r="2" fill="url(#routeGrad)" stroke="#ffffff" stroke-width="1">
      <animateMotion dur="6s" repeatCount="indefinite">
        <mpath href="#routePath"/>
      </animateMotion>
    </circle>
    <!-- Vehicle trail -->
    <circle cx="12" cy="60" r="1" fill="#00d4ff" opacity="0.6">
      <animateMotion dur="6s" begin="0.5s" repeatCount="indefinite">
        <mpath href="#routePath"/>
      </animateMotion>
    </circle>
    <circle cx="12" cy="60" r="0.5" fill="#00d4ff" opacity="0.4">
      <animateMotion dur="6s" begin="1s" repeatCount="indefinite">
        <mpath href="#routePath"/>
      </animateMotion>
    </circle>
  </g>
  
  <!-- Hidden path for animation -->
  <path id="routePath" d="M12 60 Q20 50 28 48 Q36 46 44 32 Q52 18 60 12" opacity="0"/>
  
  <!-- Direction arrows -->
  <g opacity="0.8">
    <path d="M20 54 L24 52 L20 50" stroke="#00d4ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M36 42 L40 38 L36 34" stroke="#00d4ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M52 22 L56 18 L52 14" stroke="#00d4ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Road signs -->
  <g transform="translate(24, 40)">
    <rect x="0" y="0" width="8" height="6" rx="1" fill="#00ff00" stroke="#ffffff" stroke-width="1"/>
    <text x="4" y="4" text-anchor="middle" font-family="Arial" font-size="3" fill="#000000">5km</text>
  </g>
  
  <g transform="translate(48, 24)">
    <rect x="0" y="0" width="8" height="6" rx="1" fill="#ff6600" stroke="#ffffff" stroke-width="1"/>
    <text x="4" y="4" text-anchor="middle" font-family="Arial" font-size="3" fill="#ffffff">2km</text>
  </g>
  
  <!-- GPS coordinates -->
  <g transform="translate(8, 8)" opacity="0.7">
    <rect width="24" height="8" rx="2" fill="#000000" stroke="#00d4ff" stroke-width="1"/>
    <text x="12" y="5" text-anchor="middle" font-family="monospace" font-size="3" fill="#00d4ff">
      LAT: 42.3601°
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- ETA display -->
  <g transform="translate(40, 60)" opacity="0.8">
    <rect width="20" height="8" rx="2" fill="#000000" stroke="#ffff00" stroke-width="1"/>
    <text x="10" y="5" text-anchor="middle" font-family="monospace" font-size="4" fill="#ffff00">
      ETA: 12min
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Alternative routes (dimmed) -->
  <path d="M12 60 Q16 56 20 56 Q28 56 36 44 Q44 32 52 28 Q56 26 60 12" 
        fill="none" stroke="#666666" stroke-width="4" stroke-dasharray="4,8" opacity="0.4"/>
  
  <path d="M12 60 Q24 58 32 52 Q40 46 48 40 Q56 34 60 12" 
        fill="none" stroke="#666666" stroke-width="4" stroke-dasharray="4,8" opacity="0.3"/>
  
  <!-- Distance markers -->
  <g opacity="0.6">
    <circle cx="24" cy="52" r="1" fill="#ffffff"/>
    <text x="20" y="48" font-family="Arial" font-size="4" fill="#ffffff">2km</text>
    
    <circle cx="40" cy="36" r="1" fill="#ffffff"/>
    <text x="36" y="32" font-family="Arial" font-size="4" fill="#ffffff">5km</text>
    
    <circle cx="52" cy="20" r="1" fill="#ffffff"/>
    <text x="48" y="16" font-family="Arial" font-size="4" fill="#ffffff">8km</text>
  </g>
  
  <!-- Speed limit -->
  <g transform="translate(32, 56)">
    <circle cx="0" cy="0" r="4" fill="#ffffff" stroke="#ff3333" stroke-width="2"/>
    <text x="0" y="1" text-anchor="middle" font-family="Arial" font-size="4" font-weight="bold" fill="#ff3333">80</text>
  </g>
  
  <!-- Navigation compass -->
  <g transform="translate(64, 56)" opacity="0.7">
    <circle cx="0" cy="0" r="6" fill="#001122" stroke="#00d4ff" stroke-width="1"/>
    <path d="M0,-4 L2,0 L0,4 L-2,0 Z" fill="#ff3333"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Arial" font-size="4" fill="#ffffff">N</text>
    <animateTransform attributeName="transform" type="rotate" values="0 64 56;360 64 56" dur="8s" repeatCount="indefinite"/>
  </g>
  
  <!-- Traffic indicators -->
  <g transform="translate(16, 52)" opacity="0.8">
    <circle cx="0" cy="0" r="2" fill="#00ff00">
      <animate attributeName="fill" values="#00ff00;#ffff00;#ff3333;#ffff00;#00ff00" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Route optimization indicator -->
  <g transform="translate(68, 32)" opacity="0.6">
    <polygon points="0,-3 3,3 -3,3" fill="#00ff00" stroke="#ffffff" stroke-width="1"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial" font-size="4" fill="#00ff00">OPT</text>
  </g>
</svg>