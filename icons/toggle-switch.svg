<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(16, 24)">
    <!-- Switch housing -->
    <rect x="0" y="0" width="40" height="16" fill="#2d4a5a" stroke="#ffffff" stroke-width="2" rx="8"/>
    
    <!-- Switch track -->
    <rect x="2" y="2" width="36" height="12" fill="#1a2836" rx="6"/>
    
    <!-- Active switch position (right side - ON) -->
    <circle cx="32" cy="8" r="6" fill="#44ff44" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Switch center mechanism -->
    <circle cx="32" cy="8" r="3" fill="#ffffff"/>
    
    <!-- Mode indicators -->
    <text x="8" y="6" fill="#ffffff" font-size="6">NAV</text>
    <text x="8" y="12" fill="#ffffff" font-size="6">MODE</text>
    
    <text x="26" y="6" fill="#44ff44" font-size="6">SCM</text>
    <text x="26" y="12" fill="#44ff44" font-size="6">MODE</text>
    
    <!-- Status lights -->
    <circle cx="6" cy="8" r="2" fill="#4a9eff" opacity="0.5"/>
    <circle cx="34" cy="8" r="2" fill="#44ff44"/>
    
    <!-- Master mode indicator -->
    <rect x="12" y="20" width="16" height="6" fill="#44ff44" stroke="#ffffff" stroke-width="1" rx="2"/>
    <text x="20" y="25" text-anchor="middle" fill="#ffffff" font-size="8">MASTER</text>
  </g>
</svg>