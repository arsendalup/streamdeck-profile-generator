<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#0080ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#001a33;stop-opacity:0.3" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="72" cy="72" r="65" fill="#0a1a2e" stroke="#00d4ff" stroke-width="2" opacity="0.3"/>
  
  <!-- Main star -->
  <path d="M72 20 L82 50 L115 50 L90 70 L100 100 L72 82 L44 100 L54 70 L29 50 L62 50 Z" 
        fill="url(#starGlow)" 
        filter="url(#glow)"
        stroke="#00ffff" 
        stroke-width="1">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 72 72;360 72 72" 
      dur="20s" 
      repeatCount="indefinite"/>
  </path>
  
  <!-- Inner core -->
  <circle cx="72" cy="72" r="15" fill="#00ffff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Orbital rings -->
  <circle cx="72" cy="72" r="40" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 72 72;-360 72 72" 
      dur="15s" 
      repeatCount="indefinite"/>
  </circle>
  
  <circle cx="72" cy="72" r="55" fill="none" stroke="#0080ff" stroke-width="1" opacity="0.2">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 72 72;360 72 72" 
      dur="25s" 
      repeatCount="indefinite"/>
  </circle>
</svg>