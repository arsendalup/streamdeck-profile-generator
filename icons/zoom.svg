<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="zoomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0088ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004488;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="40%" style="stop-color:#00ffff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:0.2" />
    </radialGradient>
    <filter id="zoomFilter">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#00ffff" stroke-width="2"/>
  
  <!-- Magnifying glass lens -->
  <circle cx="65" cy="65" r="25" fill="url(#lensGlow)" filter="url(#zoomFilter)">
    <animate attributeName="fill-opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Lens border -->
  <circle cx="65" cy="65" r="25" fill="none" stroke="url(#zoomGrad)" stroke-width="4" filter="url(#zoomFilter)"/>
  
  <!-- Handle -->
  <path d="M85 85 L110 110" 
        stroke="url(#zoomGrad)" 
        stroke-width="6" 
        stroke-linecap="round"
        filter="url(#zoomFilter)"/>
  
  <!-- Magnified content -->
  <circle cx="65" cy="65" r="8" fill="#ffff00" opacity="0.8">
    <animate attributeName="r" values="8;12;8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Cross hairs -->
  <path d="M65 50 L65 60 M65 70 L65 80 M50 65 L60 65 M70 65 L80 65" 
        stroke="#ff4444" 
        stroke-width="1" 
        opacity="0.8"/>
  
  <!-- Zoom level indicator -->
  <rect x="25" y="25" width="20" height="8" fill="#003366" stroke="#00ffff" stroke-width="1" rx="2"/>
  <text x="35" y="31" font-family="monospace" font-size="8" fill="#00ffff" text-anchor="middle">2.5x</text>
  
  <!-- Lens reflection -->
  <ellipse cx="55" cy="55" rx="8" ry="12" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Focus rings -->
  <circle cx="65" cy="65" r="20" fill="none" stroke="#88ffff" stroke-width="1" opacity="0.4"/>
  <circle cx="65" cy="65" r="15" fill="none" stroke="#88ffff" stroke-width="1" opacity="0.6"/>
  
  <!-- Zoom direction arrows -->
  <path d="M105 45 L115 40 L115 50 Z" fill="#00ff00" opacity="0.8">
    <animate attributeName="fill-opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <path d="M105 125 L115 130 L115 120 Z" fill="#ff8800" opacity="0.8">
    <animate attributeName="fill-opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
  </path>
  
  <!-- Precision targeting -->
  <rect x="55" y="55" width="20" height="20" fill="none" stroke="#ff0000" stroke-width="1" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Digital zoom grid -->
  <path d="M50 55 L80 55 M50 65 L80 65 M50 75 L80 75" stroke="#00ffff" stroke-width="0.5" opacity="0.3"/>
  <path d="M55 50 L55 80 M65 50 L65 80 M75 50 L75 80" stroke="#00ffff" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Optical enhancement -->
  <circle cx="65" cy="65" r="30" fill="none" stroke="#66ccff" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="30;35;30" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>