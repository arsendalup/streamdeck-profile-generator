<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bombGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc4400;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="fuseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffaa00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6600;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Bomb body -->
  <circle cx="36" cy="42" r="18" fill="url(#bombGrad)" stroke="#ffffff" stroke-width="2">
    <animate attributeName="r" values="18;19;18" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Fuse -->
  <path d="M30 26 Q28 20 32 16 Q36 12 40 16" fill="none" stroke="url(#fuseGrad)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0,20;20,0;0,20" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Spark -->
  <circle cx="40" cy="16" r="2" fill="#ffff00">
    <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;3;1" dur="0.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Warning symbol -->
  <text x="36" y="47" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">!</text>
  
  <!-- Glow effect -->
  <circle cx="36" cy="42" r="22" fill="none" stroke="#ff6600" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="22;26;22" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>