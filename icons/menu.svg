<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="menuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Menu lines -->
  <rect x="16" y="20" width="40" height="4" rx="2" fill="url(#menuGrad)" stroke="#ffffff" stroke-width="1">
    <animate attributeName="width" values="40;44;40" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <rect x="16" y="32" width="40" height="4" rx="2" fill="url(#menuGrad)" stroke="#ffffff" stroke-width="1">
    <animate attributeName="width" values="40;44;40" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
  
  <rect x="16" y="44" width="40" height="4" rx="2" fill="url(#menuGrad)" stroke="#ffffff" stroke-width="1">
    <animate attributeName="width" values="40;44;40" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Menu background -->
  <rect x="12" y="16" width="48" height="36" rx="4" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Submenu indicators -->
  <polygon points="58,20 62,22 58,24" fill="#ffff00" opacity="0.8">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="58,32 62,34 58,36" fill="#ffff00" opacity="0.8">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="58,44 62,46 58,48" fill="#ffff00" opacity="0.8">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" begin="1s" repeatCount="indefinite"/>
  </polygon>
  
  <!-- Menu icons -->
  <g opacity="0.7">
    <!-- File icon -->
    <rect x="8" y="18" width="4" height="6" rx="1" fill="#ffffff" stroke="#00d4ff" stroke-width="0.5"/>
    <!-- Edit icon -->
    <circle cx="10" cy="34" r="2" fill="none" stroke="#ffffff" stroke-width="1"/>
    <line x1="8" y1="34" x2="12" y2="34" stroke="#ffffff" stroke-width="1"/>
    <!-- Settings icon -->
    <circle cx="10" cy="46" r="1.5" fill="none" stroke="#ffffff" stroke-width="1"/>
    <g transform="translate(10, 46)">
      <line x1="-2" y1="0" x2="2" y2="0" stroke="#ffffff" stroke-width="0.5"/>
      <line x1="0" y1="-2" x2="0" y2="2" stroke="#ffffff" stroke-width="0.5"/>
    </g>
  </g>
  
  <!-- Menu selection highlight -->
  <rect x="14" y="30" width="44" height="8" rx="2" fill="#ff6600" opacity="0.3">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,12; 0,0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Keyboard shortcuts -->
  <g font-family="monospace" font-size="6" fill="#cccccc" opacity="0.6">
    <text x="48" y="24">Ctrl+F</text>
    <text x="48" y="36">Ctrl+E</text>
    <text x="48" y="48">Ctrl+S</text>
  </g>
  
  <!-- Active indicator -->
  <rect x="12" y="22" width="2" height="4" fill="#00ff00">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,10; 0,20; 0,10; 0,0" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Glow effect -->
  <rect x="16" y="32" width="40" height="4" rx="2" fill="none" stroke="#00d4ff" stroke-width="4" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Navigation breadcrumbs -->
  <g transform="translate(16, 58)" opacity="0.6">
    <text font-family="Arial" font-size="6" fill="#00d4ff">Menu > Options > Display</text>
  </g>
</svg>