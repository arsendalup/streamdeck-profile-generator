<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="airplaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#silver;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#606060;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#404040;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="jetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#0080ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:0" />
    </radialGradient>
    <filter id="jetGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#0a1a2e" stroke="#silver" stroke-width="2"/>
  
  <!-- Fuselage -->
  <ellipse cx="72" cy="72" rx="50" ry="12" fill="url(#airplaneGrad)" filter="url(#jetGlow)"/>
  
  <!-- Wings -->
  <path d="M40 72 L25 50 L35 45 L50 65 Z" fill="url(#airplaneGrad)"/>
  <path d="M40 72 L25 94 L35 99 L50 79 Z" fill="url(#airplaneGrad)"/>
  <path d="M104 72 L119 50 L109 45 L94 65 Z" fill="url(#airplaneGrad)"/>
  <path d="M104 72 L119 94 L109 99 L94 79 Z" fill="url(#airplaneGrad)"/>
  
  <!-- Cockpit -->
  <ellipse cx="72" cy="72" rx="25" ry="6" fill="#003366" stroke="#00ffff" stroke-width="1"/>
  
  <!-- Engine intakes -->
  <ellipse cx="45" cy="65" rx="8" ry="3" fill="#1a1a1a"/>
  <ellipse cx="45" cy="79" rx="8" ry="3" fill="#1a1a1a"/>
  
  <!-- Jet exhaust -->
  <ellipse cx="20" cy="65" rx="6" ry="3" fill="url(#jetGlow)">
    <animate attributeName="rx" values="6;10;6" dur="0.8s" repeatCount="indefinite"/>
  </ellipse>
  
  <ellipse cx="20" cy="79" rx="6" ry="3" fill="url(#jetGlow)">
    <animate attributeName="rx" values="6;10;6" dur="0.8s" repeatCount="indefinite" begin="0.4s"/>
  </ellipse>
  
  <!-- Afterburner trails -->
  <path d="M14 65 L5 65" stroke="#00ffff" stroke-width="2" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="0.5s" repeatCount="indefinite"/>
  </path>
  
  <path d="M14 79 L5 79" stroke="#00ffff" stroke-width="2" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="0.5s" repeatCount="indefinite" begin="0.25s"/>
  </path>
  
  <!-- Navigation lights -->
  <circle cx="115" cy="50" r="2" fill="#ff0000">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="115" cy="94" r="2" fill="#00ff00">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <!-- Nose cone -->
  <path d="M122 72 L135 69 L135 75 Z" fill="url(#airplaneGrad)"/>
  
  <!-- Weapon hardpoints -->
  <rect x="30" y="48" width="4" height="2" fill="#ff6600"/>
  <rect x="30" y="94" width="4" height="2" fill="#ff6600"/>
  <rect x="110" y="48" width="4" height="2" fill="#ff6600"/>
  <rect x="110" y="94" width="4" height="2" fill="#ff6600"/>
</svg>