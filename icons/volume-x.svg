<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144">
  <defs>
    <linearGradient id="volumeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0080ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0000;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="redGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="144" height="144" fill="#0a0a0a" rx="8"/>
  
  <!-- Tech border -->
  <rect x="4" y="4" width="136" height="136" fill="none" stroke="url(#volumeGrad)" stroke-width="1" rx="6" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Speaker body -->
  <rect x="25" y="50" width="35" height="44" fill="url(#volumeGrad)" rx="2" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 1,0; 0,0" dur="0.8s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Speaker cone -->
  <polygon points="60,50 90,35 90,109 60,94" fill="url(#volumeGrad)" opacity="0.8" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 1,0; 0,0" dur="0.8s" repeatCount="indefinite"/>
  </polygon>
  
  <!-- Sound waves (crossed out) -->
  <g opacity="0.4">
    <path d="M 95 60 Q 105 65 105 72 Q 105 79 95 84" stroke="url(#volumeGrad)" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 98 52 Q 115 60 115 72 Q 115 84 98 92" stroke="url(#volumeGrad)" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- X mark overlay -->
  <g filter="url(#redGlow)">
    <line x1="100" y1="45" x2="130" y2="75" stroke="url(#xGrad)" stroke-width="4" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="130" y1="45" x2="100" y2="75" stroke="url(#xGrad)" stroke-width="4" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Noise indicator particles -->
  <g>
    <circle cx="110" cy="90" r="2" fill="#ff4444" opacity="0.8">
      <animate attributeName="cy" values="90;85;90" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="95" r="1.5" fill="#ff6666" opacity="0.6">
      <animate attributeName="cy" values="95;88;95" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="105" cy="100" r="1.5" fill="#ff6666" opacity="0.7">
      <animate attributeName="cy" values="100;93;100" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Corner accent -->
  <polygon points="4,4 15,4 4,15" fill="url(#volumeGrad)" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </polygon>
</svg>