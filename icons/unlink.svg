<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="unlinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#880000;stop-opacity:1" />
    </linearGradient>
    <filter id="unlinkGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#ff4444" stroke-width="2"/>
  
  <!-- Broken chain link 1 -->
  <path d="M40 45 Q35 35 45 35 Q55 35 50 45 Q45 55 40 45" 
        fill="none" 
        stroke="url(#unlinkGrad)" 
        stroke-width="6" 
        filter="url(#unlinkGlow)">
    <animate attributeName="stroke-opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Break point sparks -->
  <circle cx="57" cy="50" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite" begin="0s"/>
  </circle>
  
  <circle cx="55" cy="53" r="1" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  
  <!-- Broken chain link 2 -->
  <path d="M94 99 Q99 109 89 109 Q79 109 84 99 Q89 89 94 99" 
        fill="none" 
        stroke="url(#unlinkGrad)" 
        stroke-width="6" 
        filter="url(#unlinkGlow)">
    <animate attributeName="stroke-opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite" begin="1s"/>
  </path>
  
  <!-- Break point sparks -->
  <circle cx="77" cy="94" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <circle cx="79" cy="91" r="1" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
  
  <!-- Disconnection X -->
  <path d="M65 65 L79 79 M79 65 L65 79" 
        stroke="#ff0000" 
        stroke-width="4" 
        stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Separation field -->
  <circle cx="72" cy="72" r="25" fill="none" stroke="#ff4444" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="25;35;25" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Decouple indicator -->
  <rect x="25" y="25" width="25" height="6" fill="#003366" stroke="#ff4444" stroke-width="1" rx="2"/>
  <text x="37" y="30" font-family="monospace" font-size="6" fill="#ff4444" text-anchor="middle">DECOUPLE</text>
  
  <!-- Energy discharge -->
  <path d="M60 60 Q55 55 65 55" stroke="#ffff00" stroke-width="2" fill="none" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.3s" repeatCount="indefinite" begin="0s"/>
  </path>
  
  <path d="M84 84 Q89 89 79 89" stroke="#ffff00" stroke-width="2" fill="none" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.3s" repeatCount="indefinite" begin="0.5s"/>
  </path>
</svg>