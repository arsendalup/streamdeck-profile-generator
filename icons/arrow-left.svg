<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#88ff00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#44ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228800;stop-opacity:1" />
    </linearGradient>
    <filter id="arrowGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#88ff00" stroke-width="2"/>
  
  <!-- Arrow shaft -->
  <rect x="50" y="65" width="40" height="14" fill="url(#arrowGrad)" filter="url(#arrowGlow)">
    <animate attributeName="fill-opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Arrow head -->
  <path d="M35 72 L55 54 L55 66 L50 72 L55 78 L55 90 Z" 
        fill="url(#arrowGrad)" 
        filter="url(#arrowGlow)">
    <animate attributeName="fill-opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Movement trail -->
  <path d="M70 72 L85 72 L100 72" 
        stroke="#aaffaa" 
        stroke-width="2" 
        fill="none" 
        opacity="0.5"
        stroke-dasharray="5 5">
    <animate attributeName="stroke-dashoffset" values="0;-10;0" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Energy particles -->
  <circle cx="45" cy="72" r="2" fill="#ffffff">
    <animate attributeName="cx" values="45;25;45" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>