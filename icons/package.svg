<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="packageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D2B48C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B7355;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Package box -->
  <rect x="16" y="24" width="40" height="32" rx="2" fill="url(#packageGrad)" stroke="#654321" stroke-width="2">
    <animate attributeName="transform" values="scale(1); scale(1.01); scale(1)" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Box top flaps -->
  <path d="M16 24 L32 16 L40 16 L56 24" fill="url(#packageGrad)" stroke="#654321" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Box side -->
  <path d="M56 24 L56 56 L40 48 L40 16" fill="#A0826D" stroke="#654321" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Tape strips -->
  <rect x="14" y="36" width="44" height="4" rx="1" fill="url(#tapeGrad)" stroke="#B8860B" stroke-width="1">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="34" y="22" width="4" height="36" rx="1" fill="url(#tapeGrad)" stroke="#B8860B" stroke-width="1">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" begin="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Address label -->
  <rect x="20" y="28" width="16" height="12" rx="1" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <rect x="22" y="30" width="12" height="1" fill="#333333"/>
  <rect x="22" y="32" width="10" height="1" fill="#333333"/>
  <rect x="22" y="34" width="8" height="1" fill="#333333"/>
  <rect x="22" y="36" width="6" height="1" fill="#333333"/>
  
  <!-- Barcode -->
  <g transform="translate(42, 30)">
    <rect x="0" y="0" width="1" height="8" fill="#000000"/>
    <rect x="2" y="0" width="0.5" height="8" fill="#000000"/>
    <rect x="3.5" y="0" width="1.5" height="8" fill="#000000"/>
    <rect x="6" y="0" width="0.5" height="8" fill="#000000"/>
    <rect x="7" y="0" width="1" height="8" fill="#000000"/>
    <rect x="9" y="0" width="0.5" height="8" fill="#000000"/>
    <rect x="10.5" y="0" width="1" height="8" fill="#000000"/>
  </g>
  
  <!-- Fragile stickers -->
  <g transform="translate(20, 44)">
    <polygon points="6,0 12,4 6,8 0,4" fill="#ff3333" stroke="#ffffff" stroke-width="1"/>
    <text x="6" y="5" text-anchor="middle" font-family="Arial" font-size="4" font-weight="bold" fill="#ffffff">!</text>
  </g>
  
  <!-- Shipping arrows -->
  <g transform="translate(44, 46)" opacity="0.8">
    <path d="M0 0 L8 0 M4 -2 L8 0 L4 2" stroke="#333333" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="4" y="6" text-anchor="middle" font-family="Arial" font-size="4" fill="#333333">UP</text>
  </g>
  
  <!-- Package weight -->
  <circle cx="48" cy="52" r="3" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="48" y="54" text-anchor="middle" font-family="Arial" font-size="4" fill="#333333">2kg</text>
  
  <!-- Delivery status -->
  <g transform="translate(24, 60)" opacity="0.7">
    <rect width="24" height="6" rx="2" fill="#00ff00" stroke="#ffffff" stroke-width="1"/>
    <text x="12" y="4.5" text-anchor="middle" font-family="Arial" font-size="4" font-weight="bold" fill="#000000">DELIVERED</text>
  </g>
  
  <!-- Tracking dots -->
  <g transform="translate(10, 20)" opacity="0.6">
    <circle cx="0" cy="0" r="2" fill="#00ff00"/>
    <circle cx="8" cy="0" r="2" fill="#00ff00"/>
    <circle cx="16" cy="0" r="2" fill="#ffff00"/>
    <circle cx="24" cy="0" r="2" fill="#cccccc"/>
    <circle cx="32" cy="0" r="2" fill="#cccccc"/>
  </g>
  
  <!-- Handle/grip marks -->
  <g opacity="0.5">
    <rect x="12" y="30" width="2" height="4" rx="1" fill="#654321"/>
    <rect x="12" y="36" width="2" height="4" rx="1" fill="#654321"/>
    <rect x="12" y="42" width="2" height="4" rx="1" fill="#654321"/>
    
    <rect x="58" y="30" width="2" height="4" rx="1" fill="#654321"/>
    <rect x="58" y="36" width="2" height="4" rx="1" fill="#654321"/>
    <rect x="58" y="42" width="2" height="4" rx="1" fill="#654321"/>
  </g>
  
  <!-- Shipping company logo -->
  <circle cx="30" cy="48" r="4" fill="#0066cc" stroke="#ffffff" stroke-width="1"/>
  <text x="30" y="50" text-anchor="middle" font-family="Arial" font-size="4" font-weight="bold" fill="#ffffff">SC</text>
  
  <!-- Package shadow -->
  <ellipse cx="38" cy="60" rx="16" ry="4" fill="#000000" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Priority indicator -->
  <g transform="translate(52, 28)">
    <polygon points="4,0 8,3 4,6 0,3" fill="#ff6600" stroke="#ffffff" stroke-width="1">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite"/>
    </polygon>
    <text x="4" y="4" text-anchor="middle" font-family="Arial" font-size="3" font-weight="bold" fill="#ffffff">!</text>
  </g>
  
  <!-- GPS tracking -->
  <g transform="translate(8, 52)" opacity="0.6">
    <circle cx="0" cy="0" r="2" fill="#00ff00"/>
    <circle cx="0" cy="0" r="4" fill="none" stroke="#00ff00" stroke-width="1">
      <animate attributeName="r" values="2;6;2" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>