<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(12, 12)">
    <!-- Package/cargo container -->
    <rect x="8" y="16" width="32" height="24" fill="#2d4a5a" stroke="#ffffff" stroke-width="2" rx="4"/>
    
    <!-- Package details -->
    <rect x="12" y="20" width="24" height="4" fill="#4a9eff"/>
    <rect x="12" y="26" width="16" height="2" fill="#ffffff"/>
    <rect x="12" y="30" width="20" height="2" fill="#ffffff"/>
    
    <!-- Drop/eject indicator -->
    <path d="M24 8 L20 12 L22 12 L22 16 L26 16 L26 12 L28 12 Z" fill="#ff4444"/>
    
    <!-- X mark overlay (indicating drop/remove) -->
    <g transform="translate(24, 24)">
      <circle cx="0" cy="0" r="8" fill="#ff4444" opacity="0.9"/>
      <line x1="-4" y1="-4" x2="4" y2="4" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <line x1="4" y1="-4" x2="-4" y2="4" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- Motion lines showing cargo being dropped -->
    <g opacity="0.7">
      <path d="M16 44 Q20 46, 24 44" stroke="#ff4444" stroke-width="2" fill="none"/>
      <path d="M20 46 Q24 48, 28 46" stroke="#ff4444" stroke-width="2" fill="none"/>
    </g>
    
    <!-- Ground impact -->
    <rect x="10" y="44" width="28" height="2" fill="#2d4a5a"/>
    <circle cx="16" cy="46" r="1" fill="#ff4444"/>
    <circle cx="24" cy="46" r="1" fill="#ff4444"/>
    <circle cx="32" cy="46" r="1" fill="#ff4444"/>
  </g>
</svg>