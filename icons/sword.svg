<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="swordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#silver;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c0c0c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#654321;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A2C17;stop-opacity:1" />
    </linearGradient>
    <filter id="blade-glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#c0c0c0" stroke-width="2"/>
  
  <!-- Blade -->
  <path d="M72 25 L80 35 L76 100 L68 100 Z" fill="url(#swordGrad)" filter="url(#blade-glow)">
    <animate attributeName="fill-opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Blade edge -->
  <path d="M72 25 L76 35 L74 100 L72 100 Z" fill="#ffffff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Guard -->
  <rect x="58" y="95" width="28" height="6" fill="url(#swordGrad)" rx="3"/>
  
  <!-- Handle -->
  <rect x="67" y="101" width="10" height="20" fill="url(#handleGrad)" rx="5"/>
  
  <!-- Pommel -->
  <circle cx="72" cy="125" r="6" fill="url(#swordGrad)"/>
  
  <!-- Energy effect -->
  <path d="M72 25 L74 30 L72 35 L70 30 Z" fill="#00ffff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1s" repeatCount="indefinite"/>
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0 0;0 -5;0 0" 
      dur="1s" 
      repeatCount="indefinite"/>
  </path>
  
  <!-- Combat trails -->
  <path d="M85 40 Q90 45 85 50" stroke="#ff4444" stroke-width="2" fill="none" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="0.5s" repeatCount="indefinite" begin="0s"/>
  </path>
  
  <path d="M59 60 Q54 65 59 70" stroke="#ff4444" stroke-width="2" fill="none" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="0.5s" repeatCount="indefinite" begin="0.25s"/>
  </path>
</svg>