<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#silver;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#404040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#606060;stop-opacity:1" />
    </linearGradient>
    <filter id="wrenchGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#silver" stroke-width="2"/>
  
  <!-- Wrench head -->
  <path d="M35 35 L50 35 L50 45 L60 45 L60 55 L50 55 L50 65 L35 65 Z" 
        fill="url(#wrenchGrad)" 
        filter="url(#wrenchGlow)"/>
  
  <!-- Wrench handle -->
  <rect x="50" y="45" width="60" height="10" fill="url(#wrenchGrad)" rx="5"/>
  
  <!-- Adjustable jaw -->
  <path d="M35 45 L45 45 L45 55 L35 55 Z" fill="url(#wrenchGrad)">
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0 0;-3 0;0 0" 
      dur="2s" 
      repeatCount="indefinite"/>
  </path>
  
  <!-- Wrench grip -->
  <rect x="95" y="43" width="15" height="14" fill="url(#wrenchGrad)" rx="7"/>
  
  <!-- Tech lines -->
  <rect x="55" y="47" width="2" height="6" fill="#00ffff" opacity="0.8"/>
  <rect x="60" y="47" width="2" height="6" fill="#00ffff" opacity="0.8"/>
  <rect x="65" y="47" width="2" height="6" fill="#00ffff" opacity="0.8"/>
  
  <!-- Work sparks -->
  <circle cx="40" cy="50" r="1" fill="#ffff00">
    <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite" begin="0s"/>
  </circle>
  
  <circle cx="45" cy="47" r="1" fill="#ffff00">
    <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  
  <circle cx="38" cy="53" r="1" fill="#ffff00">
    <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
  
  <!-- Status indicator -->
  <circle cx="105" cy="50" r="3" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>