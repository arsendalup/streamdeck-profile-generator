<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cameraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#666666;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lensGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#333333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#666666;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Camera body -->
  <rect x="14" y="22" width="44" height="32" rx="4" fill="url(#cameraGrad)" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Lens -->
  <circle cx="36" cy="38" r="12" fill="url(#lensGrad)" stroke="#00d4ff" stroke-width="2"/>
  <circle cx="36" cy="38" r="8" fill="#000000" opacity="0.8"/>
  <circle cx="36" cy="38" r="3" fill="#00d4ff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Flash -->
  <rect x="48" y="26" width="6" height="4" rx="2" fill="#ffffff" stroke="#00d4ff" stroke-width="1">
    <animate attributeName="fill" values="#ffffff;#ffff00;#ffffff" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Selfie stick -->
  <line x1="58" y1="38" x2="68" y2="28" stroke="#00d4ff" stroke-width="3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 58 38;-10 58 38;0 58 38" dur="4s" repeatCount="indefinite"/>
  </line>
  
  <!-- Handle -->
  <circle cx="68" cy="28" r="4" fill="url(#cameraGrad)" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Screen flip indicator -->
  <path d="M20 28 Q18 26 20 24 Q22 26 20 28" fill="#00d4ff">
    <animateTransform attributeName="transform" type="rotate" values="0 20 26;360 20 26" dur="3s" repeatCount="indefinite"/>
  </path>
</svg>