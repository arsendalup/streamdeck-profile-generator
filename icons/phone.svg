<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(16, 8)">
    <!-- Phone body -->
    <rect x="8" y="4" width="24" height="48" fill="#2d4a5a" stroke="#ffffff" stroke-width="2" rx="6"/>
    
    <!-- Screen -->
    <rect x="12" y="12" width="16" height="24" fill="#4a9eff" stroke="#ffffff" stroke-width="1" rx="2"/>
    
    <!-- Communication waves -->
    <path d="M2 20 Q4 16, 6 20 Q4 24, 2 20" stroke="#44ff44" stroke-width="2" fill="none"/>
    <path d="M34 20 Q36 16, 38 20 Q36 24, 34 20" stroke="#44ff44" stroke-width="2" fill="none"/>
    
    <!-- Signal strength bars -->
    <rect x="14" y="16" width="2" height="4" fill="#44ff44"/>
    <rect x="17" y="14" width="2" height="6" fill="#44ff44"/>
    <rect x="20" y="12" width="2" height="8" fill="#44ff44"/>
    <rect x="23" y="10" width="2" height="10" fill="#44ff44"/>
    <rect x="26" y="8" width="2" height="12" fill="#44ff44"/>
    
    <!-- Speaker -->
    <rect x="16" y="8" width="8" height="2" fill="#ffffff" rx="1"/>
    
    <!-- Hail indicator -->
    <circle cx="20" cy="24" r="3" fill="#ff4444"/>
    <text x="20" y="27" text-anchor="middle" fill="#ffffff" font-size="6">H</text>
    
    <!-- Control buttons -->
    <circle cx="16" cy="44" r="3" fill="#44ff44"/>
    <circle cx="24" cy="44" r="3" fill="#ff4444"/>
    
    <!-- Communication status -->
    <text x="20" y="58" text-anchor="middle" fill="#4a9eff" font-size="8">HAIL</text>
  </g>
</svg>