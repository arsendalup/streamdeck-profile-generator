<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pickaxeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#silver;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#404040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#606060;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="oreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffaa00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#884400;stop-opacity:1" />
    </linearGradient>
    <filter id="miningGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#ffaa00" stroke-width="2"/>
  
  <!-- Pickaxe handle -->
  <rect x="68" y="45" width="8" height="60" fill="url(#pickaxeGrad)" rx="4"/>
  
  <!-- Pickaxe head -->
  <path d="M50 40 L65 35 L72 45 L72 55 L65 65 L50 60 Z" fill="url(#pickaxeGrad)" filter="url(#miningGlow)"/>
  
  <!-- Pickaxe point -->
  <path d="M35 50 L50 45 L50 55 Z" fill="url(#pickaxeGrad)"/>
  
  <!-- Mining beam -->
  <path d="M35 50 L25 50" stroke="#ffff00" stroke-width="3" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="3;5;3" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Ore deposits -->
  <circle cx="95" cy="45" r="4" fill="url(#oreGlow)">
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="105" cy="60" r="3" fill="url(#oreGlow)">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  
  <circle cx="90" cy="75" r="5" fill="url(#oreGlow)">
    <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <!-- Mining sparks -->
  <circle cx="30" cy="45" r="1" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="0.3s" repeatCount="indefinite" begin="0s"/>
  </circle>
  
  <circle cx="25" cy="55" r="1" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="0.3s" repeatCount="indefinite" begin="0.1s"/>
  </circle>
  
  <!-- Power indicator -->
  <rect x="70" y="35" width="4" height="8" fill="#00ff00" rx="2">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Ore scanner -->
  <circle cx="72" cy="105" r="6" fill="#003366" stroke="#00ffff" stroke-width="1">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="72" cy="105" r="3" fill="#00ffff" opacity="0.8">
    <animate attributeName="r" values="3;8;3" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>