<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144">
  <defs>
    <linearGradient id="windGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87ceeb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4682b4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e90ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="breathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f6ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#87ceeb;stop-opacity:0.4" />
    </linearGradient>
    <filter id="windGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="144" height="144" fill="#0a0a0a" rx="8"/>
  
  <!-- Tech border -->
  <rect x="4" y="4" width="136" height="136" fill="none" stroke="url(#windGrad)" stroke-width="1" rx="6" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Wind flow lines -->
  <g stroke="url(#windGrad)" stroke-width="2" fill="none" filter="url(#windGlow)">
    <!-- Main wind stream -->
    <path d="M 15 72 Q 40 65 65 72 Q 90 79 115 72 Q 130 68 140 72" opacity="0.9">
      <animate attributeName="d" values="M 15 72 Q 40 65 65 72 Q 90 79 115 72 Q 130 68 140 72;M 15 72 Q 40 68 65 75 Q 90 82 115 75 Q 130 71 140 75;M 15 72 Q 40 65 65 72 Q 90 79 115 72 Q 130 68 140 72" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- Secondary wind lines -->
    <path d="M 20 55 Q 50 50 80 55 Q 110 60 135 55" opacity="0.6">
      <animate attributeName="d" values="M 20 55 Q 50 50 80 55 Q 110 60 135 55;M 20 55 Q 50 52 80 58 Q 110 63 135 58;M 20 55 Q 50 50 80 55 Q 110 60 135 55" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.2s" repeatCount="indefinite"/>
    </path>
    
    <path d="M 25 90 Q 55 85 85 90 Q 115 95 130 90" opacity="0.6">
      <animate attributeName="d" values="M 25 90 Q 55 85 85 90 Q 115 95 130 90;M 25 90 Q 55 87 85 93 Q 115 98 130 93;M 25 90 Q 55 85 85 90 Q 115 95 130 90" dur="3.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Wind particles -->
  <g fill="url(#breathGrad)">
    <circle cx="30" r="1.5" cy="72" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; 100,5; 120,8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" r="1" cy="58" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0,0; 110,3; 130,5" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35" r="1.2" cy="88" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; 95,4; 115,7" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25" r="0.8" cy="65" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0,0; 105,2; 125,4" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Breathing indicator -->
  <g transform="translate(72,72)">
    <circle r="8" fill="none" stroke="url(#windGrad)" stroke-width="1.5" opacity="0.6">
      <animateTransform attributeName="transform" type="scale" values="0.8;1.2;0.8" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="url(#breathGrad)" opacity="0.4">
      <animateTransform attributeName="transform" type="scale" values="1;0.6;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Corner tech accent -->
  <polygon points="4,4 18,4 4,18" fill="url(#windGrad)" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </polygon>
  
  <!-- Breath hold indicator -->
  <rect x="115" y="20" width="20" height="4" fill="url(#windGrad)" rx="2" opacity="0.7">
    <animate attributeName="width" values="20;5;20" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>