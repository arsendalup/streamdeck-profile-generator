<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#silver;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#404040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="energy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0080ff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Tool handle -->
  <rect x="45" y="80" width="16" height="45" fill="url(#toolGrad)" rx="8"/>
  <rect x="83" y="80" width="16" height="45" fill="url(#toolGrad)" rx="8"/>
  
  <!-- Tool body -->
  <ellipse cx="72" cy="65" rx="35" ry="20" fill="url(#toolGrad)"/>
  
  <!-- Energy core -->
  <circle cx="72" cy="65" r="12" fill="url(#energy)">
    <animate attributeName="r" values="12;15;12" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Tool attachment points -->
  <circle cx="55" cy="60" r="4" fill="#00ffff"/>
  <circle cx="89" cy="60" r="4" fill="#00ffff"/>
  <circle cx="72" cy="45" r="4" fill="#00ffff"/>
  
  <!-- Multi-tool modules -->
  <rect x="35" y="55" width="12" height="8" fill="#ff6600" rx="2">
    <animate attributeName="fill" values="#ff6600;#ffaa00;#ff6600" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <rect x="97" y="55" width="12" height="8" fill="#00ff00" rx="2">
    <animate attributeName="fill" values="#00ff00;#88ff00;#00ff00" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Status indicator -->
  <circle cx="72" cy="35" r="3" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>