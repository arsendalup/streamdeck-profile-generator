<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8800;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff4400;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#aa2200;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="pinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ff8800;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#663300;stop-opacity:0.3" />
    </radialGradient>
    <filter id="pinFilter">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#ff8800" stroke-width="2"/>
  
  <!-- Pin head -->
  <circle cx="72" cy="45" r="15" fill="url(#pinGrad)" filter="url(#pinFilter)"/>
  
  <!-- Pin point -->
  <path d="M72 60 L72 110 L70 115 L72 120 L74 115 Z" 
        fill="url(#pinGrad)" 
        filter="url(#pinFilter)"/>
  
  <!-- Pin center -->
  <circle cx="72" cy="45" r="8" fill="url(#pinGlow)">
    <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Location marker -->
  <circle cx="72" cy="45" r="4" fill="#ffffff">
    <animate attributeName="fill-opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Shadow -->
  <ellipse cx="74" cy="125" rx="8" ry="3" fill="#000000" opacity="0.3"/>
  
  <!-- Target lock rings -->
  <circle cx="72" cy="45" r="20" fill="none" stroke="#ff8800" stroke-width="1" opacity="0.6">
    <animate attributeName="r" values="20;25;20" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="72" cy="45" r="30" fill="none" stroke="#ff8800" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="30;35;30" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  
  <!-- Pin number indicator -->
  <text x="72" y="50" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <!-- Pinned status -->
  <rect x="25" y="25" width="20" height="6" fill="#003366" stroke="#ff8800" stroke-width="1" rx="2"/>
  <text x="35" y="30" font-family="monospace" font-size="6" fill="#ff8800" text-anchor="middle">PINNED</text>
  
  <!-- Pin attachment beam -->
  <path d="M72 120 L72 135" stroke="#ff8800" stroke-width="3" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Tracking indicators -->
  <circle cx="95" cy="35" r="2" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="49" cy="35" r="2" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="1s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  
  <!-- Data link -->
  <path d="M85 45 Q95 40 105 45" stroke="#88ffaa" stroke-width="1" fill="none" opacity="0.6" stroke-dasharray="2 2">
    <animate attributeName="stroke-dashoffset" values="0;-8;0" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <path d="M59 45 Q49 40 39 45" stroke="#88ffaa" stroke-width="1" fill="none" opacity="0.6" stroke-dasharray="2 2">
    <animate attributeName="stroke-dashoffset" values="0;8;0" dur="1.5s" repeatCount="indefinite"/>
  </path>
</svg>