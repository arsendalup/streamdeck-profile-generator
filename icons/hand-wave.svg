<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(16, 12)">
    <\!-- Head -->
    <circle cx="20" cy="12" r="8" fill="#4a9eff" stroke="#ffffff" stroke-width="2"/>
    <\!-- Body -->
    <rect x="14" y="20" width="12" height="18" fill="#2d4a5a" stroke="#ffffff" stroke-width="2" rx="3"/>
    <\!-- Waving arm -->
    <circle cx="8" cy="25" r="3" fill="#4a9eff"/>
    <path d="M8 25 Q4 20, 8 15 Q12 20, 8 25" fill="#4a9eff" stroke="#ffffff" stroke-width="2"/>
    <\!-- Other arm -->
    <circle cx="32" cy="30" r="3" fill="#4a9eff"/>
    <path d="M32 30 L28 26" stroke="#ffffff" stroke-width="2"/>
    <\!-- Legs -->
    <rect x="16" y="38" width="4" height="12" fill="#2d4a5a"/>
    <rect x="20" y="38" width="4" height="12" fill="#2d4a5a"/>
    <\!-- Motion lines for waving -->
    <g stroke="#4a9eff" stroke-width="1" opacity="0.7">
      <path d="M2 18 Q6 16, 10 18"/>
      <path d="M2 22 Q6 20, 10 22"/>
    </g>
  </g>
</svg>
