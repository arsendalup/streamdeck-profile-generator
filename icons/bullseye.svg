<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(16, 16)">
    <!-- Outer ring -->
    <circle cx="20" cy="20" r="18" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Middle ring -->
    <circle cx="20" cy="20" r="12" fill="none" stroke="#4a9eff" stroke-width="2"/>
    
    <!-- Inner ring -->
    <circle cx="20" cy="20" r="6" fill="none" stroke="#ff4444" stroke-width="2"/>
    
    <!-- Center dot -->
    <circle cx="20" cy="20" r="2" fill="#ff4444"/>
    
    <!-- Crosshairs -->
    <line x1="20" y1="2" x2="20" y2="8" stroke="#ffffff" stroke-width="2"/>
    <line x1="20" y1="32" x2="20" y2="38" stroke="#ffffff" stroke-width="2"/>
    <line x1="2" y1="20" x2="8" y2="20" stroke="#ffffff" stroke-width="2"/>
    <line x1="32" y1="20" x2="38" y2="20" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Target indicators -->
    <circle cx="20" cy="8" r="1" fill="#44ff44"/>
    <circle cx="20" cy="32" r="1" fill="#44ff44"/>
    <circle cx="8" cy="20" r="1" fill="#44ff44"/>
    <circle cx="32" cy="20" r="1" fill="#44ff44"/>
  </g>
</svg>