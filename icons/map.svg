<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6f3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b3d9ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#90EE90;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Map background -->
  <rect x="8" y="12" width="56" height="48" rx="4" fill="url(#mapGrad)" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Grid lines -->
  <g stroke="#cccccc" stroke-width="0.5" opacity="0.6">
    <line x1="20" y1="12" x2="20" y2="60"/>
    <line x1="32" y1="12" x2="32" y2="60"/>
    <line x1="44" y1="12" x2="44" y2="60"/>
    <line x1="56" y1="12" x2="56" y2="60"/>
    <line x1="8" y1="24" x2="64" y2="24"/>
    <line x1="8" y1="36" x2="64" y2="36"/>
    <line x1="8" y1="48" x2="64" y2="48"/>
  </g>
  
  <!-- Landmasses -->
  <path d="M12 20 Q18 16 24 20 Q28 18 32 22 Q30 28 26 30 Q20 32 16 28 Q12 24 12 20 Z" 
        fill="url(#landGrad)" stroke="#228B22" stroke-width="1"/>
  
  <path d="M40 26 Q46 24 52 28 Q56 30 58 36 Q54 40 48 38 Q42 36 38 32 Q38 28 40 26 Z" 
        fill="url(#landGrad)" stroke="#228B22" stroke-width="1"/>
  
  <path d="M14 42 Q20 40 26 44 Q30 46 28 52 Q24 54 18 52 Q12 48 14 42 Z" 
        fill="url(#landGrad)" stroke="#228B22" stroke-width="1"/>
  
  <!-- Water/ocean areas -->
  <g opacity="0.7">
    <circle cx="35" cy="20" r="3" fill="#4169E1"/>
    <circle cx="22" cy="38" r="2" fill="#4169E1"/>
    <circle cx="50" cy="44" r="2" fill="#4169E1"/>
  </g>
  
  <!-- Mountain ranges -->
  <g fill="#8B4513" stroke="#654321" stroke-width="0.5">
    <polygon points="20,22 22,18 24,22"/>
    <polygon points="26,24 28,20 30,24"/>
    <polygon points="46,30 48,26 50,30"/>
  </g>
  
  <!-- Cities/settlements -->
  <g>
    <circle cx="18" cy="26" r="2" fill="#ff6600" stroke="#ffffff" stroke-width="1">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="44" cy="32" r="2" fill="#ff6600" stroke="#ffffff" stroke-width="1">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="22" cy="46" r="2" fill="#ff6600" stroke="#ffffff" stroke-width="1">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Routes/paths -->
  <g stroke="#8B4513" stroke-width="2" fill="none" stroke-dasharray="3,2">
    <path d="M18 26 Q30 24 44 32">
      <animate attributeName="stroke-dashoffset" values="0;5" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M44 32 Q35 40 22 46">
      <animate attributeName="stroke-dashoffset" values="0;5" dur="2s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Compass rose -->
  <g transform="translate(56, 20)">
    <circle cx="0" cy="0" r="6" fill="#ffffff" stroke="#00d4ff" stroke-width="1"/>
    <path d="M0,-4 L2,0 L0,4 L-2,0 Z" fill="#ff3333"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Arial" font-size="6" fill="#333333">N</text>
  </g>
  
  <!-- Legend -->
  <rect x="10" y="52" width="20" height="6" rx="2" fill="#ffffff" stroke="#cccccc" stroke-width="1" opacity="0.9"/>
  <circle cx="13" cy="55" r="1" fill="#ff6600"/>
  <text x="16" y="56" font-family="Arial" font-size="4" fill="#333333">Cities</text>
  
  <!-- Scale -->
  <g transform="translate(40, 54)">
    <line x1="0" y1="0" x2="12" y2="0" stroke="#333333" stroke-width="1"/>
    <line x1="0" y1="-1" x2="0" y2="1" stroke="#333333" stroke-width="1"/>
    <line x1="12" y1="-1" x2="12" y2="1" stroke="#333333" stroke-width="1"/>
    <text x="6" y="4" text-anchor="middle" font-family="Arial" font-size="4" fill="#333333">10km</text>
  </g>
  
  <!-- Map scanning animation -->
  <rect x="8" y="12" width="4" height="48" fill="url(#mapGrad)" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0; 52,0; 0,0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>