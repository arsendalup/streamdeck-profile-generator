<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(16, 8)">
    <!-- Control tower base -->
    <rect x="14" y="32" width="12" height="24" fill="#2d4a5a" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Control tower top -->
    <rect x="8" y="16" width="24" height="20" fill="#4a9eff" stroke="#ffffff" stroke-width="2" rx="2"/>
    
    <!-- Control windows -->
    <rect x="12" y="20" width="6" height="8" fill="#44ff44" stroke="#ffffff" stroke-width="1"/>
    <rect x="22" y="20" width="6" height="8" fill="#44ff44" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Communication antenna -->
    <rect x="18" y="8" width="4" height="12" fill="#ffffff"/>
    <circle cx="20" cy="6" r="2" fill="#ff4444"/>
    
    <!-- Landing pad -->
    <rect x="0" y="56" width="40" height="4" fill="#2d4a5a" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Communication signals -->
    <path d="M4 24 Q8 20, 12 24" stroke="#44ff44" stroke-width="2" fill="none"/>
    <path d="M28 24 Q32 20, 36 24" stroke="#44ff44" stroke-width="2" fill="none"/>
    
    <!-- Signal waves -->
    <circle cx="20" cy="6" r="8" fill="none" stroke="#ff4444" stroke-width="1" opacity="0.6"/>
    <circle cx="20" cy="6" r="12" fill="none" stroke="#ff4444" stroke-width="1" opacity="0.4"/>
    <circle cx="20" cy="6" r="16" fill="none" stroke="#ff4444" stroke-width="1" opacity="0.2"/>
    
    <!-- Landing lights -->
    <circle cx="8" cy="58" r="1" fill="#44ff44"/>
    <circle cx="20" cy="58" r="1" fill="#44ff44"/>
    <circle cx="32" cy="58" r="1" fill="#44ff44"/>
    
    <!-- Status indicator -->
    <text x="20" y="48" text-anchor="middle" fill="#44ff44" font-size="6">ATC</text>
  </g>
</svg>