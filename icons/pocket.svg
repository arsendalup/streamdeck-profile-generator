<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4169E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fabricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main pocket -->
  <path d="M20 20 L52 20 Q56 20 56 24 L56 48 Q56 56 48 56 L24 56 Q16 56 16 48 L16 24 Q16 20 20 20 Z" 
        fill="url(#pocketGrad)" stroke="#ffffff" stroke-width="2">
    <animate attributeName="transform" values="scale(1); scale(1.02); scale(1)" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Pocket opening -->
  <rect x="20" y="18" width="32" height="4" rx="2" fill="url(#fabricGrad)" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Stitching pattern -->
  <g stroke="#dddddd" stroke-width="1" fill="none" stroke-dasharray="2,2" opacity="0.8">
    <path d="M18 22 L18 50 Q18 54 22 54 L50 54 Q54 54 54 50 L54 22"/>
    <line x1="20" y1="20" x2="52" y2="20"/>
  </g>
  
  <!-- Items in pocket -->
  <g>
    <!-- Smartphone -->
    <rect x="24" y="26" width="8" height="16" rx="2" fill="#333333" stroke="#00d4ff" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,1; 0,0" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="25" y="28" width="6" height="10" rx="1" fill="#001122"/>
    <circle cx="28" cy="40" r="1" fill="#ffffff" opacity="0.6"/>
    
    <!-- Coins -->
    <circle cx="38" cy="32" r="2" fill="#FFD700" stroke="#DAA520" stroke-width="1">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42" cy="34" r="2" fill="#C0C0C0" stroke="#A0A0A0" stroke-width="1">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="38" r="2" fill="#CD7F32" stroke="#A0522D" stroke-width="1">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Keys -->
    <g transform="translate(45, 28)">
      <rect x="0" y="0" width="2" height="8" rx="1" fill="#C0C0C0" stroke="#A0A0A0" stroke-width="0.5"/>
      <circle cx="1" cy="2" r="1.5" fill="none" stroke="#C0C0C0" stroke-width="1"/>
      <rect x="0" y="6" width="3" height="1" fill="#C0C0C0"/>
      <rect x="0" y="7.5" width="2" height="0.5" fill="#C0C0C0"/>
    </g>
    
    <!-- Pen -->
    <rect x="26" y="44" width="1" height="8" rx="0.5" fill="#1E40AF" stroke="#ffffff" stroke-width="0.5"/>
    <circle cx="26.5" cy="52" r="0.5" fill="#333333"/>
    <rect x="26" y="44" width="1" height="2" fill="#FFD700"/>
  </g>
  
  <!-- Pocket bulge effect -->
  <path d="M20 24 Q28 22 36 24 Q44 22 52 24" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.3">
    <animate attributeName="d" values="M20 24 Q28 22 36 24 Q44 22 52 24;M20 24 Q28 26 36 24 Q44 26 52 24;M20 24 Q28 22 36 24 Q44 22 52 24" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- Fabric texture -->
  <g opacity="0.2">
    <circle cx="22" cy="26" r="0.5" fill="#ffffff"/>
    <circle cx="30" cy="30" r="0.5" fill="#ffffff"/>
    <circle cx="46" cy="32" r="0.5" fill="#ffffff"/>
    <circle cx="34" cy="48" r="0.5" fill="#ffffff"/>
    <circle cx="48" cy="46" r="0.5" fill="#ffffff"/>
  </g>
  
  <!-- Button -->
  <circle cx="36" cy="22" r="2" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  <circle cx="36" cy="22" r="1" fill="none" stroke="#654321" stroke-width="0.5"/>
  <circle cx="36" cy="22" r="0.5" fill="#654321"/>
  
  <!-- Pocket flap -->
  <path d="M28 16 L44 16 Q46 16 46 18 L46 22 L28 22 L28 18 Q28 16 30 16" 
        fill="url(#pocketGrad)" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  
  <!-- Brand tab -->
  <rect x="50" y="24" width="4" height="8" rx="1" fill="#ff3333" stroke="#ffffff" stroke-width="1"/>
  <text x="52" y="29" text-anchor="middle" font-family="Arial" font-size="4" font-weight="bold" fill="#ffffff">SC</text>
  
  <!-- Wear patterns -->
  <g opacity="0.3">
    <ellipse cx="24" cy="24" rx="2" ry="1" fill="#ffffff"/>
    <ellipse cx="48" cy="26" rx="2" ry="1" fill="#ffffff"/>
    <ellipse cx="36" cy="52" rx="4" ry="2" fill="#ffffff"/>
  </g>
  
  <!-- Zipper -->
  <rect x="19" y="18" width="2" height="6" rx="1" fill="#C0C0C0" stroke="#A0A0A0" stroke-width="0.5"/>
  <rect x="20" y="20" width="1" height="1" fill="#ffffff"/>
  
  <!-- Pocket depth shadow -->
  <path d="M20 20 L52 20 L52 24 L20 24 Z" fill="#000000" opacity="0.2"/>
  
  <!-- Contents weight indicator -->
  <g transform="translate(56, 40)" opacity="0.6">
    <circle cx="0" cy="0" r="3" fill="#ffff00" stroke="#ff6600" stroke-width="1"/>
    <text x="0" y="1" text-anchor="middle" font-family="Arial" font-size="4" fill="#333333">5</text>
  </g>
  
  <!-- Access animation -->
  <g opacity="0.4">
    <path d="M36 18 Q40 16 44 18" stroke="#ffffff" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>