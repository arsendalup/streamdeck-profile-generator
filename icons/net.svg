<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Net grid pattern -->
  <g stroke="url(#netGrad)" stroke-width="2" fill="none" opacity="0.8">
    <!-- Horizontal lines -->
    <line x1="12" y1="16" x2="60" y2="16">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="14" y1="24" x2="58" y2="24">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.2s" repeatCount="indefinite"/>
    </line>
    <line x1="16" y1="32" x2="56" y2="32">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="18" y1="40" x2="54" y2="40">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="20" y1="48" x2="52" y2="48">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="22" y1="56" x2="50" y2="56">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1s" repeatCount="indefinite"/>
    </line>
    
    <!-- Vertical lines -->
    <line x1="12" y1="16" x2="22" y2="56">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="20" y1="16" x2="30" y2="56">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="28" y1="16" x2="38" y2="56">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="36" y1="16" x2="46" y2="56">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="44" y1="16" x2="54" y2="56">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="52" y1="16" x2="62" y2="56">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1.3s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="16" x2="50" y2="56">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Net intersection points -->
  <g>
    <circle cx="20" cy="24" r="1" fill="#00d4ff"/>
    <circle cx="28" cy="24" r="1" fill="#00d4ff"/>
    <circle cx="36" cy="24" r="1" fill="#00d4ff"/>
    <circle cx="44" cy="24" r="1" fill="#00d4ff"/>
    <circle cx="52" cy="24" r="1" fill="#00d4ff"/>
    
    <circle cx="22" cy="32" r="1" fill="#00d4ff"/>
    <circle cx="30" cy="32" r="1" fill="#00d4ff"/>
    <circle cx="38" cy="32" r="1" fill="#00d4ff"/>
    <circle cx="46" cy="32" r="1" fill="#00d4ff"/>
    
    <circle cx="24" cy="40" r="1" fill="#00d4ff"/>
    <circle cx="32" cy="40" r="1" fill="#00d4ff"/>
    <circle cx="40" cy="40" r="1" fill="#00d4ff"/>
    <circle cx="48" cy="40" r="1" fill="#00d4ff"/>
    
    <circle cx="26" cy="48" r="1" fill="#00d4ff"/>
    <circle cx="34" cy="48" r="1" fill="#00d4ff"/>
    <circle cx="42" cy="48" r="1" fill="#00d4ff"/>
  </g>
  
  <!-- Trapped objects -->
  <g>
    <!-- Fish 1 -->
    <ellipse cx="32" cy="28" rx="4" ry="2" fill="#ff6600" stroke="#ffffff" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0; 2,1; -1,2; 0,0" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <polygon points="28,28 25,26 25,30" fill="#ff6600"/>
    
    <!-- Fish 2 -->
    <ellipse cx="45" cy="36" rx="3" ry="1.5" fill="#ffaa00" stroke="#ffffff" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0; -1,1; 1,2; 0,0" dur="2.5s" repeatCount="indefinite"/>
    </ellipse>
    <polygon points="42,36 40,35 40,37" fill="#ffaa00"/>
    
    <!-- Debris -->
    <circle cx="25" cy="44" r="1.5" fill="#cccccc" stroke="#ffffff" stroke-width="0.5">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <rect x="38" y="43" width="2" height="2" rx="0.5" fill="#996633" stroke="#ffffff" stroke-width="0.5">
      <animateTransform attributeName="transform" type="rotate" values="0 39 44;360 39 44" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Net frame/rim -->
  <ellipse cx="36" cy="16" rx="24" ry="3" fill="none" stroke="#ffffff" stroke-width="3"/>
  <ellipse cx="36" cy="16" rx="22" ry="2" fill="#00d4ff" opacity="0.3"/>
  
  <!-- Handle -->
  <rect x="34" y="8" width="4" height="12" rx="2" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  <ellipse cx="36" cy="6" rx="3" ry="2" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  
  <!-- Net movement effect -->
  <g opacity="0.4">
    <path d="M12 16 Q36 20 60 16" stroke="#ffffff" stroke-width="1" fill="none">
      <animate attributeName="d" values="M12 16 Q36 20 60 16;M12 16 Q36 18 60 16;M12 16 Q36 20 60 16" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Water ripples -->
  <g opacity="0.5">
    <ellipse cx="36" cy="60" rx="20" ry="4" fill="none" stroke="#00d4ff" stroke-width="1">
      <animate attributeName="rx" values="16;24;16" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="36" cy="60" rx="15" ry="3" fill="none" stroke="#00d4ff" stroke-width="1">
      <animate attributeName="rx" values="12;18;12" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Net weight -->
  <g transform="translate(36, 60)">
    <ellipse cx="0" cy="0" rx="6" ry="2" fill="#666666" stroke="#333333" stroke-width="1"/>
    <rect x="-4" y="-2" width="8" height="2" rx="1" fill="#999999"/>
  </g>
  
  <!-- Capture success indicator -->
  <text x="36" y="68" text-anchor="middle" font-family="Arial" font-size="6" fill="#00ff00" opacity="0.8">
    CAUGHT: 2
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </text>
</svg>