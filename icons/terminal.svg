<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000011;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Terminal window background -->
  <rect x="8" y="12" width="56" height="48" rx="4" fill="url(#terminalGrad)" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Title bar -->
  <rect x="8" y="12" width="56" height="8" rx="4" fill="#333333" stroke="#00d4ff" stroke-width="2"/>
  <rect x="8" y="16" width="56" height="4" fill="#333333"/>
  
  <!-- Window controls -->
  <circle cx="14" cy="16" r="2" fill="#ff3333" stroke="#ffffff" stroke-width="1"/>
  <circle cx="20" cy="16" r="2" fill="#ffff00" stroke="#ffffff" stroke-width="1"/>
  <circle cx="26" cy="16" r="2" fill="#00ff00" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Terminal title -->
  <text x="36" y="18" text-anchor="middle" font-family="monospace" font-size="4" fill="#ffffff">Terminal - Star Citizen</text>
  
  <!-- Terminal screen -->
  <rect x="10" y="22" width="52" height="36" fill="#000000" stroke="#003300" stroke-width="1"/>
  
  <!-- Command prompt lines -->
  <g font-family="monospace" font-size="6" fill="#00ff00">
    <!-- Previous commands -->
    <text x="12" y="28">user@ship:~$ ls -la</text>
    <text x="12" y="34">total 42</text>
    <text x="12" y="40">drwxr-xr-x  star-citizen/</text>
    <text x="12" y="46">-rw-r--r--  config.cfg</text>
    
    <!-- Current prompt -->
    <text x="12" y="52">user@ship:~$</text>
    
    <!-- Typed command -->
    <text x="78" y="52">scan --range 5000</text>
  </g>
  
  <!-- Cursor -->
  <rect x="158" y="48" width="4" height="8" fill="#00ff00">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- System status indicators -->
  <g transform="translate(12, 62)" font-family="monospace" font-size="4">
    <text fill="#ffff00">CPU: 45%</text>
    <text x="32" fill="#ff6600">MEM: 8.2GB</text>
    <text x="58" fill="#00aaff">NET: 125ms</text>
  </g>
  
  <!-- Command history -->
  <g transform="translate(66, 24)" opacity="0.6">
    <rect width="4" height="32" rx="2" fill="#333333" stroke="#666666" stroke-width="1"/>
    <rect x="1" y="2" width="2" height="8" rx="1" fill="#00ff00">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,20; 0,0" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Terminal activity indicator -->
  <circle cx="58" cy="16" r="2" fill="#00ff00" stroke="#ffffff" stroke-width="1">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Processing animation -->
  <g transform="translate(12, 56)" opacity="0.7">
    <text font-family="monospace" font-size="4" fill="#00aaff">
      Processing
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="52" font-family="monospace" font-size="4" fill="#00aaff">
      <animate attributeName="opacity" values="1;0;1" dur="0.5s" repeatCount="indefinite">.</animate>
      <animate attributeName="opacity" values="0;1;0" dur="0.5s" begin="0.2s" repeatCount="indefinite">.</animate>
      <animate attributeName="opacity" values="0;0;1" dur="0.5s" begin="0.4s" repeatCount="indefinite">.</animate>
    </text>
  </g>
  
  <!-- Connection status -->
  <g transform="translate(48, 8)" opacity="0.8">
    <rect width="16" height="6" rx="2" fill="#001100" stroke="#00ff00" stroke-width="1"/>
    <text x="8" y="4" text-anchor="middle" font-family="monospace" font-size="3" fill="#00ff00">
      CONNECTED
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Terminal output stream -->
  <g opacity="0.4">
    <rect x="12" y="24" width="2" height="1" fill="#00ff00">
      <animate attributeName="width" values="2;48;2" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="12" y="26" width="2" height="1" fill="#00ff00">
      <animate attributeName="width" values="2;36;2" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="12" y="28" width="2" height="1" fill="#00ff00">
      <animate attributeName="width" values="2;42;2" dur="3s" begin="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Error indicators -->
  <g transform="translate(12, 36)" opacity="0.6">
    <text font-family="monospace" font-size="4" fill="#ff3333">ERROR: Permission denied</text>
  </g>
  
  <!-- Command autocomplete -->
  <g transform="translate(12, 64)" opacity="0.7">
    <rect width="48" height="6" rx="2" fill="#002200" stroke="#00aa00" stroke-width="1"/>
    <text x="2" y="4" font-family="monospace" font-size="3" fill="#00aa00">scan --range | --target | --full</text>
  </g>
  
  <!-- Session time -->
  <g transform="translate(8, 8)" opacity="0.6">
    <rect width="12" height="6" rx="2" fill="#000011" stroke="#00d4ff" stroke-width="1"/>
    <text x="6" y="4" text-anchor="middle" font-family="monospace" font-size="3" fill="#00d4ff">
      02:34:56
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Terminal transparency effect -->
  <rect x="10" y="22" width="52" height="36" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Data transfer indicator -->
  <g transform="translate(54, 30)" opacity="0.7">
    <rect x="0" y="0" width="2" height="2" fill="#00ff00">
      <animate attributeName="height" values="2;6;2" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="0;-4;0" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="3" y="0" width="2" height="2" fill="#00ff00">
      <animate attributeName="height" values="2;8;2" dur="0.8s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="0;-6;0" dur="0.8s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="6" y="0" width="2" height="2" fill="#00ff00">
      <animate attributeName="height" values="2;4;2" dur="0.8s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="0;-2;0" dur="0.8s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Security level -->
  <g transform="translate(42, 64)" opacity="0.5">
    <text font-family="monospace" font-size="3" fill="#ffaa00">SEC: LEVEL 3</text>
  </g>
  
  <!-- Keyboard shortcut hint -->
  <g transform="translate(28, 8)" opacity="0.5">
    <text font-family="Arial" font-size="3" fill="#cccccc">Ctrl+C to cancel</text>
  </g>
  
  <!-- Terminal window resize handle -->
  <g transform="translate(62, 56)" opacity="0.4">
    <rect x="0" y="0" width="1" height="1" fill="#666666"/>
    <rect x="2" y="0" width="1" height="1" fill="#666666"/>
    <rect x="0" y="2" width="1" height="1" fill="#666666"/>
    <rect x="2" y="2" width="1" height="1" fill="#666666"/>
  </g>
</svg>