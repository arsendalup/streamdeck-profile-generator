<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="minusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#ff8800;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#330000;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#ff4444" stroke-width="2"/>
  
  <!-- Minus sign -->
  <rect x="40" y="65" width="64" height="14" fill="url(#minusGlow)" rx="7">
    <animate attributeName="fill-opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Energy glow effect -->
  <circle cx="72" cy="72" r="30" fill="none" stroke="#ff4444" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="30;25;30" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>