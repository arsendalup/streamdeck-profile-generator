<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(12, 12)">
    <!-- Musical note -->
    <circle cx="20" cy="36" r="6" fill="#4a9eff" stroke="#ffffff" stroke-width="2"/>
    <rect x="26" y="12" width="3" height="24" fill="#ffffff"/>
    
    <!-- Second note -->
    <circle cx="36" cy="40" r="5" fill="#4a9eff" stroke="#ffffff" stroke-width="2"/>
    <rect x="41" y="18" width="3" height="22" fill="#ffffff"/>
    
    <!-- Musical staff lines -->
    <g stroke="#ffffff" stroke-width="1" opacity="0.6">
      <line x1="8" y1="28" x2="48" y2="28"/>
      <line x1="8" y1="32" x2="48" y2="32"/>
      <line x1="8" y1="36" x2="48" y2="36"/>
      <line x1="8" y1="40" x2="48" y2="40"/>
      <line x1="8" y1="44" x2="48" y2="44"/>
    </g>
    
    <!-- Musical symbols -->
    <path d="M4 20 Q8 16, 12 20 Q8 24, 4 20" fill="#4a9eff"/>
    <text x="32" y="16" text-anchor="middle" fill="#ffffff" font-size="8">♪</text>
    
    <!-- Sound waves -->
    <g stroke="#4a9eff" stroke-width="1" opacity="0.5">
      <path d="M48 24 Q52 20, 48 16"/>
      <path d="M48 32 Q54 28, 48 24"/>
      <path d="M48 40 Q52 36, 48 32"/>
    </g>
  </g>
</svg>
