<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144">
  <defs>
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0088ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0044aa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="connectionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66ff66;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00aa00;stop-opacity:1" />
    </linearGradient>
    <filter id="linkGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="144" height="144" fill="#0a0a0a" rx="8"/>
  
  <!-- Tech border -->
  <rect x="4" y="4" width="136" height="136" fill="none" stroke="url(#linkGrad)" stroke-width="1" rx="6" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- First chain link -->
  <ellipse cx="45" cy="60" rx="15" ry="25" fill="none" stroke="url(#linkGrad)" stroke-width="4" filter="url(#linkGlow)">
    <animate attributeName="stroke-opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Second chain link (interlocked) -->
  <ellipse cx="75" cy="75" rx="25" ry="15" fill="none" stroke="url(#linkGrad)" stroke-width="4" filter="url(#linkGlow)">
    <animate attributeName="stroke-opacity" values="0.8;1;0.8" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Third chain link -->
  <ellipse cx="99" cy="84" rx="12" ry="20" fill="none" stroke="url(#linkGrad)" stroke-width="4" filter="url(#linkGlow)">
    <animate attributeName="stroke-opacity" values="0.8;1;0.8" dur="2s" begin="1s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Connection energy flow -->
  <g opacity="0.7">
    <circle cx="60" cy="67" r="2" fill="url(#connectionGrad)">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 15,8; 30,16" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="67" r="1.5" fill="url(#connectionGrad)">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 15,8; 30,16" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Docking status indicator -->
  <rect x="20" y="20" width="20" height="8" fill="#001122" stroke="url(#linkGrad)" stroke-width="1" rx="2" opacity="0.8"/>
  <text x="30" y="26" font-family="monospace" font-size="6" fill="url(#connectionGrad)" text-anchor="middle" opacity="0.9">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    DOCK
  </text>
  
  <!-- Connection field -->
  <ellipse cx="72" cy="72" rx="35" ry="25" fill="none" stroke="url(#linkGrad)" stroke-width="1" opacity="0.2">
    <animate attributeName="rx" values="35;40;35" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="25;30;25" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Signal strength bars -->
  <g transform="translate(110, 25)" opacity="0.6">
    <rect x="0" y="6" width="3" height="2" fill="url(#connectionGrad)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="4" y="4" width="3" height="4" fill="url(#connectionGrad)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="8" y="2" width="3" height="6" fill="url(#connectionGrad)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="12" y="0" width="3" height="8" fill="url(#connectionGrad)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Corner accent -->
  <polygon points="4,4 16,4 4,16" fill="url(#linkGrad)" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </polygon>
</svg>