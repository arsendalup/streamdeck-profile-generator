<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffdbaa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a574;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Hand palm -->
  <ellipse cx="36" cy="45" rx="12" ry="15" fill="url(#handGrad)" stroke="#00d4ff" stroke-width="2">
    <animate attributeName="ry" values="15;16;15" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Thumb -->
  <ellipse cx="26" cy="42" rx="4" ry="8" fill="url(#handGrad)" stroke="#00d4ff" stroke-width="2" transform="rotate(-30 26 42)">
    <animateTransform attributeName="transform" type="rotate" values="-30 26 42;-25 26 42;-30 26 42" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Index finger (extended) -->
  <ellipse cx="32" cy="22" rx="3" ry="10" fill="url(#handGrad)" stroke="#00d4ff" stroke-width="2">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1; 0,0" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Middle finger (extended) -->
  <ellipse cx="40" cy="20" rx="3" ry="12" fill="url(#handGrad)" stroke="#00d4ff" stroke-width="2">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1; 0,0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Ring finger (folded) -->
  <ellipse cx="46" cy="35" rx="3" ry="8" fill="url(#handGrad)" stroke="#00d4ff" stroke-width="2" transform="rotate(45 46 35)"/>
  
  <!-- Pinky finger (folded) -->
  <ellipse cx="50" cy="40" rx="2.5" ry="7" fill="url(#handGrad)" stroke="#00d4ff" stroke-width="2" transform="rotate(60 50 40)"/>
  
  <!-- Peace symbol glow -->
  <circle cx="36" cy="26" r="20" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="18;22;18" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- V for Victory highlighting -->
  <g opacity="0.7">
    <line x1="32" y1="12" x2="32" y2="32" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="40" y1="8" x2="40" y2="32" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="1s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Fingernails -->
  <ellipse cx="32" cy="17" rx="1.5" ry="2" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="40" cy="14" rx="1.5" ry="2" fill="#ffffff" opacity="0.8"/>
  
  <!-- Wrist line -->
  <path d="M24 56 Q36 58 48 56" stroke="#d4a574" stroke-width="2" fill="none"/>
  
  <!-- Peaceful aura -->
  <circle cx="36" cy="36" r="25" fill="none" stroke="#ffff99" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="25;30;25" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>