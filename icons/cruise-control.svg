<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(12, 16)">
    <!-- Dashboard/control panel background -->
    <rect x="0" y="0" width="48" height="32" fill="#2d4a5a" stroke="#ffffff" stroke-width="2" rx="6"/>
    
    <!-- Speed indicator -->
    <circle cx="12" cy="16" r="8" fill="none" stroke="#4a9eff" stroke-width="2"/>
    <path d="M12 16 L16 12" stroke="#44ff44" stroke-width="3" stroke-linecap="round"/>
    <text x="12" y="28" text-anchor="middle" fill="#ffffff" font-size="6">CRUISE</text>
    
    <!-- Control buttons -->
    <rect x="26" y="6" width="8" height="4" fill="#44ff44" stroke="#ffffff" stroke-width="1" rx="1"/>
    <rect x="26" y="14" width="8" height="4" fill="#4a9eff" stroke="#ffffff" stroke-width="1" rx="1"/>
    <rect x="26" y="22" width="8" height="4" fill="#ff4444" stroke="#ffffff" stroke-width="1" rx="1"/>
    
    <!-- Status lights -->
    <circle cx="38" cy="8" r="2" fill="#44ff44"/>
    <circle cx="42" cy="8" r="2" fill="#4a9eff"/>
    
    <!-- Speed limiter bar -->
    <rect x="38" y="14" width="8" height="12" fill="none" stroke="#ffffff" stroke-width="1"/>
    <rect x="39" y="15" width="6" height="6" fill="#44ff44"/>
    
    <!-- Cruise text -->
    <text x="24" y="38" text-anchor="middle" fill="#4a9eff" font-size="8" font-weight="bold">AUTO</text>
  </g>
</svg>