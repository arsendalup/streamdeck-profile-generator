<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldCheckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff66;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc44;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield outline -->
  <path d="M36 8 Q24 12 12 16 Q12 32 12 40 Q12 56 36 64 Q60 56 60 40 Q60 32 60 16 Q48 12 36 8 Z" 
        fill="url(#shieldCheckGrad)" stroke="#ffffff" stroke-width="2">
    <animate attributeName="transform" values="scale(1); scale(1.02); scale(1)" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Shield inner area -->
  <path d="M36 12 Q26 15 16 18 Q16 32 16 40 Q16 52 36 58 Q56 52 56 40 Q56 32 56 18 Q46 15 36 12 Z" 
        fill="#001122" stroke="#00d4ff" stroke-width="1" opacity="0.8"/>
  
  <!-- Check mark -->
  <path d="M24 36 L32 44 L48 28" fill="none" stroke="url(#checkGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dasharray" values="0,40;40,0" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Check mark glow -->
  <path d="M24 36 L32 44 L48 28" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Shield reinforcement lines -->
  <g stroke="#00d4ff" stroke-width="1" fill="none" opacity="0.5">
    <path d="M20 20 Q36 18 52 20"/>
    <path d="M18 28 Q36 26 54 28"/>
    <path d="M16 36 Q36 34 56 36"/>
    <path d="M18 44 Q36 42 54 44"/>
    <path d="M22 50 Q36 48 50 50"/>
  </g>
  
  <!-- Security status indicator -->
  <circle cx="48" cy="20" r="4" fill="#00ff00" stroke="#ffffff" stroke-width="1">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="48" y="23" text-anchor="middle" font-family="Arial" font-size="3" font-weight="bold" fill="#000000">OK</text>
  
  <!-- Shield energy field -->
  <path d="M36 8 Q24 12 12 16 Q12 32 12 40 Q12 56 36 64 Q60 56 60 40 Q60 32 60 16 Q48 12 36 8 Z" 
        fill="none" stroke="#00ff66" stroke-width="1" opacity="0.4">
    <animate attributeName="stroke-dasharray" values="0,200;100,100;200,0" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- Protection level bars -->
  <g transform="translate(8, 24)" opacity="0.8">
    <rect x="0" y="0" width="2" height="8" fill="#00ff00"/>
    <rect x="0" y="10" width="2" height="8" fill="#00ff00"/>
    <rect x="0" y="20" width="2" height="8" fill="#ffff00"/>
    <rect x="0" y="30" width="2" height="8" fill="#ff6600"/>
    <text x="4" y="20" font-family="Arial" font-size="4" fill="#ffffff">SECURE</text>
  </g>
  
  <!-- Data integrity check -->
  <g transform="translate(56, 48)" opacity="0.7">
    <rect width="12" height="8" rx="2" fill="#001100" stroke="#00ff00" stroke-width="1"/>
    <text x="6" y="5" text-anchor="middle" font-family="monospace" font-size="3" fill="#00ff00">
      VERIFIED
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Shield power core -->
  <circle cx="36" cy="36" r="6" fill="#00d4ff" stroke="#ffffff" stroke-width="1" opacity="0.6">
    <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Power emanation -->
  <circle cx="36" cy="36" r="12" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="10;16;10" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Security scan lines -->
  <g opacity="0.4">
    <line x1="16" y1="20" x2="56" y2="20" stroke="#00ff00" stroke-width="1">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="18" y1="32" x2="54" y2="32" stroke="#00ff00" stroke-width="1">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="20" y1="44" x2="52" y2="44" stroke="#00ff00" stroke-width="1">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Threat level indicator -->
  <g transform="translate(24, 8)" opacity="0.7">
    <rect width="24" height="6" rx="2" fill="#000000" stroke="#00ff00" stroke-width="1"/>
    <text x="12" y="4" text-anchor="middle" font-family="monospace" font-size="4" fill="#00ff00">THREAT: LOW</text>
  </g>
  
  <!-- Certification mark -->
  <g transform="translate(58, 24)" opacity="0.8">
    <circle cx="0" cy="0" r="6" fill="#ffffff" stroke="#00d4ff" stroke-width="2"/>
    <path d="M-3 0 L-1 2 L3 -2" stroke="#00ff00" stroke-width="2" fill="none"/>
    <text x="0" y="10" text-anchor="middle" font-family="Arial" font-size="3" fill="#ffffff">CERT</text>
  </g>
  
  <!-- Defense matrix -->
  <g opacity="0.3">
    <polygon points="36,16 28,24 28,32 36,40 44,32 44,24" fill="none" stroke="#00d4ff" stroke-width="1" stroke-dasharray="2,2">
      <animateTransform attributeName="transform" type="rotate" values="0 36 28;360 36 28" dur="6s" repeatCount="indefinite"/>
    </polygon>
  </g>
  
  <!-- Success particles -->
  <g opacity="0.7">
    <circle cx="26" cy="30" r="1" fill="#00ff66">
      <animate attributeName="cy" values="30;26;30" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42" cy="34" r="1" fill="#00ff66">
      <animate attributeName="cy" values="34;30;34" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="34" cy="50" r="1" fill="#00ff66">
      <animate attributeName="cy" values="50;46;50" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Shield activation time -->
  <g transform="translate(8, 56)" opacity="0.6">
    <rect width="16" height="6" rx="1" fill="#000011" stroke="#00d4ff" stroke-width="1"/>
    <text x="8" y="4" text-anchor="middle" font-family="monospace" font-size="3" fill="#00d4ff">ACTIVE: 24/7</text>
  </g>
</svg>