<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="refreshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circular arrow -->
  <path d="M36 12 A24 24 0 1 1 12 36" fill="none" stroke="url(#refreshGrad)" stroke-width="4" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0,150;75,75;150,0;0,150" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Arrow head -->
  <path d="M12 36 L8 32 L8 40 L16 36 Z" fill="url(#refreshGrad)" stroke="#ffffff" stroke-width="1">
    <animateTransform attributeName="transform" type="scale" values="1;1.2;1" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Center point -->
  <circle cx="36" cy="36" r="4" fill="url(#refreshGrad)" stroke="#ffffff" stroke-width="2">
    <animate attributeName="r" values="3;5;3" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Rotation indicator dots -->
  <g>
    <circle cx="60" cy="36" r="2" fill="#ff6600">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="36" cy="12" r="2" fill="#ff6600">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="12" cy="36" r="2" fill="#ff6600">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="36" cy="60" r="2" fill="#ff6600">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="rotate" values="0 36 36;360 36 36" dur="3s" repeatCount="indefinite"/>
  </g>
  
  <!-- Speed lines -->
  <g opacity="0.6">
    <path d="M48 24 Q52 20 56 24" stroke="#ffffff" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0;0.8;0" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M48 48 Q52 52 56 48" stroke="#ffffff" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0;0.8;0" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M24 48 Q20 52 24 56" stroke="#ffffff" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0;0.8;0" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M24 24 Q20 20 24 16" stroke="#ffffff" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0;0.8;0" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Inner progress ring -->
  <circle cx="36" cy="36" r="16" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8,4" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" values="0 36 36;360 36 36" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Clockwise indicator -->
  <g transform="translate(50, 22)" opacity="0.8">
    <text font-family="Arial" font-size="8" fill="#00d4ff" font-weight="bold">CW</text>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </g>
  
  <!-- Angular velocity indicator -->
  <g transform="translate(8, 8)" opacity="0.7">
    <rect width="12" height="6" rx="2" fill="#000000" stroke="#00d4ff" stroke-width="1"/>
    <text x="6" y="4" text-anchor="middle" font-family="monospace" font-size="4" fill="#00d4ff">
      360°/s
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Progress arc -->
  <path d="M36 12 A24 24 0 0 1 60 36" fill="none" stroke="#ffff00" stroke-width="3" opacity="0.7">
    <animate attributeName="stroke-dasharray" values="0,75;75,0" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Rotation blur effect -->
  <g opacity="0.3">
    <path d="M36 16 A20 20 0 1 1 16 36" fill="none" stroke="#00d4ff" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="5 36 36;365 36 36" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M36 20 A16 16 0 1 1 20 36" fill="none" stroke="#00d4ff" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" values="10 36 36;370 36 36" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Mechanical gear teeth -->
  <g opacity="0.4">
    <rect x="34" y="8" width="4" height="2" fill="#cccccc"/>
    <rect x="66" y="34" width="2" height="4" fill="#cccccc"/>
    <rect x="34" y="62" width="4" height="2" fill="#cccccc"/>
    <rect x="4" y="34" width="2" height="4" fill="#cccccc"/>
  </g>
  
  <!-- Force vectors -->
  <g opacity="0.6">
    <line x1="48" y1="24" x2="52" y2="20" stroke="#ff6600" stroke-width="2" marker-end="url(#arrowhead)">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Energy burst -->
  <circle cx="36" cy="36" r="28" fill="none" stroke="#ffff00" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="24;32;24" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Status indicator -->
  <g transform="translate(54, 54)" opacity="0.8">
    <circle cx="0" cy="0" r="4" fill="#00ff00" stroke="#ffffff" stroke-width="1">
      <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="2s" repeatCount="indefinite"/>
    </circle>
    <path d="M-2 0 L0 -2 L2 0" stroke="#ffffff" stroke-width="1" fill="none"/>
  </g>
</svg>