<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leanRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Head -->
  <circle cx="40" cy="18" r="6" fill="url(#leanRightGrad)" stroke="#ffffff" stroke-width="2">
    <animateTransform attributeName="transform" type="translate" values="0,0; 2,0; 0,0" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Body (leaning right) -->
  <rect x="36" y="22" width="8" height="20" rx="4" fill="url(#leanRightGrad)" stroke="#ffffff" stroke-width="2" transform="rotate(15 40 32)">
    <animateTransform attributeName="transform" type="rotate" values="15 40 32;20 40 32;15 40 32" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Left arm -->
  <rect x="28" y="26" width="8" height="4" rx="2" fill="url(#leanRightGrad)" stroke="#ffffff" stroke-width="2" transform="rotate(-15 32 28)">
    <animateTransform attributeName="transform" type="rotate" values="-15 32 28;-10 32 28;-15 32 28" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Right arm -->
  <rect x="44" y="26" width="8" height="4" rx="2" fill="url(#leanRightGrad)" stroke="#ffffff" stroke-width="2" transform="rotate(45 48 28)">
    <animateTransform attributeName="transform" type="rotate" values="45 48 28;50 48 28;45 48 28" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Left leg -->
  <rect x="34" y="40" width="4" height="16" rx="2" fill="url(#leanRightGrad)" stroke="#ffffff" stroke-width="2" transform="rotate(-5 36 48)">
    <animateTransform attributeName="transform" type="rotate" values="-5 36 48;0 36 48;-5 36 48" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Right leg -->
  <rect x="40" y="40" width="4" height="16" rx="2" fill="url(#leanRightGrad)" stroke="#ffffff" stroke-width="2" transform="rotate(10 42 48)">
    <animateTransform attributeName="transform" type="rotate" values="10 42 48;15 42 48;10 42 48" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Lean direction arrow -->
  <path d="M60 32 L64 28 L64 32 L64 36 Z" fill="#ff6600" stroke="#ffffff" stroke-width="1">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Motion indicator -->
  <path d="M27 25 Q22 30 27 35" stroke="#ffff00" stroke-width="2" fill="none" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="0;6" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Balance lines -->
  <g opacity="0.5">
    <line x1="36" y1="18" x2="42" y2="32" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="40" y1="42" x2="46" y2="56" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2"/>
  </g>
  
  <!-- Center of gravity indicator -->
  <circle cx="44" cy="35" r="2" fill="#ff6600" stroke="#ffffff" stroke-width="1">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Ground reference -->
  <line x1="22" y1="58" x2="57" y2="58" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Lean angle -->
  <path d="M40 50 L40 58 Q42 56 44 58" stroke="#00ff00" stroke-width="1" fill="none"/>
  <text x="46" y="56" font-family="Arial" font-size="8" fill="#00ff00">15°</text>
</svg>