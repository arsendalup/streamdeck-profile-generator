<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="syringeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6e6e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cccccc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="medicineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Syringe barrel -->
  <rect x="16" y="32" width="32" height="8" rx="4" fill="url(#syringeGrad)" stroke="#999999" stroke-width="2"/>
  
  <!-- Medicine inside barrel -->
  <rect x="20" y="34" width="24" height="4" rx="2" fill="url(#medicineGrad)" stroke="#0099cc" stroke-width="1">
    <animate attributeName="width" values="24;20;24" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Plunger -->
  <rect x="8" y="30" width="12" height="12" rx="6" fill="url(#syringeGrad)" stroke="#999999" stroke-width="2"/>
  <circle cx="14" cy="36" r="4" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <circle cx="14" cy="36" r="2" fill="#cccccc"/>
  
  <!-- Needle -->
  <rect x="48" y="34" width="16" height="4" rx="2" fill="#b3b3b3" stroke="#999999" stroke-width="1"/>
  
  <!-- Needle tip -->
  <polygon points="64,36 68,35 68,37" fill="#999999" stroke="#666666" stroke-width="1"/>
  
  <!-- Needle bevel -->
  <path d="M64 35.5 L66 35.8 L66 36.2 L64 36.5" fill="#cccccc"/>
  
  <!-- Measurement marks -->
  <g stroke="#999999" stroke-width="0.5" opacity="0.7">
    <line x1="22" y1="31" x2="22" y2="33"/>
    <line x1="26" y1="31" x2="26" y2="33"/>
    <line x1="30" y1="31" x2="30" y2="33"/>
    <line x1="34" y1="31" x2="34" y2="33"/>
    <line x1="38" y1="31" x2="38" y2="33"/>
    <line x1="42" y1="31" x2="42" y2="33"/>
  </g>
  
  <!-- Dosage numbers -->
  <g font-family="Arial" font-size="4" fill="#666666" opacity="0.8">
    <text x="22" y="30">1</text>
    <text x="30" y="30">2</text>
    <text x="38" y="30">3</text>
    <text x="46" y="30">ml</text>
  </g>
  
  <!-- Safety cap (removed) -->
  <rect x="52" y="20" width="8" height="6" rx="2" fill="#ff3333" stroke="#cc0000" stroke-width="1" opacity="0.7"/>
  <text x="56" y="24" text-anchor="middle" font-family="Arial" font-size="3" fill="#ffffff">CAP</text>
  
  <!-- Medicine droplet -->
  <g transform="translate(68, 36)">
    <path d="M0 0 Q-2 -2 -2 -4 Q-2 -6 0 -6 Q2 -6 2 -4 Q2 -2 0 0 Z" fill="url(#medicineGrad)" stroke="#0099cc" stroke-width="0.5">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Injection site -->
  <g transform="translate(16, 48)" opacity="0.6">
    <ellipse cx="0" cy="0" rx="8" ry="4" fill="#ffdbaa" stroke="#d4a574" stroke-width="1"/>
    <circle cx="0" cy="0" r="2" fill="#ff9999" stroke="#ff6666" stroke-width="1">
      <animate attributeName="r" values="1;3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Medical cross -->
  <g transform="translate(36, 16)" opacity="0.8">
    <circle cx="0" cy="0" r="6" fill="#ffffff" stroke="#ff3333" stroke-width="2"/>
    <rect x="-4" y="-1" width="8" height="2" fill="#ff3333"/>
    <rect x="-1" y="-4" width="2" height="8" fill="#ff3333"/>
  </g>
  
  <!-- Vaccination record -->
  <g transform="translate(8, 56)" opacity="0.7">
    <rect width="16" height="8" rx="2" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="8" y="5" text-anchor="middle" font-family="Arial" font-size="4" fill="#333333">VACCINE</text>
  </g>
  
  <!-- Sterile packaging -->
  <g transform="translate(48, 8)" opacity="0.6">
    <rect width="16" height="12" rx="2" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
    <text x="8" y="7" text-anchor="middle" font-family="Arial" font-size="3" fill="#666666">STERILE</text>
    <text x="8" y="11" text-anchor="middle" font-family="Arial" font-size="3" fill="#666666">SINGLE USE</text>
  </g>
  
  <!-- Plunger movement indicator -->
  <g opacity="0.5">
    <path d="M6 36 L4 34 L4 38 Z" fill="#666666">
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,0; 0,0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Air bubbles -->
  <g opacity="0.6">
    <circle cx="24" cy="35" r="0.5" fill="#ffffff">
      <animate attributeName="cx" values="24;40;24" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="28" cy="37" r="0.5" fill="#ffffff">
      <animate attributeName="cx" values="28;42;28" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Dosage label -->
  <g transform="translate(20, 44)" opacity="0.8">
    <rect width="12" height="6" rx="1" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="6" y="3" text-anchor="middle" font-family="monospace" font-size="3" fill="#333333">2.5ml</text>
    <text x="6" y="6" text-anchor="middle" font-family="monospace" font-size="2" fill="#666666">SC-MED</text>
  </g>
  
  <!-- Temperature indicator -->
  <g transform="translate(56, 48)" opacity="0.7">
    <rect width="8" height="6" rx="1" fill="#000000" stroke="#00d4ff" stroke-width="1"/>
    <text x="4" y="4" text-anchor="middle" font-family="monospace" font-size="3" fill="#00d4ff">
      -80°C
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Expiry date -->
  <g transform="translate(32, 56)" opacity="0.6">
    <rect width="16" height="6" rx="1" fill="#ffff99" stroke="#ffcc00" stroke-width="1"/>
    <text x="8" y="4" text-anchor="middle" font-family="Arial" font-size="3" fill="#666666">EXP: 2954</text>
  </g>
  
  <!-- Bio-hazard symbol -->
  <g transform="translate(60, 56)" opacity="0.5">
    <circle cx="0" cy="0" r="4" fill="#ff3333" stroke="#ffffff" stroke-width="1"/>
    <text x="0" y="1" text-anchor="middle" font-family="Arial" font-size="3" font-weight="bold" fill="#ffffff">☣</text>
  </g>
  
  <!-- Injection progress -->
  <g transform="translate(64, 20)" opacity="0.8">
    <rect width="6" height="12" rx="1" fill="#000000" stroke="#00ff00" stroke-width="1"/>
    <rect x="1" y="10" width="4" height="1" fill="#00ff00">
      <animate attributeName="height" values="1;10;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="10;1;10" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="3" y="16" text-anchor="middle" font-family="Arial" font-size="3" fill="#00ff00">%</text>
  </g>
  
  <!-- Safety lock -->
  <rect x="12" y="28" width="4" height="2" rx="1" fill="#ff6600" stroke="#cc4400" stroke-width="1"/>
  <circle cx="14" cy="28" r="1" fill="#ffffff"/>
</svg>