<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0088ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004488;stop-opacity:1" />
    </linearGradient>
    <filter id="arrowGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Arrow shaft -->
  <rect x="65" y="50" width="14" height="40" fill="url(#arrowGrad)" filter="url(#arrowGlow)">
    <animate attributeName="fill-opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Arrow head -->
  <path d="M72 35 L90 55 L78 55 L72 50 L66 55 L54 55 Z" 
        fill="url(#arrowGrad)" 
        filter="url(#arrowGlow)">
    <animate attributeName="fill-opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Movement trail -->
  <path d="M72 70 L72 85 L72 100" 
        stroke="#88ffff" 
        stroke-width="2" 
        fill="none" 
        opacity="0.5"
        stroke-dasharray="5 5">
    <animate attributeName="stroke-dashoffset" values="0;10;0" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Energy particles -->
  <circle cx="72" cy="45" r="2" fill="#ffffff">
    <animate attributeName="cy" values="45;25;45" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>