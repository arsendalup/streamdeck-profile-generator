<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="dropletGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Main droplet -->
  <path d="M36 20 Q28 28 28 38 Q28 48 36 48 Q44 48 44 38 Q44 28 36 20 Z" fill="url(#dropletGrad)" stroke="#ffffff" stroke-width="2">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,2; 0,0" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Small droplet 1 -->
  <path d="M22 30 Q18 34 18 38 Q18 42 22 42 Q26 42 26 38 Q26 34 22 30 Z" fill="url(#dropletGrad)" stroke="#ffffff" stroke-width="1" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,1; 0,0" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Small droplet 2 -->
  <path d="M50 32 Q46 36 46 40 Q46 44 50 44 Q54 44 54 40 Q54 36 50 32 Z" fill="url(#dropletGrad)" stroke="#ffffff" stroke-width="1" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,1; 0,0" dur="2.2s" begin="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Tiny droplet 3 -->
  <path d="M32 52 Q30 54 30 56 Q30 58 32 58 Q34 58 34 56 Q34 54 32 52 Z" fill="url(#dropletGrad)" stroke="#ffffff" stroke-width="1" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,1; 0,0" dur="1.8s" begin="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Tiny droplet 4 -->
  <path d="M42 54 Q40 56 40 58 Q40 60 42 60 Q44 60 44 58 Q44 56 42 54 Z" fill="url(#dropletGrad)" stroke="#ffffff" stroke-width="1" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,1; 0,0" dur="2.3s" begin="0.8s" repeatCount="indefinite"/>
  </path>
  
  <!-- Reflection highlight -->
  <ellipse cx="33" cy="32" rx="3" ry="6" fill="#ffffff" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Water impact rings -->
  <circle cx="36" cy="64" r="8" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="4;12;4" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="36" cy="64" r="6" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.6">
    <animate attributeName="r" values="2;8;2" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
</svg>