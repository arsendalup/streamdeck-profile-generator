<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="keyboardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#333333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111111;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#555555;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Keyboard base -->
  <rect x="8" y="32" width="56" height="32" rx="4" fill="url(#keyboardGrad)" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Text document above keyboard -->
  <rect x="20" y="8" width="32" height="28" rx="2" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  
  <!-- Document content -->
  <g>
    <!-- Title line -->
    <rect x="24" y="12" width="20" height="2" rx="1" fill="#000000"/>
    
    <!-- Text lines -->
    <rect x="24" y="16" width="24" height="1" rx="0.5" fill="#666666"/>
    <rect x="24" y="18" width="20" height="1" rx="0.5" fill="#666666"/>
    <rect x="24" y="20" width="22" height="1" rx="0.5" fill="#666666"/>
    <rect x="24" y="22" width="18" height="1" rx="0.5" fill="#666666"/>
    <rect x="24" y="24" width="24" height="1" rx="0.5" fill="#666666"/>
    <rect x="24" y="26" width="16" height="1" rx="0.5" fill="#666666"/>
    <rect x="24" y="28" width="20" height="1" rx="0.5" fill="#666666"/>
    
    <!-- Cursor -->
    <rect x="44" y="28" width="1" height="2" fill="#000000">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Keyboard keys -->
  <g>
    <!-- Top row -->
    <rect x="12" y="36" width="4" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="18" y="36" width="4" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="24" y="36" width="4" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="30" y="36" width="4" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="36" y="36" width="4" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="42" y="36" width="4" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="48" y="36" width="4" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="54" y="36" width="6" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    
    <!-- Middle row -->
    <rect x="12" y="42" width="5" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="19" y="42" width="4" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="25" y="42" width="4" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="31" y="42" width="4" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="37" y="42" width="4" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="43" y="42" width="4" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="49" y="42" width="4" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="55" y="42" width="5" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    
    <!-- Bottom row -->
    <rect x="12" y="48" width="6" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="20" y="48" width="4" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="26" y="48" width="4" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="32" y="48" width="4" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="38" y="48" width="4" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="44" y="48" width="4" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    <rect x="50" y="48" width="10" height="4" rx="1" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
    
    <!-- Space bar -->
    <rect x="20" y="54" width="32" height="4" rx="2" fill="url(#keyGrad)" stroke="#666666" stroke-width="0.5"/>
  </g>
  
  <!-- Key labels -->
  <g font-family="Arial" font-size="3" fill="#cccccc" text-anchor="middle">
    <text x="14" y="39">Q</text>
    <text x="20" y="39">W</text>
    <text x="26" y="39">E</text>
    <text x="32" y="39">R</text>
    <text x="38" y="39">T</text>
    <text x="44" y="39">Y</text>
    <text x="50" y="39">U</text>
    <text x="57" y="39">←</text>
    
    <text x="21" y="45">A</text>
    <text x="27" y="45">S</text>
    <text x="33" y="45">D</text>
    <text x="39" y="45">F</text>
    <text x="45" y="45">G</text>
    <text x="51" y="45">H</text>
    
    <text x="22" y="51">Z</text>
    <text x="28" y="51">X</text>
    <text x="34" y="51">C</text>
    <text x="40" y="51">V</text>
    <text x="46" y="51">B</text>
  </g>
  
  <!-- Active key presses -->
  <rect x="31" y="42" width="4" height="4" rx="1" fill="#00d4ff" stroke="#ffffff" stroke-width="1">
    <animate attributeName="fill" values="#00d4ff;#ffffff;#00d4ff" dur="0.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Typing indicator arrows -->
  <g opacity="0.7">
    <path d="M36 32 L38 30 L40 32" stroke="#00d4ff" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- WPM counter -->
  <g transform="translate(8, 8)" opacity="0.8">
    <rect width="16" height="8" rx="2" fill="#001122" stroke="#00d4ff" stroke-width="1"/>
    <text x="8" y="5" text-anchor="middle" font-family="monospace" font-size="4" fill="#00d4ff">
      85 WPM
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Progress bar -->
  <g transform="translate(56, 8)" opacity="0.7">
    <rect width="12" height="6" rx="1" fill="#000000" stroke="#00ff00" stroke-width="1"/>
    <rect x="1" y="1" width="8" height="4" rx="0.5" fill="#00ff00">
      <animate attributeName="width" values="2;10;2" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="6" y="18" text-anchor="middle" font-family="Arial" font-size="3" fill="#00ff00">TYPING</text>
  </g>
  
  <!-- Character counter -->
  <g transform="translate(24, 60)" opacity="0.6">
    <rect width="24" height="6" rx="2" fill="#000011" stroke="#ffff00" stroke-width="1"/>
    <text x="12" y="4" text-anchor="middle" font-family="monospace" font-size="3" fill="#ffff00">
      1,247 / 2,000 chars
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Keyboard backlight -->
  <rect x="8" y="32" width="56" height="32" rx="4" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Caps lock indicator -->
  <circle cx="58" cy="50" r="2" fill="#ff6600" stroke="#ffffff" stroke-width="1" opacity="0.7">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="58" y="52" text-anchor="middle" font-family="Arial" font-size="2" fill="#ffffff">CAPS</text>
  
  <!-- Auto-complete suggestions -->
  <g transform="translate(46, 20)" opacity="0.8">
    <rect width="16" height="12" rx="2" fill="#f0f8ff" stroke="#00d4ff" stroke-width="1"/>
    <text x="8" y="4" text-anchor="middle" font-family="Arial" font-size="3" fill="#000000">quantum</text>
    <text x="8" y="7" text-anchor="middle" font-family="Arial" font-size="3" fill="#000000">quarks</text>
    <text x="8" y="10" text-anchor="middle" font-family="Arial" font-size="3" fill="#000000">quasar</text>
  </g>
  
  <!-- Spell check indicator -->
  <path d="M28 30 Q30 32 32 30" stroke="#ff3333" stroke-width="1" fill="none" stroke-dasharray="1,1">
    <animate attributeName="stroke-dashoffset" values="0;2" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Error correction -->
  <g transform="translate(56, 20)" opacity="0.6">
    <rect width="8" height="6" rx="1" fill="#ff3333" stroke="#ffffff" stroke-width="1"/>
    <text x="4" y="4" text-anchor="middle" font-family="Arial" font-size="3" font-weight="bold" fill="#ffffff">ERR</text>
  </g>
  
  <!-- Connection status to document -->
  <line x1="36" y1="36" x2="36" y2="32" stroke="#00d4ff" stroke-width="2" stroke-dasharray="2,2">
    <animate attributeName="stroke-dashoffset" values="0;4" dur="1s" repeatCount="indefinite"/>
  </line>
  
  <!-- Hand position indicator -->
  <g transform="translate(12, 58)" opacity="0.4">
    <ellipse cx="16" cy="0" rx="12" ry="3" fill="#ffdbaa" stroke="#d4a574" stroke-width="1"/>
    <ellipse cx="40" cy="0" rx="12" ry="3" fill="#ffdbaa" stroke="#d4a574" stroke-width="1"/>
  </g>
  
  <!-- Sound waves from typing -->
  <g opacity="0.5">
    <circle cx="36" cy="44" r="8" fill="none" stroke="#cccccc" stroke-width="1">
      <animate attributeName="r" values="6;12;6" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>