<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="radioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#606060;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#404040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="signalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#88ff00;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#44aa00;stop-opacity:0.2" />
    </radialGradient>
    <filter id="radioFilter">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#00ff00" stroke-width="2"/>
  
  <!-- Radio body -->
  <rect x="40" y="65" width="64" height="45" fill="url(#radioGrad)" rx="8" filter="url(#radioFilter)"/>
  
  <!-- Antenna -->
  <rect x="70" y="35" width="4" height="30" fill="url(#radioGrad)"/>
  <rect x="69" y="25" width="6" height="10" fill="url(#radioGrad)" rx="3"/>
  
  <!-- Speaker grille -->
  <rect x="50" y="75" width="44" height="25" fill="#202020" rx="4"/>
  <rect x="52" y="77" width="40" height="2" fill="#606060"/>
  <rect x="52" y="81" width="40" height="2" fill="#606060"/>
  <rect x="52" y="85" width="40" height="2" fill="#606060"/>
  <rect x="52" y="89" width="40" height="2" fill="#606060"/>
  <rect x="52" y="93" width="40" height="2" fill="#606060"/>
  <rect x="52" y="97" width="40" height="2" fill="#606060"/>
  
  <!-- Signal waves -->
  <path d="M72 20 Q80 15 85 25" stroke="url(#signalGlow)" stroke-width="2" fill="none" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <path d="M72 20 Q88 10 95 25" stroke="url(#signalGlow)" stroke-width="2" fill="none" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </path>
  
  <path d="M72 20 Q96 5 105 25" stroke="url(#signalGlow)" stroke-width="2" fill="none" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite" begin="1s"/>
  </path>
  
  <!-- Left signal waves -->
  <path d="M72 20 Q64 15 59 25" stroke="url(#signalGlow)" stroke-width="2" fill="none" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite" begin="0.25s"/>
  </path>
  
  <path d="M72 20 Q56 10 49 25" stroke="url(#signalGlow)" stroke-width="2" fill="none" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite" begin="0.75s"/>
  </path>
  
  <path d="M72 20 Q48 5 39 25" stroke="url(#signalGlow)" stroke-width="2" fill="none" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite" begin="1.25s"/>
  </path>
  
  <!-- Control buttons -->
  <circle cx="50" cy="70" r="3" fill="#ff0000">
    <animate attributeName="fill" values="#ff0000;#ff8800;#ff0000" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="60" cy="70" r="3" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#88ff00;#00ff00" dur="3s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <circle cx="70" cy="70" r="3" fill="#0088ff">
    <animate attributeName="fill" values="#0088ff;#00aaff;#0088ff" dur="3s" repeatCount="indefinite" begin="2s"/>
  </circle>
  
  <!-- Status display -->
  <rect x="75" y="68" width="15" height="6" fill="#003366" stroke="#00ffff" stroke-width="1" rx="2"/>
  <text x="82" y="72" font-family="monospace" font-size="6" fill="#00ff00" text-anchor="middle">CH1</text>
  
  <!-- Volume indicator -->
  <rect x="105" y="75" width="8" height="20" fill="#003366" stroke="#00ff00" stroke-width="1" rx="2"/>
  <rect x="106" y="92" width="6" height="2" fill="#00ff00"/>
  <rect x="106" y="89" width="6" height="2" fill="#00ff00"/>
  <rect x="106" y="86" width="6" height="2" fill="#88ff00"/>
  <rect x="106" y="83" width="6" height="2" fill="#ffff00"/>
  <rect x="106" y="80" width="6" height="2" fill="#ff8800"/>
  
  <!-- Communication range -->
  <circle cx="72" cy="65" r="40" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="40;50;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Transmission indicator -->
  <rect x="25" y="25" width="15" height="6" fill="#003300" stroke="#00ff00" stroke-width="1" rx="2"/>
  <text x="32" y="30" font-family="monospace" font-size="6" fill="#00ff00" text-anchor="middle">TX</text>
  
  <!-- Signal strength bars -->
  <rect x="115" y="35" width="2" height="8" fill="#00ff00"/>
  <rect x="118" y="38" width="2" height="5" fill="#88ff00"/>
  <rect x="121" y="40" width="2" height="3" fill="#ffff00"/>
  <rect x="124" y="41" width="2" height="2" fill="#ff8800"/>
</svg>