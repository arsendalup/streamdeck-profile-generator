<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(16, 12)">
    <!-- Download arrow shaft -->
    <rect x="18" y="8" width="4" height="24" fill="#4a9eff"/>
    
    <!-- Download arrow head -->
    <path d="M20 32 L12 24 L16 24 L16 28 L24 28 L24 24 L28 24 Z" fill="#44ff44"/>
    
    <!-- Download container/box -->
    <rect x="8" y="36" width="24" height="12" fill="#2d4a5a" stroke="#ffffff" stroke-width="2" rx="2"/>
    
    <!-- Download progress indicator -->
    <rect x="10" y="38" width="20" height="8" fill="none" stroke="#4a9eff" stroke-width="1"/>
    <rect x="11" y="39" width="12" height="6" fill="#44ff44"/>
    
    <!-- Extraction beam effect -->
    <g opacity="0.6">
      <line x1="20" y1="8" x2="20" y2="32" stroke="#44ff44" stroke-width="2" stroke-dasharray="2,2"/>
      <circle cx="20" cy="6" r="2" fill="#44ff44"/>
    </g>
    
    <!-- Data/material particles -->
    <circle cx="14" cy="18" r="1" fill="#4a9eff" opacity="0.8"/>
    <circle cx="26" cy="22" r="1" fill="#4a9eff" opacity="0.6"/>
    <circle cx="18" cy="26" r="1" fill="#4a9eff" opacity="0.4"/>
    
    <!-- Download text -->
    <text x="20" y="56" text-anchor="middle" fill="#4a9eff" font-size="8">EXTRACT</text>
  </g>
</svg>