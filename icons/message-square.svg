<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="messageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6f7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b3e5ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Message bubble -->
  <rect x="12" y="18" width="44" height="32" rx="8" fill="url(#messageGrad)" stroke="#00d4ff" stroke-width="2">
    <animate attributeName="transform" values="scale(1); scale(1.02); scale(1)" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Message tail -->
  <path d="M20 50 L16 56 L24 50" fill="url(#messageGrad)" stroke="#00d4ff" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Text lines -->
  <rect x="18" y="26" width="32" height="2" rx="1" fill="#00d4ff" opacity="0.8">
    <animate attributeName="width" values="32;36;32" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="18" y="32" width="28" height="2" rx="1" fill="#00d4ff" opacity="0.8">
    <animate attributeName="width" values="28;32;28" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="18" y="38" width="24" height="2" rx="1" fill="#00d4ff" opacity="0.8">
    <animate attributeName="width" values="24;28;24" dur="3s" begin="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Typing indicator -->
  <g transform="translate(20, 44)">
    <circle cx="0" cy="0" r="1.5" fill="#00d4ff">
      <animate attributeName="cy" values="0;-2;0" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="6" cy="0" r="1.5" fill="#00d4ff">
      <animate attributeName="cy" values="0;-2;0" dur="1s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="12" cy="0" r="1.5" fill="#00d4ff">
      <animate attributeName="cy" values="0;-2;0" dur="1s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Message status -->
  <g transform="translate(48, 44)">
    <!-- Read receipt checkmarks -->
    <path d="M0 0 L2 2 L6 -2" stroke="#00ff00" stroke-width="1" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0;1;1" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M2 0 L4 2 L8 -2" stroke="#00ff00" stroke-width="1" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0;1" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Notification badge -->
  <circle cx="52" cy="22" r="4" fill="#ff3333" stroke="#ffffff" stroke-width="1">
    <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="52" y="25" text-anchor="middle" font-family="Arial" font-size="6" font-weight="bold" fill="#ffffff">3</text>
  
  <!-- Glow effect -->
  <rect x="12" y="18" width="44" height="32" rx="8" fill="none" stroke="#00d4ff" stroke-width="4" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Signal waves -->
  <g opacity="0.6">
    <path d="M58 28 Q62 30 62 34 Q62 38 58 40" stroke="#00d4ff" stroke-width="1" fill="none">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M60 24 Q66 28 66 34 Q66 40 60 44" stroke="#00d4ff" stroke-width="1" fill="none">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Message timestamp -->
  <text x="50" y="48" font-family="Arial" font-size="4" fill="#666666" opacity="0.8">12:34</text>
  
  <!-- Sent indicator -->
  <circle cx="8" cy="34" r="2" fill="#00ff00" opacity="0.7">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>