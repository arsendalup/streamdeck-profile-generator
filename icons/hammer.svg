<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hammerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Hammer handle -->
  <rect x="20" y="40" width="36" height="6" rx="3" fill="url(#hammerGrad)" stroke="#654321" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" values="0 38 43;-5 38 43;0 38 43" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Hammer head -->
  <rect x="48" y="32" width="20" height="16" rx="2" fill="url(#metalGrad)" stroke="#ffffff" stroke-width="2">
    <animateTransform attributeName="transform" type="rotate" values="0 58 40;-5 58 40;0 58 40" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Hammer claw -->
  <path d="M48 36 Q44 32 40 36 Q44 40 48 36" fill="url(#metalGrad)" stroke="#ffffff" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" values="0 44 36;-5 44 36;0 44 36" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Handle grip -->
  <rect x="18" y="41" width="4" height="4" rx="2" fill="#654321" stroke="#8B4513" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" values="0 20 43;-5 20 43;0 20 43" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Impact effect -->
  <g opacity="0.6">
    <circle cx="64" cy="40" r="3" fill="#ffff00" stroke="#ff6600" stroke-width="1">
      <animate attributeName="r" values="0;6;0" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="1s" repeatCount="indefinite"/>
    </circle>
    <!-- Sparks -->
    <circle cx="66" cy="36" r="1" fill="#ffff00">
      <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="62" cy="44" r="1" fill="#ff6600">
      <animate attributeName="opacity" values="0;1;0" dur="0.7s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="68" cy="42" r="1" fill="#ffff00">
      <animate attributeName="opacity" values="0;1;0" dur="0.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Motion blur -->
  <rect x="48" y="34" width="16" height="12" rx="2" fill="url(#metalGrad)" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" values="2 56 40;-3 56 40;2 56 40" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.3;0" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Handle wrap -->
  <line x1="26" y1="43" x2="30" y2="43" stroke="#8B4513" stroke-width="2"/>
  <line x1="32" y1="43" x2="36" y2="43" stroke="#8B4513" stroke-width="2"/>
  <line x1="38" y1="43" x2="42" y2="43" stroke="#8B4513" stroke-width="2"/>
</svg>