<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="compassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0088ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004488;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="compassGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#00ffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:0.3" />
    </radialGradient>
    <filter id="compassFilter">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#00ffff" stroke-width="2"/>
  
  <!-- Compass ring -->
  <circle cx="72" cy="72" r="40" fill="none" stroke="url(#compassGrad)" stroke-width="4" filter="url(#compassFilter)"/>
  
  <!-- Cardinal directions -->
  <text x="72" y="40" font-family="Arial" font-size="12" font-weight="bold" fill="#ff0000" text-anchor="middle">N</text>
  <text x="72" y="110" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
  <text x="110" y="77" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">E</text>
  <text x="39" y="77" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">W</text>
  
  <!-- Compass needle -->
  <g>
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 72 72;360 72 72" 
      dur="10s" 
      repeatCount="indefinite"/>
    
    <!-- North pointer (red) -->
    <path d="M72 35 L77 60 L72 55 L67 60 Z" fill="#ff0000" filter="url(#compassFilter)"/>
    
    <!-- South pointer (white) -->
    <path d="M72 109 L77 84 L72 89 L67 84 Z" fill="#ffffff" filter="url(#compassFilter)"/>
  </g>
  
  <!-- Compass center -->
  <circle cx="72" cy="72" r="6" fill="url(#compassGlow)" filter="url(#compassFilter)"/>
  
  <!-- Degree markings -->
  <g>
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 72 72;-360 72 72" 
      dur="15s" 
      repeatCount="indefinite"/>
    
    <!-- Major markings -->
    <rect x="70" y="32" width="4" height="8" fill="#00ffff"/>
    <rect x="70" y="104" width="4" height="8" fill="#00ffff"/>
    <rect x="32" y="70" width="8" height="4" fill="#00ffff"/>
    <rect x="104" y="70" width="8" height="4" fill="#00ffff"/>
    
    <!-- Minor markings -->
    <rect x="71" y="35" width="2" height="4" fill="#88ffff" opacity="0.6"/>
    <rect x="71" y="105" width="2" height="4" fill="#88ffff" opacity="0.6"/>
    <rect x="35" y="71" width="4" height="2" fill="#88ffff" opacity="0.6"/>
    <rect x="105" y="71" width="4" height="2" fill="#88ffff" opacity="0.6"/>
  </g>
  
  <!-- Gyro stabilization rings -->
  <circle cx="72" cy="72" r="50" fill="none" stroke="#88ffff" stroke-width="1" opacity="0.4">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 72 72;360 72 72" 
      dur="8s" 
      repeatCount="indefinite"/>
  </circle>
  
  <circle cx="72" cy="72" r="25" fill="none" stroke="#88ffff" stroke-width="1" opacity="0.6">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 72 72;-360 72 72" 
      dur="6s" 
      repeatCount="indefinite"/>
  </circle>
  
  <!-- Heading display -->
  <rect x="55" y="18" width="34" height="8" fill="#003366" stroke="#00ffff" stroke-width="1" rx="2"/>
  <text x="72" y="24" font-family="monospace" font-size="8" fill="#00ff00" text-anchor="middle">047°</text>
  
  <!-- Gyro status -->
  <circle cx="25" cy="25" r="3" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Stabilization field -->
  <circle cx="72" cy="72" r="35" fill="none" stroke="#66ccff" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="35;45;35" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>