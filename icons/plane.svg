<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#silver;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#404040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#606060;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="thruster" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#0080ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#0a1a2e" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Main fuselage -->
  <ellipse cx="72" cy="72" rx="45" ry="15" fill="url(#planeGrad)"/>
  
  <!-- Wings -->
  <path d="M35 72 L25 55 L30 50 L40 65 Z" fill="url(#planeGrad)"/>
  <path d="M109 72 L119 55 L114 50 L104 65 Z" fill="url(#planeGrad)"/>
  <path d="M35 72 L25 89 L30 94 L40 79 Z" fill="url(#planeGrad)"/>
  <path d="M109 72 L119 89 L114 94 L104 79 Z" fill="url(#planeGrad)"/>
  
  <!-- Cockpit -->
  <ellipse cx="72" cy="72" rx="20" ry="8" fill="#003366" stroke="#00ffff" stroke-width="1"/>
  
  <!-- Thrusters -->
  <ellipse cx="25" cy="72" rx="8" ry="4" fill="url(#thruster)">
    <animate attributeName="rx" values="8;12;8" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Navigation lights -->
  <circle cx="115" cy="55" r="2" fill="#ff0000">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="89" r="2" fill="#00ff00">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Engine glow -->
  <circle cx="15" cy="72" r="6" fill="#00ffff" opacity="0.6">
    <animate attributeName="r" values="6;10;6" dur="0.8s" repeatCount="indefinite"/>
  </circle>
</svg>