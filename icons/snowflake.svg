<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(16, 16)">
    <!-- Center point -->
    <circle cx="20" cy="20" r="3" fill="#4a9eff"/>
    
    <!-- Main snowflake arms -->
    <line x1="20" y1="4" x2="20" y2="36" stroke="#4a9eff" stroke-width="3"/>
    <line x1="4" y1="20" x2="36" y2="20" stroke="#4a9eff" stroke-width="3"/>
    <line x1="8" y1="8" x2="32" y2="32" stroke="#4a9eff" stroke-width="3"/>
    <line x1="32" y1="8" x2="8" y2="32" stroke="#4a9eff" stroke-width="3"/>
    
    <!-- Branch details -->
    <!-- Top arm -->
    <line x1="20" y1="8" x2="16" y2="12" stroke="#4a9eff" stroke-width="2"/>
    <line x1="20" y1="8" x2="24" y2="12" stroke="#4a9eff" stroke-width="2"/>
    
    <!-- Bottom arm -->
    <line x1="20" y1="32" x2="16" y2="28" stroke="#4a9eff" stroke-width="2"/>
    <line x1="20" y1="32" x2="24" y2="28" stroke="#4a9eff" stroke-width="2"/>
    
    <!-- Left arm -->
    <line x1="8" y1="20" x2="12" y2="16" stroke="#4a9eff" stroke-width="2"/>
    <line x1="8" y1="20" x2="12" y2="24" stroke="#4a9eff" stroke-width="2"/>
    
    <!-- Right arm -->
    <line x1="32" y1="20" x2="28" y2="16" stroke="#4a9eff" stroke-width="2"/>
    <line x1="32" y1="20" x2="28" y2="24" stroke="#4a9eff" stroke-width="2"/>
    
    <!-- End crystals -->
    <circle cx="20" cy="4" r="2" fill="#ffffff"/>
    <circle cx="20" cy="36" r="2" fill="#ffffff"/>
    <circle cx="4" cy="20" r="2" fill="#ffffff"/>
    <circle cx="36" cy="20" r="2" fill="#ffffff"/>
    <circle cx="8" cy="8" r="2" fill="#ffffff"/>
    <circle cx="32" cy="32" r="2" fill="#ffffff"/>
    <circle cx="32" cy="8" r="2" fill="#ffffff"/>
    <circle cx="8" cy="32" r="2" fill="#ffffff"/>
    
    <!-- Cooling effect particles -->
    <circle cx="12" cy="10" r="1" fill="#4a9eff" opacity="0.6"/>
    <circle cx="28" cy="14" r="1" fill="#4a9eff" opacity="0.4"/>
    <circle cx="14" cy="30" r="1" fill="#4a9eff" opacity="0.8"/>
    <circle cx="30" cy="26" r="1" fill="#4a9eff" opacity="0.3"/>
  </g>
</svg>