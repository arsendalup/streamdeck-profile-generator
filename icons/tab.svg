<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6f7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b3e5ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="activeTabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Tab container background -->
  <rect x="8" y="32" width="56" height="32" rx="4" fill="#f0f8ff" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Tab 1 (inactive) -->
  <rect x="12" y="16" width="16" height="20" rx="4" ry="4" fill="url(#tabGrad)" stroke="#00d4ff" stroke-width="1" opacity="0.7"/>
  <text x="20" y="27" text-anchor="middle" font-family="Arial" font-size="6" fill="#0099cc">Tab 1</text>
  
  <!-- Tab 2 (active) -->
  <rect x="28" y="12" width="16" height="24" rx="4" ry="4" fill="url(#activeTabGrad)" stroke="#00d4ff" stroke-width="2">
    <animate attributeName="transform" values="scale(1); scale(1.02); scale(1)" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="36" y="26" text-anchor="middle" font-family="Arial" font-size="6" font-weight="bold" fill="#00588a">Tab 2</text>
  
  <!-- Active tab indicator -->
  <rect x="30" y="33" width="12" height="2" fill="#00d4ff">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Tab 3 (inactive) -->
  <rect x="44" y="16" width="16" height="20" rx="4" ry="4" fill="url(#tabGrad)" stroke="#00d4ff" stroke-width="1" opacity="0.7"/>
  <text x="52" y="27" text-anchor="middle" font-family="Arial" font-size="6" fill="#0099cc">Tab 3</text>
  
  <!-- Content area -->
  <rect x="12" y="36" width="48" height="24" rx="2" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  
  <!-- Content text lines -->
  <rect x="16" y="40" width="32" height="2" rx="1" fill="#cccccc"/>
  <rect x="16" y="44" width="28" height="2" rx="1" fill="#cccccc"/>
  <rect x="16" y="48" width="36" height="2" rx="1" fill="#cccccc"/>
  <rect x="16" y="52" width="24" height="2" rx="1" fill="#cccccc"/>
  
  <!-- Close buttons -->
  <g opacity="0.6">
    <!-- Tab 1 close -->
    <circle cx="26" cy="20" r="2" fill="#ff6666" stroke="#ffffff" stroke-width="1"/>
    <line x1="25" y1="19" x2="27" y2="21" stroke="#ffffff" stroke-width="1"/>
    <line x1="27" y1="19" x2="25" y2="21" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Tab 2 close -->
    <circle cx="42" cy="18" r="2" fill="#ff6666" stroke="#ffffff" stroke-width="1"/>
    <line x1="41" y1="17" x2="43" y2="19" stroke="#ffffff" stroke-width="1"/>
    <line x1="43" y1="17" x2="41" y2="19" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Tab 3 close -->
    <circle cx="58" cy="20" r="2" fill="#ff6666" stroke="#ffffff" stroke-width="1"/>
    <line x1="57" y1="19" x2="59" y2="21" stroke="#ffffff" stroke-width="1"/>
    <line x1="59" y1="19" x2="57" y2="21" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <!-- Tab icons -->
  <g opacity="0.8">
    <!-- Tab 1 icon -->
    <circle cx="16" cy="22" r="2" fill="#0099cc"/>
    <rect x="15" y="21" width="2" height="2" fill="#ffffff"/>
    
    <!-- Tab 2 icon (active) -->
    <rect x="30" y="20" width="4" height="3" rx="1" fill="#00588a"/>
    <circle cx="32" cy="18" r="1" fill="#00588a"/>
    
    <!-- Tab 3 icon -->
    <polygon points="48,22 50,20 52,22 50,24" fill="#0099cc"/>
  </g>
  
  <!-- New tab button -->
  <circle cx="62" cy="24" r="4" fill="#f0f8ff" stroke="#00d4ff" stroke-width="2">
    <animate attributeName="fill" values="#f0f8ff;#ffffff;#f0f8ff" dur="2s" repeatCount="indefinite"/>
  </circle>
  <line x1="60" y1="24" x2="64" y2="24" stroke="#00d4ff" stroke-width="2"/>
  <line x1="62" y1="22" x2="62" y2="26" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Tab switching arrows -->
  <g transform="translate(4, 24)" opacity="0.7">
    <path d="M0 0 L4 -2 L4 2 Z" fill="#0099cc">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <g transform="translate(68, 24)" opacity="0.7">
    <path d="M0 0 L-4 -2 L-4 2 Z" fill="#0099cc">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Keyboard shortcut indicators -->
  <g font-family="monospace" font-size="4" fill="#999999" opacity="0.6">
    <text x="20" y="32">1</text>
    <text x="36" y="30">2</text>
    <text x="52" y="32">3</text>
  </g>
  
  <!-- Tab loading indicator (for active tab) -->
  <rect x="28" y="14" width="16" height="1" fill="#000000" opacity="0.1"/>
  <rect x="28" y="14" width="8" height="1" fill="#00d4ff">
    <animate attributeName="width" values="0;16;0" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Content scrollbar -->
  <rect x="58" y="36" width="2" height="24" rx="1" fill="#e6e6e6"/>
  <rect x="58" y="40" width="2" height="8" rx="1" fill="#cccccc">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,12; 0,0" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Tab counter -->
  <g transform="translate(8, 8)" opacity="0.7">
    <rect width="12" height="6" rx="2" fill="#001122" stroke="#00d4ff" stroke-width="1"/>
    <text x="6" y="4" text-anchor="middle" font-family="monospace" font-size="4" fill="#00d4ff">3/8</text>
  </g>
  
  <!-- Bookmark indicator -->
  <g transform="translate(40, 8)" opacity="0.8">
    <polygon points="0,0 4,0 4,6 2,4 0,6" fill="#ffaa00" stroke="#ffffff" stroke-width="1">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </polygon>
  </g>
  
  <!-- Activity indicator -->
  <circle cx="48" cy="18" r="1" fill="#00ff00">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Tab overflow indicator -->
  <g transform="translate(56, 8)" opacity="0.6">
    <circle cx="0" cy="0" r="1" fill="#999999"/>
    <circle cx="3" cy="0" r="1" fill="#999999"/>
    <circle cx="6" cy="0" r="1" fill="#999999"/>
  </g>
  
  <!-- Pinned tab indicator -->
  <g transform="translate(14, 18)" opacity="0.8">
    <path d="M0 0 L2 -1 L2 1 Z" fill="#ff6600"/>
  </g>
  
  <!-- Tab memory usage -->
  <g transform="translate(56, 64)" opacity="0.5">
    <rect width="12" height="4" rx="1" fill="#000000" stroke="#ffff00" stroke-width="1"/>
    <text x="6" y="3" text-anchor="middle" font-family="monospace" font-size="3" fill="#ffff00">128MB</text>
  </g>
  
  <!-- Tab navigation breadcrumb -->
  <g transform="translate(12, 64)" opacity="0.6">
    <text font-family="Arial" font-size="4" fill="#666666">Home > Documents > Star Citizen</text>
  </g>
</svg>