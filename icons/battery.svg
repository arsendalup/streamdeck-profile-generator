<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="batteryBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#404040;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#606060;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chargeLevel" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#88ff00;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="90%" style="stop-color:#ff8800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0000;stop-opacity:1" />
    </linearGradient>
    <filter id="batteryGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#00ff00" stroke-width="2"/>
  
  <!-- Battery casing -->
  <rect x="40" y="35" width="64" height="74" fill="url(#batteryBody)" rx="8" filter="url(#batteryGlow)"/>
  
  <!-- Battery terminals -->
  <rect x="67" y="25" width="10" height="10" fill="url(#batteryBody)" rx="2"/>
  
  <!-- Charge level indicator -->
  <rect x="45" y="95" width="54" height="8" fill="url(#chargeLevel)" rx="4">
    <animate attributeName="width" values="54;20;54" dur="8s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Power cells -->
  <rect x="50" y="45" width="44" height="12" fill="#003366" stroke="#00ffff" stroke-width="1" rx="2"/>
  <rect x="50" y="62" width="44" height="12" fill="#003366" stroke="#00ffff" stroke-width="1" rx="2"/>
  <rect x="50" y="79" width="44" height="12" fill="#003366" stroke="#00ffff" stroke-width="1" rx="2"/>
  
  <!-- Energy flow -->
  <rect x="53" y="48" width="8" height="6" fill="#00ff00" rx="1">
    <animate attributeName="fill" values="#00ff00;#88ff00;#00ff00" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <rect x="67" y="48" width="8" height="6" fill="#00ff00" rx="1">
    <animate attributeName="fill" values="#00ff00;#88ff00;#00ff00" dur="1s" repeatCount="indefinite" begin="0.2s"/>
  </rect>
  
  <rect x="81" y="48" width="8" height="6" fill="#00ff00" rx="1">
    <animate attributeName="fill" values="#00ff00;#88ff00;#00ff00" dur="1s" repeatCount="indefinite" begin="0.4s"/>
  </rect>
  
  <rect x="53" y="65" width="8" height="6" fill="#88ff00" rx="1">
    <animate attributeName="fill" values="#88ff00;#ffff00;#88ff00" dur="1s" repeatCount="indefinite" begin="0.1s"/>
  </rect>
  
  <rect x="67" y="65" width="8" height="6" fill="#88ff00" rx="1">
    <animate attributeName="fill" values="#88ff00;#ffff00;#88ff00" dur="1s" repeatCount="indefinite" begin="0.3s"/>
  </rect>
  
  <rect x="81" y="65" width="8" height="6" fill="#88ff00" rx="1">
    <animate attributeName="fill" values="#88ff00;#ffff00;#88ff00" dur="1s" repeatCount="indefinite" begin="0.5s"/>
  </rect>
  
  <rect x="53" y="82" width="8" height="6" fill="#ffff00" rx="1">
    <animate attributeName="fill" values="#ffff00;#ff8800;#ffff00" dur="1s" repeatCount="indefinite" begin="0.15s"/>
  </rect>
  
  <rect x="67" y="82" width="8" height="6" fill="#ffff00" rx="1">
    <animate attributeName="fill" values="#ffff00;#ff8800;#ffff00" dur="1s" repeatCount="indefinite" begin="0.35s"/>
  </rect>
  
  <rect x="81" y="82" width="8" height="6" fill="#ffff00" rx="1">
    <animate attributeName="fill" values="#ffff00;#ff8800;#ffff00" dur="1s" repeatCount="indefinite" begin="0.55s"/>
  </rect>
  
  <!-- Power level display -->
  <text x="72" y="120" font-family="monospace" font-size="10" fill="#00ff00" text-anchor="middle">87%</text>
  
  <!-- Charging indicator -->
  <path d="M108 50 L115 65 L112 65 L118 80 L108 72 L111 72 L105 57 Z" 
        fill="#ffff00" 
        opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Energy field -->
  <circle cx="72" cy="70" r="30" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="30;35;30" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Voltage indicators -->
  <circle cx="30" cy="55" r="2" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="30" cy="70" r="2" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  
  <circle cx="30" cy="85" r="2" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
</svg>