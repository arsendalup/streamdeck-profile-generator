<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="radioOffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#555555;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Radio body (dimmed) -->
  <rect x="12" y="24" width="48" height="32" rx="4" fill="url(#radioOffGrad)" stroke="#666666" stroke-width="2" opacity="0.6"/>
  
  <!-- Speaker grille (dimmed) -->
  <rect x="16" y="28" width="16" height="24" rx="2" fill="#222222" stroke="#444444" stroke-width="1" opacity="0.5"/>
  
  <!-- Speaker holes (dimmed) -->
  <g opacity="0.3">
    <circle cx="20" cy="32" r="1" fill="#444444"/>
    <circle cx="24" cy="32" r="1" fill="#444444"/>
    <circle cx="28" cy="32" r="1" fill="#444444"/>
    <circle cx="20" cy="36" r="1" fill="#444444"/>
    <circle cx="24" cy="36" r="1" fill="#444444"/>
    <circle cx="28" cy="36" r="1" fill="#444444"/>
    <circle cx="20" cy="40" r="1" fill="#444444"/>
    <circle cx="24" cy="40" r="1" fill="#444444"/>
    <circle cx="28" cy="40" r="1" fill="#444444"/>
    <circle cx="20" cy="44" r="1" fill="#444444"/>
    <circle cx="24" cy="44" r="1" fill="#444444"/>
    <circle cx="28" cy="44" r="1" fill="#444444"/>
    <circle cx="20" cy="48" r="1" fill="#444444"/>
    <circle cx="24" cy="48" r="1" fill="#444444"/>
    <circle cx="28" cy="48" r="1" fill="#444444"/>
  </g>
  
  <!-- Display screen (off) -->
  <rect x="36" y="28" width="20" height="8" rx="2" fill="#000000" stroke="#333333" stroke-width="1" opacity="0.7"/>
  <text x="46" y="33" text-anchor="middle" font-family="monospace" font-size="4" fill="#333333" opacity="0.4">NO SIGNAL</text>
  
  <!-- Control knobs (dimmed) -->
  <circle cx="40" cy="44" r="4" fill="#444444" stroke="#333333" stroke-width="1" opacity="0.6"/>
  <circle cx="40" cy="44" r="2" fill="#333333" opacity="0.5"/>
  <line x1="40" y1="42" x2="40" y2="44" stroke="#555555" stroke-width="1" opacity="0.4"/>
  
  <circle cx="52" cy="44" r="4" fill="#444444" stroke="#333333" stroke-width="1" opacity="0.6"/>
  <circle cx="52" cy="44" r="2" fill="#333333" opacity="0.5"/>
  <line x1="50" y1="44" x2="52" y2="44" stroke="#555555" stroke-width="1" opacity="0.4"/>
  
  <!-- Power button (off) -->
  <circle cx="46" cy="52" r="3" fill="#333333" stroke="#555555" stroke-width="1" opacity="0.5"/>
  <circle cx="46" cy="52" r="1.5" fill="#111111" opacity="0.6"/>
  
  <!-- Antenna (broken/bent) -->
  <line x1="56" y1="24" x2="60" y2="8" stroke="#666666" stroke-width="2" opacity="0.6"/>
  <line x1="60" y1="8" x2="64" y2="12" stroke="#666666" stroke-width="2" opacity="0.6"/>
  
  <!-- No signal waves (X marks) -->
  <g opacity="0.7">
    <g transform="translate(60, 20)">
      <line x1="-3" y1="-3" x2="3" y2="3" stroke="#ff3333" stroke-width="2"/>
      <line x1="3" y1="-3" x2="-3" y2="3" stroke="#ff3333" stroke-width="2"/>
    </g>
    <g transform="translate(64, 16)">
      <line x1="-4" y1="-4" x2="4" y2="4" stroke="#ff3333" stroke-width="2"/>
      <line x1="4" y1="-4" x2="-4" y2="4" stroke="#ff3333" stroke-width="2"/>
    </g>
    <g transform="translate(68, 12)">
      <line x1="-5" y1="-5" x2="5" y2="5" stroke="#ff3333" stroke-width="2"/>
      <line x1="5" y1="-5" x2="-5" y2="5" stroke="#ff3333" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Signal strength (empty bars) -->
  <g transform="translate(40, 38)" opacity="0.3">
    <rect x="0" y="0" width="2" height="2" fill="#333333"/>
    <rect x="3" y="0" width="2" height="2" fill="#333333"/>
    <rect x="6" y="0" width="2" height="2" fill="#333333"/>
    <rect x="9" y="0" width="2" height="2" fill="#333333"/>
  </g>
  
  <!-- Dead battery indicator -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="8" height="4" rx="1" fill="#333333" stroke="#666666" stroke-width="1"/>
    <rect x="8" y="1" width="2" height="2" rx="0.5" fill="#333333"/>
    <rect x="1" y="1" width="6" height="2" fill="#ff3333" opacity="0.7"/>
    <text x="4" y="3" text-anchor="middle" font-family="Arial" font-size="2" fill="#ffffff">!</text>
  </g>
  
  <!-- Status LEDs (off) -->
  <circle cx="36" cy="52" r="1.5" fill="#333333" stroke="#555555" stroke-width="0.5"/>
  <circle cx="42" cy="52" r="1.5" fill="#333333" stroke="#555555" stroke-width="0.5"/>
  <circle cx="48" cy="52" r="1.5" fill="#333333" stroke="#555555" stroke-width="0.5"/>
  
  <!-- Frequency display (blank) -->
  <g opacity="0.4">
    <text x="46" y="42" text-anchor="middle" font-family="monospace" font-size="3" fill="#333333">---.---</text>
    <text x="50" y="42" font-family="monospace" font-size="3" fill="#333333">MHz</text>
  </g>
  
  <!-- Large mute/off indicator -->
  <g stroke="#ff3333" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="20" y1="20" x2="52" y2="52">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="52" y1="20" x2="20" y2="52">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Power cord (unplugged) -->
  <g transform="translate(12, 56)" opacity="0.5">
    <path d="M0 0 Q-4 4 -8 2" stroke="#333333" stroke-width="2" fill="none"/>
    <circle cx="-8" cy="2" r="1" fill="#333333"/>
  </g>
  
  <!-- Error message -->
  <g transform="translate(36, 60)">
    <rect x="-12" y="0" width="24" height="6" rx="2" fill="#ff3333" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial" font-size="4" font-weight="bold" fill="#ffffff">OFFLINE</text>
  </g>
  
  <!-- Static/interference pattern -->
  <g opacity="0.2">
    <circle cx="24" cy="40" r="0.5" fill="#666666">
      <animate attributeName="opacity" values="0;0.3;0" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="28" cy="36" r="0.5" fill="#666666">
      <animate attributeName="opacity" values="0;0.3;0" dur="0.7s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="44" r="0.5" fill="#666666">
      <animate attributeName="opacity" values="0;0.3;0" dur="0.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Warning triangle -->
  <g transform="translate(58, 8)" opacity="0.8">
    <polygon points="4,0 8,6 0,6" fill="#ff3333" stroke="#ffffff" stroke-width="1"/>
    <text x="4" y="5" text-anchor="middle" font-family="Arial" font-size="4" font-weight="bold" fill="#ffffff">!</text>
  </g>
</svg>