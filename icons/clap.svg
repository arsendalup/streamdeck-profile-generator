<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(16, 20)">
    <!-- Left hand clapping -->
    <ellipse cx="12" cy="8" rx="6" ry="8" fill="#4a9eff" stroke="#ffffff" stroke-width="2" transform="rotate(-20 12 8)"/>
    <!-- Right hand clapping -->
    <ellipse cx="28" cy="8" rx="6" ry="8" fill="#4a9eff" stroke="#ffffff" stroke-width="2" transform="rotate(20 28 8)"/>
    <!-- Impact lines -->
    <g stroke="#ffff44" stroke-width="2" opacity="0.8">
      <path d="M16 4 L24 4"/>
      <path d="M18 8 L22 8"/>
      <path d="M16 12 L24 12"/>
    </g>
    <!-- Motion lines -->
    <g stroke="#4a9eff" stroke-width="1" opacity="0.6">
      <path d="M6 8 Q2 8, 4 12"/>
      <path d="M34 8 Q38 8, 36 12"/>
      <path d="M8 6 Q4 6, 6 10"/>
      <path d="M32 6 Q36 6, 34 10"/>
    </g>
    <!-- Sound waves -->
    <g stroke="#ffffff" stroke-width="1" opacity="0.5">
      <circle cx="20" cy="8" r="16" fill="none"/>
      <circle cx="20" cy="8" r="20" fill="none"/>
    </g>
  </g>
</svg>
