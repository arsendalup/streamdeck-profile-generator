<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0088ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004488;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="suitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:0.3" />
    </radialGradient>
    <filter id="userGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#0a1a2e" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Head/Helmet -->
  <circle cx="72" cy="45" r="18" fill="url(#userGrad)" filter="url(#userGlow)"/>
  
  <!-- Visor -->
  <ellipse cx="72" cy="42" rx="12" ry="8" fill="#003366" stroke="#00ffff" stroke-width="1"/>
  
  <!-- HUD elements in visor -->
  <rect x="67" y="40" width="2" height="1" fill="#00ff00"/>
  <rect x="75" y="40" width="2" height="1" fill="#ffff00"/>
  <circle cx="72" cy="44" r="1" fill="#ff0000">
    <animate attributeName="fill" values="#ff0000;#ffff00;#ff0000" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Body/Suit -->
  <rect x="55" y="60" width="34" height="50" fill="url(#userGrad)" rx="17" filter="url(#userGlow)"/>
  
  <!-- Arms -->
  <ellipse cx="45" cy="75" rx="8" ry="20" fill="url(#userGrad)"/>
  <ellipse cx="99" cy="75" rx="8" ry="20" fill="url(#userGrad)"/>
  
  <!-- Suit details -->
  <rect x="68" y="65" width="8" height="15" fill="#003366" stroke="#00ffff" stroke-width="1" rx="4"/>
  
  <!-- Life support indicators -->
  <circle cx="60" cy="70" r="2" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#88ff00;#00ff00" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="84" cy="70" r="2" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#88ff00;#00ff00" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  
  <!-- Utility belt -->
  <rect x="58" y="85" width="28" height="4" fill="#606060" rx="2"/>
  <rect x="62" y="87" width="3" height="2" fill="#ff6600"/>
  <rect x="67" y="87" width="3" height="2" fill="#00ff00"/>
  <rect x="72" y="87" width="3" height="2" fill="#0080ff"/>
  <rect x="77" y="87" width="3" height="2" fill="#ffff00"/>
  
  <!-- Boots -->
  <ellipse cx="63" cy="115" rx="8" ry="5" fill="url(#userGrad)"/>
  <ellipse cx="81" cy="115" rx="8" ry="5" fill="url(#userGrad)"/>
  
  <!-- Energy field -->
  <circle cx="72" cy="75" r="35" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="35;40;35" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>