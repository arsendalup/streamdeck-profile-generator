<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rotateCwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#88ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44aa00;stop-opacity:1" />
    </linearGradient>
    <filter id="rotateCwGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#00ff00" stroke-width="2"/>
  
  <!-- Clockwise arrow -->
  <path d="M72 35 A25 25 0 1 1 97 72" 
        fill="none" 
        stroke="url(#rotateCwGrad)" 
        stroke-width="6" 
        stroke-linecap="round"
        filter="url(#rotateCwGlow)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 72 72;360 72 72" 
      dur="3s" 
      repeatCount="indefinite"/>
  </path>
  
  <!-- Arrow head -->
  <path d="M92 75 L102 72 L92 69 Z" 
        fill="url(#rotateCwGrad)" 
        filter="url(#rotateCwGlow)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 72 72;360 72 72" 
      dur="3s" 
      repeatCount="indefinite"/>
  </path>
  
  <!-- Center point -->
  <circle cx="72" cy="72" r="4" fill="url(#rotateCwGrad)">
    <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Rotation indicator -->
  <circle cx="72" cy="72" r="20" fill="none" stroke="#88ff88" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="20;25;20" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>