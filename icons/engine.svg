<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="engineBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#606060;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#404040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="exhaustFlame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#00ffff;stop-opacity:0.9" />
      <stop offset="60%" style="stop-color:#0080ff;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:0.3" />
    </radialGradient>
    <filter id="engineGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#0a1a2e" stroke="#606060" stroke-width="2"/>
  
  <!-- Engine housing -->
  <ellipse cx="72" cy="65" rx="35" ry="25" fill="url(#engineBody)" filter="url(#engineGlow)"/>
  
  <!-- Engine intake -->
  <ellipse cx="72" cy="35" rx="20" ry="8" fill="#1a1a1a" stroke="#00ffff" stroke-width="1"/>
  
  <!-- Intake blades -->
  <path d="M55 32 L89 32" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
  <path d="M58 35 L86 35" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
  <path d="M61 38 L83 38" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
  
  <!-- Main thruster nozzle -->
  <ellipse cx="72" cy="105" rx="25" ry="12" fill="url(#exhaustFlame)" filter="url(#engineGlow)">
    <animate attributeName="ry" values="12;18;12" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="105;110;105" dur="0.8s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Plasma exhaust -->
  <ellipse cx="72" cy="115" rx="15" ry="8" fill="#00ffff" opacity="0.8">
    <animate attributeName="ry" values="8;15;8" dur="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="0.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Engine core -->
  <circle cx="72" cy="65" r="15" fill="#003366" stroke="#00ffff" stroke-width="2">
    <animate attributeName="stroke-width" values="2;4;2" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="72" cy="65" r="8" fill="#00ffff">
    <animate attributeName="r" values="8;12;8" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Cooling vents -->
  <rect x="45" y="55" width="4" height="8" fill="#00ffff" opacity="0.6" rx="2"/>
  <rect x="52" y="55" width="4" height="8" fill="#00ffff" opacity="0.6" rx="2"/>
  <rect x="88" y="55" width="4" height="8" fill="#00ffff" opacity="0.6" rx="2"/>
  <rect x="95" y="55" width="4" height="8" fill="#00ffff" opacity="0.6" rx="2"/>
  
  <rect x="45" y="70" width="4" height="8" fill="#00ffff" opacity="0.6" rx="2"/>
  <rect x="52" y="70" width="4" height="8" fill="#00ffff" opacity="0.6" rx="2"/>
  <rect x="88" y="70" width="4" height="8" fill="#00ffff" opacity="0.6" rx="2"/>
  <rect x="95" y="70" width="4" height="8" fill="#00ffff" opacity="0.6" rx="2"/>
  
  <!-- Side thrusters -->
  <ellipse cx="40" cy="75" rx="8" ry="4" fill="url(#exhaustFlame)">
    <animate attributeName="rx" values="8;12;8" dur="0.7s" repeatCount="indefinite"/>
  </ellipse>
  
  <ellipse cx="104" cy="75" rx="8" ry="4" fill="url(#exhaustFlame)">
    <animate attributeName="rx" values="8;12;8" dur="0.7s" repeatCount="indefinite" begin="0.35s"/>
  </ellipse>
  
  <!-- Engine performance indicators -->
  <rect x="25" y="45" width="3" height="12" fill="#00ff00" rx="1"/>
  <rect x="30" y="47" width="3" height="8" fill="#88ff00" rx="1"/>
  <rect x="35" y="49" width="3" height="4" fill="#ffff00" rx="1"/>
  
  <text x="25" y="40" font-family="monospace" font-size="8" fill="#00ffff">PWR</text>
  
  <!-- Heat signature -->
  <circle cx="72" cy="95" r="3" fill="#ff4400">
    <animate attributeName="r" values="3;6;3" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#ff4400;#ffaa00;#ff4400" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Exhaust particles -->
  <circle cx="65" cy="120" r="1" fill="#ffffff">
    <animate attributeName="cy" values="120;130;120" dur="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="79" cy="120" r="1" fill="#ffffff">
    <animate attributeName="cy" values="120;130;120" dur="0.4s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.4s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
</svg>