<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(16, 16)">
    <!-- Speedometer dial -->
    <circle cx="20" cy="20" r="18" fill="#2d4a5a" stroke="#ffffff" stroke-width="2"/>
    <circle cx="20" cy="20" r="14" fill="none" stroke="#4a9eff" stroke-width="1"/>
    
    <!-- Speed marks -->
    <g stroke="#ffffff" stroke-width="2">
      <line x1="20" y1="6" x2="20" y2="10"/>
      <line x1="32" y1="12" x2="30" y2="14"/>
      <line x1="32" y1="28" x2="30" y2="26"/>
      <line x1="20" y1="34" x2="20" y2="30"/>
      <line x1="8" y1="28" x2="10" y2="26"/>
      <line x1="8" y1="12" x2="10" y2="14"/>
    </g>
    
    <!-- Needle -->
    <path d="M20 20 L26 14" stroke="#ff4444" stroke-width="3" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="2" fill="#ff4444"/>
    
    <!-- Speed text -->
    <text x="20" y="30" text-anchor="middle" fill="#ffffff" font-size="6">SPEED</text>
  </g>
</svg>
