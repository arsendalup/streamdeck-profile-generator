<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8800;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff4400;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#aa2200;stop-opacity:1" />
    </linearGradient>
    <filter id="chevronGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#ff8800" stroke-width="2"/>
  
  <!-- Chevron down -->
  <path d="M40 59 L72 91 L104 59" 
        stroke="url(#chevronGrad)" 
        stroke-width="8" 
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#chevronGlow)">
    <animate attributeName="stroke-opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Movement trail -->
  <path d="M40 49 L72 81 L104 49" 
        stroke="#ffaa88" 
        stroke-width="4" 
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
  </path>
  
  <!-- Energy pulse -->
  <circle cx="72" cy="72" r="20" fill="none" stroke="#ff8800" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="20;30;20" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>