<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0088ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004488;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="handGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:0.2" />
    </radialGradient>
    <filter id="handFilter">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Palm -->
  <ellipse cx="72" cy="85" rx="25" ry="20" fill="url(#handGrad)" filter="url(#handFilter)"/>
  
  <!-- Thumb -->
  <ellipse cx="50" cy="75" rx="8" ry="15" fill="url(#handGrad)" transform="rotate(-20 50 75)"/>
  
  <!-- Index finger -->
  <ellipse cx="65" cy="45" rx="6" ry="18" fill="url(#handGrad)"/>
  
  <!-- Middle finger -->
  <ellipse cx="75" cy="40" rx="6" ry="20" fill="url(#handGrad)"/>
  
  <!-- Ring finger -->
  <ellipse cx="85" cy="45" rx="6" ry="18" fill="url(#handGrad)"/>
  
  <!-- Pinky -->
  <ellipse cx="93" cy="52" rx="5" ry="15" fill="url(#handGrad)"/>
  
  <!-- Interaction field -->
  <circle cx="72" cy="70" r="35" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="35;45;35" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Tech enhancement lines -->
  <path d="M55 85 L72 85 L89 85" stroke="#00ffff" stroke-width="2" opacity="0.6"/>
  <path d="M72 65 L72 105" stroke="#00ffff" stroke-width="2" opacity="0.6"/>
  
  <!-- Fingertip sensors -->
  <circle cx="65" cy="35" r="2" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="75" cy="30" r="2" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  
  <circle cx="85" cy="35" r="2" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  
  <circle cx="93" cy="42" r="2" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="1.5s" repeatCount="indefinite" begin="0.9s"/>
  </circle>
  
  <circle cx="45" cy="65" r="2" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
  
  <!-- Gesture trail -->
  <path d="M40 90 Q55 70 75 60 Q95 50 110 45" 
        stroke="#88ffff" 
        stroke-width="2" 
        fill="none" 
        opacity="0.5"
        stroke-dasharray="5 5">
    <animate attributeName="stroke-dashoffset" values="0;-20;0" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Interface particles -->
  <circle cx="60" cy="55" r="1" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" begin="0s"/>
  </circle>
  
  <circle cx="80" cy="50" r="1" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  
  <circle cx="90" cy="60" r="1" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  
  <!-- Hand outline glow -->
  <circle cx="72" cy="70" r="30" fill="url(#handGlow)" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>