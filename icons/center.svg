<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#00ffff;stop-opacity:0.9" />
      <stop offset="70%" style="stop-color:#0080ff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:0.2" />
    </radialGradient>
    <filter id="centerFilter">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#00ffff" stroke-width="2"/>
  
  <!-- Center point -->
  <circle cx="72" cy="72" r="8" fill="url(#centerGlow)" filter="url(#centerFilter)">
    <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Center crosshair -->
  <path d="M72 30 L72 50 M72 94 L72 114 M30 72 L50 72 M94 72 L114 72" 
        stroke="#00ffff" 
        stroke-width="3" 
        stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Corner brackets -->
  <path d="M45 45 L55 45 L55 55 M89 45 L99 45 L99 55 M45 99 L55 99 L55 89 M89 99 L99 99 L99 89" 
        stroke="#88ffff" 
        stroke-width="2" 
        fill="none"/>
  
  <!-- Centering rings -->
  <circle cx="72" cy="72" r="25" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.6">
    <animate attributeName="r" values="25;30;25" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="72" cy="72" r="40" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="40;45;40" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  
  <!-- Direction indicators -->
  <path d="M72 25 L77 35 L67 35 Z" fill="#00ff00"/>
  <path d="M72 119 L77 109 L67 109 Z" fill="#00ff00"/>
  <path d="M25 72 L35 67 L35 77 Z" fill="#00ff00"/>
  <path d="M119 72 L109 67 L109 77 Z" fill="#00ff00"/>
  
  <!-- Center lock indicator -->
  <rect x="55" y="20" width="34" height="6" fill="#003366" stroke="#00ffff" stroke-width="1" rx="2"/>
  <text x="72" y="25" font-family="monospace" font-size="6" fill="#00ff00" text-anchor="middle">CENTERED</text>
  
  <!-- Alignment guides -->
  <path d="M40 40 L104 40" stroke="#66ccff" stroke-width="0.5" opacity="0.4" stroke-dasharray="2 2"/>
  <path d="M40 104 L104 104" stroke="#66ccff" stroke-width="0.5" opacity="0.4" stroke-dasharray="2 2"/>
  <path d="M40 40 L40 104" stroke="#66ccff" stroke-width="0.5" opacity="0.4" stroke-dasharray="2 2"/>
  <path d="M104 40 L104 104" stroke="#66ccff" stroke-width="0.5" opacity="0.4" stroke-dasharray="2 2"/>
  
  <!-- Calibration pulses -->
  <circle cx="72" cy="72" r="15" fill="none" stroke="#ffffff" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="15;35;15" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>