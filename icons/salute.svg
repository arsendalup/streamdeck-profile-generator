<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(16, 16)">
    <!-- Saluting figure -->
    <circle cx="20" cy="8" r="6" fill="#4a9eff" stroke="#ffffff" stroke-width="2"/>
    <!-- Body -->
    <rect x="16" y="14" width="8" height="16" fill="#2d4a5a" stroke="#ffffff" stroke-width="2" rx="2"/>
    <!-- Saluting arm -->
    <path d="M24 18 L30 12 L32 14 L26 20" fill="#4a9eff" stroke="#ffffff" stroke-width="2"/>
    <!-- Other arm -->
    <path d="M16 18 L10 22 L8 20 L14 16" fill="#4a9eff" stroke="#ffffff" stroke-width="2"/>
    <!-- Legs -->
    <rect x="17" y="30" width="3" height="10" fill="#2d4a5a"/>
    <rect x="20" y="30" width="3" height="10" fill="#2d4a5a"/>
