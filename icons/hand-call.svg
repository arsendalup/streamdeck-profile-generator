<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(16, 16)">
    <!-- Arm gesturing to come -->
    <path d="M8 20 Q12 16, 16 20 Q20 24, 16 28 Q12 32, 8 28 Q4 24, 8 20" 
          fill="#4a9eff" stroke="#ffffff" stroke-width="2"/>
    <!-- Hand calling -->
    <ellipse cx="16" cy="24" rx="4" ry="6" fill="#4a9eff" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Motion lines showing beckoning -->
    <g stroke="#4a9eff" stroke-width="2" opacity="0.7">
      <path d="M20 20 Q24 16, 28 20"/>
      <path d="M20 24 Q26 20, 32 24"/>
      <path d="M20 28 Q24 32, 28 28"/>
    </g>
    
    <!-- Direction arrows -->
    <g stroke="#ffffff" stroke-width="2" fill="none">
      <path d="M26 12 L30 16 L26 20"/>
      <path d="M30 12 L34 16 L30 20"/>
    </g>
    
    <!-- Person silhouette in distance -->
    <g transform="translate(32, 28)" opacity="0.5">
      <circle cx="4" cy="4" r="2" fill="#ffffff"/>
      <rect x="2" y="6" width="4" height="6" fill="#ffffff" rx="1"/>
    </g>
  </g>
</svg>
