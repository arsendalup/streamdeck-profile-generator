<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffaa00;stop-opacity:1" />
    </linearGradient>
    <filter id="laserGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#ff4444" stroke-width="2"/>
  
  <!-- Laser body -->
  <rect x="35" y="60" width="74" height="24" fill="url(#laserGrad)" filter="url(#laserGlow)" rx="12"/>
  
  <!-- Laser beam -->
  <path d="M109 67 L130 67 L135 72 L130 77 L109 77" fill="#ffff00" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="0.8s" repeatCount="indefinite"/>
  </path>
  
  <!-- Energy particles -->
  <circle cx="115" cy="72" r="2" fill="#ffff00">
    <animate attributeName="cx" values="115;125;115" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="120" cy="70" r="1.5" fill="#ff6600">
    <animate attributeName="cx" values="120;130;120" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Cooling vents -->
  <rect x="40" y="55" width="3" height="8" fill="#00ffff" opacity="0.6"/>
  <rect x="45" y="55" width="3" height="8" fill="#00ffff" opacity="0.6"/>
  <rect x="50" y="55" width="3" height="8" fill="#00ffff" opacity="0.6"/>
  
  <rect x="40" y="91" width="3" height="8" fill="#00ffff" opacity="0.6"/>
  <rect x="45" y="91" width="3" height="8" fill="#00ffff" opacity="0.6"/>
  <rect x="50" y="91" width="3" height="8" fill="#00ffff" opacity="0.6"/>
</svg>