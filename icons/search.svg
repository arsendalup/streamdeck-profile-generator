<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="searchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cccccc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#888888;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lensGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#e6f7ff;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  
  <!-- Magnifying glass lens -->
  <circle cx="32" cy="32" r="20" fill="url(#lensGrad)" stroke="url(#searchGrad)" stroke-width="3">
    <animate attributeName="r" values="20;21;20" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner lens -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#cccccc" stroke-width="1" opacity="0.5"/>
  
  <!-- Handle -->
  <line x1="47" y1="47" x2="60" y2="60" stroke="url(#searchGrad)" stroke-width="4" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 53.5 53.5;2 53.5 53.5;0 53.5 53.5" dur="2s" repeatCount="indefinite"/>
  </line>
  
  <!-- Handle grip -->
  <circle cx="60" cy="60" r="4" fill="url(#searchGrad)" stroke="#ffffff" stroke-width="1"/>
  <circle cx="60" cy="60" r="2" fill="#666666"/>
  
  <!-- Reflection on lens -->
  <ellipse cx="28" cy="28" rx="6" ry="10" fill="#ffffff" opacity="0.4" transform="rotate(-30 28 28)"/>
  <ellipse cx="25" cy="25" rx="2" ry="4" fill="#ffffff" opacity="0.6" transform="rotate(-30 25 25)"/>
  
  <!-- Search focus area -->
  <circle cx="32" cy="32" r="12" fill="none" stroke="#00d4ff" stroke-width="2" stroke-dasharray="4,4" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" values="0 32 32;360 32 32" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Found objects indicators -->
  <g opacity="0.8">
    <!-- Found item 1 -->
    <circle cx="28" cy="28" r="2" fill="#ff6600" stroke="#ffffff" stroke-width="1">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Found item 2 -->
    <circle cx="36" cy="36" r="2" fill="#00ff00" stroke="#ffffff" stroke-width="1">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Found item 3 -->
    <rect x="30" y="38" width="4" height="2" rx="1" fill="#ffff00" stroke="#ffffff" stroke-width="0.5">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Search beam -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="14;22;14" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Scanning rays -->
  <g opacity="0.5">
    <line x1="32" y1="20" x2="32" y2="12" stroke="#00d4ff" stroke-width="1">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="44" y1="32" x2="52" y2="32" stroke="#00d4ff" stroke-width="1">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="32" y1="44" x2="32" y2="52" stroke="#00d4ff" stroke-width="1">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="1s" repeatCount="indefinite"/>
    </line>
    <line x1="20" y1="32" x2="12" y2="32" stroke="#00d4ff" stroke-width="1">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Search results counter -->
  <g transform="translate(8, 8)" opacity="0.8">
    <rect width="16" height="6" rx="2" fill="#000000" stroke="#00d4ff" stroke-width="1"/>
    <text x="8" y="4" text-anchor="middle" font-family="monospace" font-size="4" fill="#00d4ff">
      FOUND: 3
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Crosshairs in lens -->
  <g opacity="0.6">
    <line x1="28" y1="32" x2="36" y2="32" stroke="#ff6600" stroke-width="1"/>
    <line x1="32" y1="28" x2="32" y2="36" stroke="#ff6600" stroke-width="1"/>
  </g>
  
  <!-- Zoom level indicator -->
  <g transform="translate(52, 8)" opacity="0.7">
    <rect width="12" height="6" rx="1" fill="#001122" stroke="#ffffff" stroke-width="1"/>
    <text x="6" y="4" text-anchor="middle" font-family="monospace" font-size="4" fill="#ffffff">x2.5</text>
  </g>
  
  <!-- Search pattern -->
  <g opacity="0.4">
    <path d="M16 32 Q20 28 24 32 Q28 36 32 32" stroke="#00aaff" stroke-width="1" fill="none" stroke-dasharray="2,2">
      <animate attributeName="stroke-dashoffset" values="0;4" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M32 32 Q36 28 40 32 Q44 36 48 32" stroke="#00aaff" stroke-width="1" fill="none" stroke-dasharray="2,2">
      <animate attributeName="stroke-dashoffset" values="0;4" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Active search indicator -->
  <circle cx="64" cy="8" r="3" fill="#00ff00" stroke="#ffffff" stroke-width="1">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Search area highlight -->
  <rect x="20" y="20" width="24" height="24" rx="2" fill="none" stroke="#ffff00" stroke-width="1" stroke-dasharray="6,6" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" values="0 32 32;360 32 32" dur="8s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Distance measurement -->
  <g transform="translate(8, 60)" opacity="0.6">
    <rect width="20" height="8" rx="2" fill="#000000" stroke="#00aaff" stroke-width="1"/>
    <text x="10" y="5" text-anchor="middle" font-family="monospace" font-size="4" fill="#00aaff">
      RANGE: 50m
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Analysis mode -->
  <g transform="translate(40, 60)" opacity="0.7">
    <rect width="24" height="8" rx="2" fill="#001100" stroke="#00ff00" stroke-width="1"/>
    <text x="12" y="5" text-anchor="middle" font-family="monospace" font-size="4" fill="#00ff00">ANALYZING...</text>
  </g>
  
  <!-- Search cone -->
  <path d="M32 32 L28 8 L36 8 Z" fill="#00d4ff" opacity="0.2">
    <animateTransform attributeName="transform" type="rotate" values="0 32 32;360 32 32" dur="6s" repeatCount="indefinite"/>
  </path>
</svg>