<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(16, 8)">
    <!-- Person bowing -->
    <circle cx="20" cy="8" r="6" fill="#4a9eff" stroke="#ffffff" stroke-width="2"/>
    <!-- Body bent forward -->
    <path d="M20 14 Q15 20, 10 26 L8 28 Q12 24, 18 18 L20 14" 
          fill="#2d4a5a" stroke="#ffffff" stroke-width="2"/>
    <!-- Arms hanging down -->
    <path d="M18 18 L12 28 L10 26 L16 16" fill="#4a9eff" stroke="#ffffff" stroke-width="1"/>
    <path d="M22 18 L28 28 L30 26 L24 16" fill="#4a9eff" stroke="#ffffff" stroke-width="1"/>
    <!-- Legs -->
    <rect x="18" y="38" width="3" height="12" fill="#2d4a5a"/>
    <rect x="21" y="38" width="3" height="12" fill="#2d4a5a"/>
    <!-- Respect lines -->
    <g stroke="#4a9eff" stroke-width="1" opacity="0.6">
      <path d="M30 12 L36 8"/>
      <path d="M30 16 L36 12"/>
      <path d="M30 20 L36 16"/>
    </g>
  </g>
</svg>
