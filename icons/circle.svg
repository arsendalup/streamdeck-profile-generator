<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="circleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#0099cc;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#006699;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  
  <!-- Main circle -->
  <circle cx="36" cy="36" r="24" fill="none" stroke="#00d4ff" stroke-width="3">
    <animate attributeName="stroke-dasharray" values="0,150;75,75;150,0;0,150" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner circle -->
  <circle cx="36" cy="36" r="16" fill="url(#circleGrad)" stroke="#ffffff" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="16;18;16" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Center dot -->
  <circle cx="36" cy="36" r="4" fill="#ffffff" stroke="#00d4ff" stroke-width="1">
    <animate attributeName="r" values="3;5;3" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Outer glow -->
  <circle cx="36" cy="36" r="28" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="28;32;28" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Rotating indicators -->
  <g>
    <circle cx="60" cy="36" r="2" fill="#ff6600">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="12" cy="36" r="2" fill="#ff6600">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="rotate" values="0 36 36;360 36 36" dur="8s" repeatCount="indefinite"/>
  </g>
</svg>