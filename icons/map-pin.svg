<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc2222;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff4444;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Pin shadow -->
  <ellipse cx="38" cy="58" rx="8" ry="3" fill="#000000" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Main pin body -->
  <path d="M36 18 Q28 18 28 26 Q28 36 36 48 Q44 36 44 26 Q44 18 36 18 Z" 
        fill="url(#pinGrad)" stroke="#ffffff" stroke-width="2">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Inner circle -->
  <circle cx="36" cy="26" r="6" fill="url(#glowGrad)" stroke="#ffffff" stroke-width="2">
    <animate attributeName="r" values="6;7;6" dur="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Center dot -->
  <circle cx="36" cy="26" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Glow effect -->
  <circle cx="36" cy="26" r="12" fill="none" stroke="#ff4444" stroke-width="2" opacity="0.4">
    <animate attributeName="r" values="10;15;10" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Pulse rings -->
  <g opacity="0.6">
    <circle cx="36" cy="26" r="16" fill="none" stroke="#ffff00" stroke-width="1">
      <animate attributeName="r" values="12;20;12" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="36" cy="26" r="20" fill="none" stroke="#ffff00" stroke-width="1">
      <animate attributeName="r" values="16;24;16" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Pin tip -->
  <circle cx="36" cy="48" r="2" fill="url(#pinGrad)" stroke="#ffffff" stroke-width="1">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Location accuracy circle -->
  <circle cx="36" cy="50" r="8" fill="none" stroke="#00d4ff" stroke-width="1" stroke-dasharray="4,2" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" values="0 36 50;360 36 50" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- GPS satellites -->
  <g opacity="0.5">
    <circle cx="20" cy="20" r="1" fill="#00ff00">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="52" cy="16" r="1" fill="#00ff00">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="40" r="1" fill="#00ff00">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Signal lines -->
    <line x1="20" y1="20" x2="32" y2="30" stroke="#00ff00" stroke-width="0.5" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="52" y1="16" x2="40" y2="30" stroke="#00ff00" stroke-width="0.5" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" begin="1s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="40" x2="42" y2="30" stroke="#00ff00" stroke-width="0.5" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" begin="2s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Coordinate display -->
  <rect x="8" y="60" width="56" height="8" rx="2" fill="#000000" stroke="#00d4ff" stroke-width="1" opacity="0.8"/>
  <text x="36" y="66" text-anchor="middle" font-family="monospace" font-size="6" fill="#00ff00">
    LAT: 42.3601° LON: -71.0589°
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </text>
</svg>