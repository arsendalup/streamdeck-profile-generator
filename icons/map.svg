<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(8, 8)">
    <\!-- Map background -->
    <rect x="2" y="2" width="52" height="40" fill="#2d4a5a" stroke="#ffffff" stroke-width="2" rx="4"/>
    <\!-- Map grid lines -->
    <g stroke="#4a9eff" stroke-width="1" opacity="0.7">
      <line x1="2" y1="14" x2="54" y2="14"/>
      <line x1="2" y1="26" x2="54" y2="26"/>
      <line x1="14" y1="2" x2="14" y2="42"/>
      <line x1="28" y1="2" x2="28" y2="42"/>
      <line x1="42" y1="2" x2="42" y2="42"/>
    </g>
    <\!-- Location markers -->
    <circle cx="20" cy="16" r="3" fill="#ff4444"/>
    <circle cx="35" cy="24" r="3" fill="#44ff44"/>
    <circle cx="45" cy="12" r="3" fill="#ffff44"/>
    <\!-- Player position -->
    <circle cx="28" cy="30" r="4" fill="#ffffff" stroke="#4a9eff" stroke-width="2"/>
    <circle cx="28" cy="30" r="2" fill="#4a9eff"/>
    <\!-- Compass -->
    <g transform="translate(45, 48)">
      <circle cx="0" cy="0" r="8" fill="#2d4a5a" stroke="#ffffff" stroke-width="2"/>
      <path d="M0,-6 L2,0 L0,6 L-2,0 Z" fill="#ff4444"/>
      <text x="0" y="-10" text-anchor="middle" fill="#ffffff" font-size="8" font-weight="bold">N</text>
    </g>
  </g>
</svg>
