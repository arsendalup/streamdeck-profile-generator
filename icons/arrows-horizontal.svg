<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Left arrow -->
  <g transform="translate(6, 36)">
    <path d="M20 0 L0 -8 L6 0 L0 8 Z" fill="url(#arrowGrad)" stroke="#ffffff" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0; -2,0; 0,0" dur="2s" repeatCount="indefinite"/>
    </path>
    <rect x="6" y="-2" width="14" height="4" fill="url(#arrowGrad)" stroke="#ffffff" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0; -2,0; 0,0" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Right arrow -->
  <g transform="translate(66, 36)">
    <path d="M-20 0 L0 -8 L-6 0 L0 8 Z" fill="url(#arrowGrad)" stroke="#ffffff" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0; 2,0; 0,0" dur="2s" repeatCount="indefinite"/>
    </path>
    <rect x="-20" y="-2" width="14" height="4" fill="url(#arrowGrad)" stroke="#ffffff" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0; 2,0; 0,0" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Center indicator -->
  <circle cx="36" cy="36" r="3" fill="#ff6600" stroke="#ffffff" stroke-width="1">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>