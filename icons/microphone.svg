<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#333333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111111;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="meshGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#666666;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Microphone capsule -->
  <ellipse cx="36" cy="26" rx="10" ry="14" fill="url(#micGrad)" stroke="#00d4ff" stroke-width="2">
    <animate attributeName="ry" values="14;15;14" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Mesh grille -->
  <ellipse cx="36" cy="26" rx="8" ry="12" fill="url(#meshGrad)" stroke="#666666" stroke-width="1"/>
  
  <!-- Mesh pattern -->
  <g opacity="0.8">
    <line x1="30" y1="18" x2="42" y2="18" stroke="#888888" stroke-width="0.5"/>
    <line x1="30" y1="22" x2="42" y2="22" stroke="#888888" stroke-width="0.5"/>
    <line x1="30" y1="26" x2="42" y2="26" stroke="#888888" stroke-width="0.5"/>
    <line x1="30" y1="30" x2="42" y2="30" stroke="#888888" stroke-width="0.5"/>
    <line x1="30" y1="34" x2="42" y2="34" stroke="#888888" stroke-width="0.5"/>
    
    <line x1="32" y1="14" x2="32" y2="38" stroke="#888888" stroke-width="0.5"/>
    <line x1="36" y1="14" x2="36" y2="38" stroke="#888888" stroke-width="0.5"/>
    <line x1="40" y1="14" x2="40" y2="38" stroke="#888888" stroke-width="0.5"/>
  </g>
  
  <!-- Microphone stand -->
  <rect x="34" y="40" width="4" height="16" rx="2" fill="url(#micGrad)" stroke="#00d4ff" stroke-width="1"/>
  
  <!-- Base -->
  <ellipse cx="36" cy="58" rx="8" ry="3" fill="url(#micGrad)" stroke="#00d4ff" stroke-width="2"/>
  <ellipse cx="36" cy="56" rx="6" ry="2" fill="#666666"/>
  
  <!-- Sound waves -->
  <g opacity="0.7">
    <path d="M50 20 Q54 22 54 26 Q54 30 50 32" stroke="#00ff00" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M52 16 Q58 20 58 26 Q58 32 52 36" stroke="#00ff00" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1s" begin="0.2s" repeatCount="indefinite"/>
    </path>
    <path d="M54 12 Q62 18 62 26 Q62 34 54 40" stroke="#00ff00" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1s" begin="0.4s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Audio level indicator -->
  <rect x="18" y="24" width="2" height="4" fill="#00ff00">
    <animate attributeName="height" values="4;8;4" dur="0.5s" repeatCount="indefinite"/>
    <animate attributeName="y" values="24;22;24" dur="0.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="22" y="22" width="2" height="8" fill="#ffff00">
    <animate attributeName="height" values="8;12;8" dur="0.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="22;20;22" dur="0.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="26" y="20" width="2" height="12" fill="#ff6600">
    <animate attributeName="height" values="12;16;12" dur="0.7s" repeatCount="indefinite"/>
    <animate attributeName="y" values="20;18;20" dur="0.7s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Power LED -->
  <circle cx="36" cy="44" r="2" fill="#00ff00" stroke="#ffffff" stroke-width="1">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Brand label -->
  <rect x="32" y="48" width="8" height="3" rx="1" fill="#333333" stroke="#00d4ff" stroke-width="0.5"/>
  <text x="36" y="50.5" text-anchor="middle" font-family="Arial" font-size="4" fill="#ffffff">MIC</text>
  
  <!-- Shock mount -->
  <g opacity="0.6">
    <ellipse cx="36" cy="26" rx="12" ry="16" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="24" cy="26" r="1" fill="#666666"/>
    <circle cx="48" cy="26" r="1" fill="#666666"/>
    <circle cx="36" cy="10" r="1" fill="#666666"/>
    <circle cx="36" cy="42" r="1" fill="#666666"/>
  </g>
  
  <!-- Frequency response -->
  <g transform="translate(8, 60)" opacity="0.5">
    <rect width="16" height="8" fill="#000000" stroke="#00d4ff" stroke-width="0.5"/>
    <path d="M1 7 Q4 3 8 5 Q12 2 15 6" stroke="#00ff00" stroke-width="1" fill="none">
      <animate attributeName="d" values="M1 7 Q4 3 8 5 Q12 2 15 6;M1 6 Q4 2 8 4 Q12 3 15 7;M1 7 Q4 3 8 5 Q12 2 15 6" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Status indicator -->
  <text x="36" y="66" text-anchor="middle" font-family="monospace" font-size="6" fill="#00ff00" opacity="0.8">
    LIVE
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1s" repeatCount="indefinite"/>
  </text>
</svg>