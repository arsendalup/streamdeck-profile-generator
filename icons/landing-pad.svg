<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#808080;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#404040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#606060;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="padGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:0.2" />
    </radialGradient>
    <filter id="padFilter">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#808080" stroke-width="2"/>
  
  <!-- Landing pad base -->
  <circle cx="72" cy="85" r="40" fill="url(#padGrad)" filter="url(#padFilter)"/>
  
  <!-- Pad markings -->
  <circle cx="72" cy="85" r="35" fill="none" stroke="#00ffff" stroke-width="2"/>
  <circle cx="72" cy="85" r="25" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
  <circle cx="72" cy="85" r="15" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.4"/>
  
  <!-- Landing gear extended -->
  <g>
    <!-- Main landing gear -->
    <rect x="50" y="75" width="6" height="15" fill="url(#padGrad)" rx="3"/>
    <rect x="88" y="75" width="6" height="15" fill="url(#padGrad)" rx="3"/>
    
    <!-- Gear wheels -->
    <circle cx="53" cy="92" r="4" fill="#202020"/>
    <circle cx="91" cy="92" r="4" fill="#202020"/>
    
    <!-- Nose gear -->
    <rect x="69" y="50" width="6" height="12" fill="url(#padGrad)" rx="3"/>
    <circle cx="72" cy="64" r="3" fill="#202020"/>
  </g>
  
  <!-- Landing pad lights -->
  <circle cx="45" cy="60" r="2" fill="#ff0000">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="99" cy="60" r="2" fill="#ff0000">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <circle cx="99" cy="110" r="2" fill="#00ff00">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  
  <circle cx="45" cy="110" r="2" fill="#00ff00">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  
  <!-- Central landing beacon -->
  <circle cx="72" cy="85" r="4" fill="#ffff00">
    <animate attributeName="fill" values="#ffff00;#ff8800;#ffff00" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Directional arrows -->
  <path d="M72 35 L77 45 L67 45 Z" fill="#00ffff" opacity="0.8"/>
  <path d="M72 20 L72 35" stroke="#00ffff" stroke-width="2" opacity="0.8"/>
  
  <!-- Support structures -->
  <rect x="40" y="100" width="8" height="12" fill="url(#padGrad)" rx="2"/>
  <rect x="96" y="100" width="8" height="12" fill="url(#padGrad)" rx="2"/>
  <rect x="68" y="105" width="8" height="7" fill="url(#padGrad)" rx="2"/>
  
  <!-- Guidance system -->
  <circle cx="72" cy="85" r="20" fill="url(#padGlow)" opacity="0.3">
    <animate attributeName="r" values="20;30;20" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Landing approach lines -->
  <path d="M30 85 L45 85" stroke="#88ffff" stroke-width="2" opacity="0.6" stroke-dasharray="5 5">
    <animate attributeName="stroke-dashoffset" values="0;-20;0" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <path d="M99 85 L114 85" stroke="#88ffff" stroke-width="2" opacity="0.6" stroke-dasharray="5 5">
    <animate attributeName="stroke-dashoffset" values="0;20;0" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Status display -->
  <rect x="25" y="25" width="20" height="6" fill="#003366" stroke="#00ffff" stroke-width="1" rx="2"/>
  <text x="35" y="30" font-family="monospace" font-size="6" fill="#00ff00" text-anchor="middle">READY</text>
</svg>