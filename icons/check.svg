<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff66;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc44;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="36" cy="36" r="30" fill="none" stroke="#00ff66" stroke-width="3" opacity="0.3">
    <animate attributeName="r" values="25;35;25" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Check mark -->
  <path d="M20 36 L30 46 L52 24" fill="none" stroke="url(#checkGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dasharray" values="0,60;60,0" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="60;0" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Glow effect -->
  <path d="M20 36 L30 46 L52 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <animate attributeName="opacity" values="0;0.8;0" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Success particles -->
  <g opacity="0.7">
    <circle cx="24" cy="30" r="1" fill="#00ff66">
      <animate attributeName="cy" values="30;26;30" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42" cy="28" r="1" fill="#00ff66">
      <animate attributeName="cy" values="28;24;28" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="34" cy="50" r="1" fill="#00ff66">
      <animate attributeName="cy" values="50;46;50" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>