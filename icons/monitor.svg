<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="monitorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#333333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111111;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000010;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Monitor bezel -->
  <rect x="8" y="12" width="56" height="36" rx="4" fill="url(#monitorGrad)" stroke="#00d4ff" stroke-width="2"/>
  
  <!-- Screen -->
  <rect x="12" y="16" width="48" height="28" rx="2" fill="url(#screenGrad)" stroke="#333333" stroke-width="1"/>
  
  <!-- Screen content - interface -->
  <g opacity="0.8">
    <!-- Window 1 -->
    <rect x="16" y="20" width="20" height="12" rx="1" fill="#001122" stroke="#00d4ff" stroke-width="1"/>
    <rect x="16" y="20" width="20" height="3" fill="#00d4ff"/>
    <circle cx="18" cy="22" r="0.5" fill="#ff3333"/>
    <circle cx="20" cy="22" r="0.5" fill="#ffff00"/>
    <circle cx="22" cy="22" r="0.5" fill="#00ff00"/>
    
    <!-- Window content -->
    <line x1="18" y1="26" x2="34" y2="26" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="18" y1="28" x2="30" y2="28" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="18" y1="30" x2="32" y2="30" stroke="#00d4ff" stroke-width="0.5"/>
    
    <!-- Window 2 -->
    <rect x="40" y="20" width="16" height="10" rx="1" fill="#001122" stroke="#00d4ff" stroke-width="1"/>
    <rect x="40" y="20" width="16" height="2" fill="#00d4ff"/>
    
    <!-- Graph in window 2 -->
    <path d="M42 28 Q46 24 50 26 Q54 22 56 25" stroke="#00ff00" stroke-width="1" fill="none">
      <animate attributeName="d" values="M42 28 Q46 24 50 26 Q54 22 56 25;M42 28 Q46 22 50 24 Q54 26 56 23;M42 28 Q46 24 50 26 Q54 22 56 25" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Terminal window -->
    <rect x="16" y="34" width="40" height="8" rx="1" fill="#000000" stroke="#00ff00" stroke-width="1"/>
    <text x="18" y="38" font-family="monospace" font-size="4" fill="#00ff00">$</text>
    <rect x="20" y="36" width="4" height="1" fill="#00ff00">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Stand -->
  <rect x="32" y="48" width="8" height="8" rx="2" fill="url(#monitorGrad)" stroke="#00d4ff" stroke-width="1"/>
  
  <!-- Base -->
  <ellipse cx="36" cy="60" rx="16" ry="4" fill="url(#monitorGrad)" stroke="#00d4ff" stroke-width="2"/>
  <ellipse cx="36" cy="58" rx="12" ry="2" fill="#333333"/>
  
  <!-- Power LED -->
  <circle cx="60" cy="48" r="2" fill="#00ff00" stroke="#ffffff" stroke-width="1">
    <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Control buttons -->
  <g transform="translate(58, 52)">
    <circle cx="0" cy="0" r="1" fill="#333333" stroke="#666666" stroke-width="0.5"/>
    <circle cx="0" cy="3" r="1" fill="#333333" stroke="#666666" stroke-width="0.5"/>
    <circle cx="0" cy="6" r="1" fill="#333333" stroke="#666666" stroke-width="0.5"/>
  </g>
  
  <!-- Screen glow -->
  <rect x="12" y="16" width="48" height="28" rx="2" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Reflection on screen -->
  <rect x="14" y="18" width="8" height="16" rx="1" fill="#ffffff" opacity="0.1"/>
  
  <!-- Brand logo -->
  <text x="36" y="46" text-anchor="middle" font-family="Arial" font-size="4" fill="#666666">DISPLAY</text>
  
  <!-- Status indicators -->
  <g transform="translate(8, 54)" opacity="0.7">
    <rect width="16" height="6" rx="1" fill="#000000" stroke="#00d4ff" stroke-width="0.5"/>
    <text x="8" y="4" text-anchor="middle" font-family="monospace" font-size="3" fill="#00d4ff">1920x1080</text>
  </g>
  
  <!-- Cable -->
  <path d="M36 56 Q32 62 28 64" stroke="#333333" stroke-width="2" fill="none"/>
  <circle cx="28" cy="64" r="1" fill="#333333"/>
  
  <!-- WiFi indicator -->
  <g transform="translate(52, 14)" opacity="0.6">
    <path d="M0 4 Q2 2 4 4" stroke="#00d4ff" stroke-width="0.5" fill="none"/>
    <path d="M-1 5 Q2 1 5 5" stroke="#00d4ff" stroke-width="0.5" fill="none"/>
    <circle cx="2" cy="5" r="0.5" fill="#00d4ff"/>
  </g>
  
  <!-- Activity indicator -->
  <rect x="66" y="32" width="2" height="2" fill="#00ff00">
    <animate attributeName="height" values="2;6;2" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="y" values="32;30;32" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Scan lines effect -->
  <g opacity="0.1">
    <rect x="12" y="16" width="48" height="1" fill="#ffffff">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,28; 0,0" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>