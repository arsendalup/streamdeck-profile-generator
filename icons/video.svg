<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(12, 16)">
    <\!-- Video camera body -->
    <rect x="8" y="12" width="24" height="16" fill="#2d4a5a" stroke="#ffffff" stroke-width="2" rx="4"/>
    
    <\!-- Lens -->
    <circle cx="20" cy="20" r="6" fill="#1a2836" stroke="#ffffff" stroke-width="2"/>
    <circle cx="20" cy="20" r="4" fill="#4a9eff" stroke="#ffffff" stroke-width="1"/>
    <circle cx="20" cy="20" r="2" fill="#ffffff"/>
    
    <\!-- Viewfinder -->
    <rect x="32" y="16" width="8" height="6" fill="#1a2836" stroke="#ffffff" stroke-width="1" rx="1"/>
    <rect x="34" y="18" width="4" height="2" fill="#4a9eff"/>
    
    <\!-- Recording indicator -->
    <circle cx="36" cy="8" r="3" fill="#ff4444"/>
    <circle cx="36" cy="8" r="1" fill="#ffffff"/>
    
    <\!-- Missile trail effect -->
    <g stroke="#4a9eff" stroke-width="2" opacity="0.7">
      <path d="M44 20 L48 16 Q52 18, 48 22 L44 20"/>
      <path d="M46 24 L50 20 Q54 22, 50 26 L46 24"/>
    </g>
    
    <\!-- Cinema frame -->
    <rect x="4" y="4" width="40" height="32" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,2" opacity="0.5"/>
  </g>
</svg>
