<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pistolMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#808080;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#505050;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#707070;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pistolFlash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff8800;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff4400;stop-opacity:0.3" />
    </linearGradient>
    <filter id="pistolGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#808080" stroke-width="2"/>
  
  <!-- Pistol slide -->
  <rect x="45" y="60" width="55" height="12" fill="url(#pistolMetal)" rx="6" filter="url(#pistolGlow)"/>
  
  <!-- Barrel -->
  <rect x="100" y="63" width="15" height="6" fill="url(#pistolMetal)" rx="3"/>
  
  <!-- Frame -->
  <rect x="45" y="72" width="40" height="20" fill="url(#pistolMetal)" rx="4"/>
  
  <!-- Grip -->
  <rect x="45" y="92" width="20" height="25" fill="url(#pistolMetal)" rx="10"/>
  
  <!-- Trigger -->
  <path d="M65 85 Q70 88 65 91" stroke="url(#pistolMetal)" stroke-width="3" fill="none"/>
  
  <!-- Trigger guard -->
  <path d="M60 85 Q72 95 75 85" stroke="url(#pistolMetal)" stroke-width="2" fill="none"/>
  
  <!-- Front sight -->
  <rect x="98" y="58" width="2" height="4" fill="#00ffff" rx="1"/>
  
  <!-- Rear sight -->
  <rect x="48" y="58" width="4" height="2" fill="#00ffff" rx="1"/>
  
  <!-- Muzzle flash -->
  <path d="M115 66 L125 63 L128 66 L125 69 L115 66" fill="url(#pistolFlash)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.15s" repeatCount="indefinite" begin="0s"/>
  </path>
  
  <!-- Shell ejection -->
  <ellipse cx="50" cy="58" rx="2" ry="1" fill="#ffaa00" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.4s" repeatCount="indefinite" begin="0.1s"/>
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0 0;-8 -12;0 0" 
      dur="0.4s" 
      repeatCount="indefinite" 
      begin="0.1s"/>
  </ellipse>
  
  <!-- Magazine -->
  <rect x="50" y="92" width="8" height="12" fill="url(#pistolMetal)" rx="2"/>
  
  <!-- Magazine release -->
  <circle cx="75" cy="78" r="2" fill="#606060"/>
  
  <!-- Safety indicator -->
  <circle cx="55" cy="78" r="2" fill="#ff0000">
    <animate attributeName="fill" values="#ff0000;#00ff00;#ff0000" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Laser dot -->
  <circle cx="120" cy="66" r="1" fill="#ff0000">
    <animate attributeName="opacity" values="1;0.3;1" dur="0.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Slide action -->
  <g>
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0 0;-3 0;0 0" 
      dur="0.15s" 
      repeatCount="indefinite" 
      begin="0s"/>
  </g>
  
  <!-- Tactical light -->
  <rect x="65" y="92" width="6" height="4" fill="#003366" stroke="#00ffff" stroke-width="0.5" rx="2"/>
  <circle cx="68" cy="94" r="1" fill="#ffffff">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Grip texture -->
  <rect x="47" y="95" width="1" height="15" fill="#404040" opacity="0.5"/>
  <rect x="50" y="95" width="1" height="15" fill="#404040" opacity="0.5"/>
  <rect x="53" y="95" width="1" height="15" fill="#404040" opacity="0.5"/>
  <rect x="56" y="95" width="1" height="15" fill="#404040" opacity="0.5"/>
  <rect x="59" y="95" width="1" height="15" fill="#404040" opacity="0.5"/>
  <rect x="62" y="95" width="1" height="15" fill="#404040" opacity="0.5"/>
  
  <!-- Ammo indicator -->
  <text x="35" y="100" font-family="monospace" font-size="8" fill="#00ff00">15</text>
</svg>