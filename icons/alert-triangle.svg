<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(16, 12)">
    <!-- Warning triangle -->
    <path d="M20 8 L4 44 L36 44 Z" fill="#ff4444" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Inner warning area -->
    <path d="M20 16 L8 40 L32 40 Z" fill="#ff6666" opacity="0.8"/>
    
    <!-- Exclamation mark -->
    <rect x="18" y="20" width="4" height="12" fill="#ffffff" rx="2"/>
    <circle cx="20" cy="36" r="2" fill="#ffffff"/>
    
    <!-- Hostile indicator elements -->
    <circle cx="20" cy="4" r="2" fill="#ff4444"/>
    <circle cx="8" cy="46" r="2" fill="#ff4444"/>
    <circle cx="32" cy="46" r="2" fill="#ff4444"/>
    
    <!-- Targeting threat lines -->
    <g opacity="0.7">
      <line x1="2" y1="20" x2="6" y2="24" stroke="#ff4444" stroke-width="2"/>
      <line x1="38" y1="20" x2="34" y2="24" stroke="#ff4444" stroke-width="2"/>
      <line x1="20" y1="2" x2="20" y2="6" stroke="#ff4444" stroke-width="2"/>
    </g>
    
    <!-- Danger pulse effect -->
    <circle cx="20" cy="28" r="12" fill="none" stroke="#ff4444" stroke-width="1" opacity="0.4" stroke-dasharray="2,2"/>
    <circle cx="20" cy="28" r="16" fill="none" stroke="#ff4444" stroke-width="1" opacity="0.2" stroke-dasharray="3,3"/>
    
    <!-- Hostile text -->
    <text x="20" y="56" text-anchor="middle" fill="#ff4444" font-size="8">HOSTILE</text>
  </g>
</svg>