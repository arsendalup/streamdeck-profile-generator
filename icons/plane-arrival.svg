<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(8, 12)">
    <!-- Landing pad -->
    <rect x="0" y="32" width="56" height="8" fill="#2d4a5a" stroke="#ffffff" stroke-width="2" rx="2"/>
    
    <!-- Landing pad lights -->
    <circle cx="8" cy="36" r="2" fill="#44ff44"/>
    <circle cx="20" cy="36" r="2" fill="#44ff44"/>
    <circle cx="36" cy="36" r="2" fill="#44ff44"/>
    <circle cx="48" cy="36" r="2" fill="#44ff44"/>
    
    <!-- Ship approaching -->
    <g transform="translate(20, 4)">
      <!-- Ship body -->
      <rect x="6" y="8" width="12" height="6" fill="#4a9eff" rx="2"/>
      <!-- Wings -->
      <rect x="0" y="10" width="8" height="2" fill="#4a9eff"/>
      <rect x="16" y="10" width="8" height="2" fill="#4a9eff"/>
      <!-- Cockpit -->
      <circle cx="12" cy="8" r="2" fill="#ffffff"/>
    </g>
    
    <!-- Descent path -->
    <path d="M28 16 Q32 20, 28 24 Q32 28, 28 32" stroke="#44ff44" stroke-width="2" fill="none" stroke-dasharray="2,2"/>
    
    <!-- Landing guidance -->
    <path d="M14 28 L28 20 L42 28" stroke="#4a9eff" stroke-width="2" fill="none"/>
    
    <!-- Landing zone marker -->
    <circle cx="28" cy="36" r="6" fill="none" stroke="#ff4444" stroke-width="2" stroke-dasharray="3,3"/>
    
    <!-- Altitude indicator -->
    <text x="50" y="20" fill="#4a9eff" font-size="8">ALT</text>
    <text x="50" y="28" fill="#44ff44" font-size="6">100m</text>
    
    <!-- Landing system status -->
    <text x="28" y="52" text-anchor="middle" fill="#44ff44" font-size="8">LANDING</text>
  </g>
</svg>