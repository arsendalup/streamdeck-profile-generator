<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff1744;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c51162;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="40%" style="stop-color:#ff6b9d;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#c51162;stop-opacity:0.2" />
    </radialGradient>
    <filter id="heartFilter">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#ff1744" stroke-width="2"/>
  
  <!-- Heart shape -->
  <path d="M72 105 Q50 85 45 65 Q45 45 60 45 Q72 55 72 55 Q72 55 84 45 Q99 45 99 65 Q94 85 72 105 Z" 
        fill="url(#heartGrad)" 
        filter="url(#heartFilter)">
    <animate attributeName="fill-opacity" values="1;0.7;1" dur="1.5s" repeatCount="indefinite"/>
    <animateTransform 
      attributeName="transform" 
      type="scale" 
      values="1;1.1;1" 
      dur="1.5s" 
      repeatCount="indefinite"/>
  </path>
  
  <!-- Heart highlight -->
  <ellipse cx="60" cy="55" rx="8" ry="6" fill="url(#heartGlow)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Heartbeat line -->
  <path d="M25 120 L35 120 L40 110 L45 130 L50 100 L55 120 L119 120" 
        stroke="#00ff00" 
        stroke-width="2" 
        fill="none">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Friendly indicator -->
  <rect x="25" y="25" width="25" height="6" fill="#003300" stroke="#00ff00" stroke-width="1" rx="2"/>
  <text x="37" y="30" font-family="Arial" font-size="6" fill="#00ff00" text-anchor="middle">FRIEND</text>
  
  <!-- Alliance symbol -->
  <circle cx="115" cy="35" r="8" fill="#00ff00" stroke="#ffffff" stroke-width="2">
    <animate attributeName="fill" values="#00ff00;#88ff00;#00ff00" dur="2s" repeatCount="indefinite"/>
  </circle>
  <path d="M112 35 L115 32 L118 35 L115 38 Z" fill="#ffffff"/>
  
  <!-- Love aura -->
  <circle cx="72" cy="72" r="35" fill="none" stroke="#ff6b9d" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="35;45;35" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Floating hearts -->
  <path d="M40 40 Q38 38 40 36 Q42 38 40 40 Q40 42 40 40" fill="#ff6b9d" opacity="0.8">
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0 0;5 -15;0 0" 
      dur="3s" 
      repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <path d="M104 40 Q102 38 104 36 Q106 38 104 40 Q104 42 104 40" fill="#ff6b9d" opacity="0.6">
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0 0;-8 -20;0 0" 
      dur="4s" 
      repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- Health indicator -->
  <rect x="100" y="115" width="20" height="6" fill="#003300" stroke="#00ff00" stroke-width="1" rx="2"/>
  <rect x="102" y="117" width="16" height="2" fill="#00ff00" rx="1"/>
  
  <!-- Protection field -->
  <circle cx="72" cy="72" r="25" fill="none" stroke="#88ff88" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="25;30;25" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>