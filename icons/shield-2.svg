<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="advancedShieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#00ffff;stop-opacity:0.9" />
      <stop offset="70%" style="stop-color:#0080ff;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:0.2" />
    </radialGradient>
    <linearGradient id="hexPattern" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#88ffff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#004488;stop-opacity:0.4" />
    </linearGradient>
    <filter id="advShieldGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#0a1a2e" stroke="#00ffff" stroke-width="2"/>
  
  <!-- Advanced shield dome -->
  <circle cx="72" cy="72" r="45" fill="url(#advancedShieldGlow)" filter="url(#advShieldGlow)">
    <animate attributeName="fill-opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Hexagonal shield pattern -->
  <path d="M72 35 L85 42 L85 58 L72 65 L59 58 L59 42 Z" 
        fill="none" 
        stroke="url(#hexPattern)" 
        stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <path d="M72 50 L80 55 L80 67 L72 72 L64 67 L64 55 Z" 
        fill="none" 
        stroke="url(#hexPattern)" 
        stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <path d="M72 65 L85 72 L85 88 L72 95 L59 88 L59 72 Z" 
        fill="none" 
        stroke="url(#hexPattern)" 
        stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite" begin="1s"/>
  </path>
  
  <!-- Shield generator core -->
  <circle cx="72" cy="72" r="12" fill="#003366" stroke="#00ffff" stroke-width="2">
    <animate attributeName="stroke-width" values="2;4;2" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="72" cy="72" r="6" fill="#00ffff">
    <animate attributeName="r" values="6;10;6" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Energy nodes -->
  <circle cx="55" cy="55" r="3" fill="#00ffff">
    <animate attributeName="fill" values="#00ffff;#ffffff;#00ffff" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="89" cy="55" r="3" fill="#00ffff">
    <animate attributeName="fill" values="#00ffff;#ffffff;#00ffff" dur="1s" repeatCount="indefinite" begin="0.25s"/>
  </circle>
  
  <circle cx="89" cy="89" r="3" fill="#00ffff">
    <animate attributeName="fill" values="#00ffff;#ffffff;#00ffff" dur="1s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  
  <circle cx="55" cy="89" r="3" fill="#00ffff">
    <animate attributeName="fill" values="#00ffff;#ffffff;#00ffff" dur="1s" repeatCount="indefinite" begin="0.75s"/>
  </circle>
  
  <!-- Shield integrity bars -->
  <rect x="25" y="25" width="20" height="3" fill="#00ff00" rx="1"/>
  <rect x="25" y="30" width="18" height="3" fill="#88ff00" rx="1"/>
  <rect x="25" y="35" width="16" height="3" fill="#ffff00" rx="1"/>
  <rect x="25" y="40" width="12" height="3" fill="#ff8800" rx="1"/>
  
  <!-- Energy overflow -->
  <circle cx="72" cy="72" r="35" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="35;50;35" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.4;0;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Shield breach effects -->
  <path d="M45 45 Q50 40 55 45" stroke="#ff4444" stroke-width="2" fill="none" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.3s" repeatCount="indefinite" begin="3s"/>
  </path>
  
  <path d="M89 99 Q94 94 99 99" stroke="#ff4444" stroke-width="2" fill="none" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.3s" repeatCount="indefinite" begin="3.2s"/>
  </path>
</svg>