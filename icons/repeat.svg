<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(12, 16)">
    <!-- Circular arrow path -->
    <path d="M24 8 C32 8, 40 16, 40 24 C40 32, 32 40, 24 40 C16 40, 8 32, 8 24 C8 20, 10 16, 13 13" 
          stroke="#4a9eff" stroke-width="3" fill="none"/>
    
    <!-- First arrow head (top) -->
    <path d="M24 4 L20 8 L24 8 L28 8 Z" fill="#4a9eff"/>
    
    <!-- Second arrow head (continuing the cycle) -->
    <path d="M13 13 L17 9 L13 9 L9 9 Z" fill="#4a9eff"/>
    
    <!-- Center target cycling indicator -->
    <circle cx="24" cy="24" r="6" fill="none" stroke="#44ff44" stroke-width="2"/>
    <circle cx="24" cy="24" r="2" fill="#44ff44"/>
    
    <!-- Targeting cycle dots -->
    <circle cx="24" cy="12" r="2" fill="#ff4444"/>
    <circle cx="36" cy="24" r="2" fill="#ff4444" opacity="0.7"/>
    <circle cx="24" cy="36" r="2" fill="#ff4444" opacity="0.4"/>
    <circle cx="12" cy="24" r="2" fill="#ff4444" opacity="0.2"/>
    
    <!-- Motion indicators -->
    <g opacity="0.6">
      <path d="M20 16 Q18 14, 16 16" stroke="#44ff44" stroke-width="2" fill="none"/>
      <path d="M28 32 Q30 34, 32 32" stroke="#44ff44" stroke-width="2" fill="none"/>
    </g>
    
    <!-- Cycle text -->
    <text x="24" y="52" text-anchor="middle" fill="#4a9eff" font-size="8">CYCLE</text>
  </g>
</svg>