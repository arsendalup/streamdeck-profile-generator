<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fistGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#880000;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="impactGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ff6600;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff0000;stop-opacity:0.3" />
    </radialGradient>
    <filter id="fistGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="15" y="15" width="114" height="114" rx="15" fill="#1a1a2e" stroke="#ff4444" stroke-width="2"/>
  
  <!-- Fist main body -->
  <ellipse cx="72" cy="75" rx="28" ry="25" fill="url(#fistGrad)" filter="url(#fistGlow)"/>
  
  <!-- Knuckles -->
  <circle cx="60" cy="60" r="6" fill="url(#fistGrad)"/>
  <circle cx="72" cy="58" r="6" fill="url(#fistGrad)"/>
  <circle cx="84" cy="60" r="6" fill="url(#fistGrad)"/>
  <circle cx="94" cy="65" r="5" fill="url(#fistGrad)"/>
  
  <!-- Thumb -->
  <ellipse cx="50" cy="80" rx="8" ry="12" fill="url(#fistGrad)" transform="rotate(-30 50 80)"/>
  
  <!-- Wrist -->
  <rect x="55" y="95" width="34" height="20" fill="url(#fistGrad)" rx="17"/>
  
  <!-- Impact effect -->
  <circle cx="105" cy="55" r="8" fill="url(#impactGlow)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.3s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="r" values="8;15;8" dur="0.3s" repeatCount="indefinite" begin="0s"/>
  </circle>
  
  <!-- Punch trail -->
  <path d="M95 65 L115 45" stroke="#ffff00" stroke-width="4" opacity="0" stroke-linecap="round">
    <animate attributeName="opacity" values="0;1;0" dur="0.2s" repeatCount="indefinite" begin="0s"/>
  </path>
  
  <!-- Speed lines -->
  <path d="M90 70 L110 50" stroke="#ffffff" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="0.15s" repeatCount="indefinite" begin="0s"/>
  </path>
  
  <path d="M85 75 L105 55" stroke="#ffffff" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="0.15s" repeatCount="indefinite" begin="0.05s"/>
  </path>
  
  <path d="M95 80 L115 60" stroke="#ffffff" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="0.15s" repeatCount="indefinite" begin="0.1s"/>
  </path>
  
  <!-- Knuckle details -->
  <rect x="58" y="58" width="4" height="2" fill="#990000" opacity="0.8"/>
  <rect x="70" y="56" width="4" height="2" fill="#990000" opacity="0.8"/>
  <rect x="82" y="58" width="4" height="2" fill="#990000" opacity="0.8"/>
  <rect x="92" y="63" width="4" height="2" fill="#990000" opacity="0.8"/>
  
  <!-- Power indicator -->
  <circle cx="72" cy="115" r="4" fill="#ff0000">
    <animate attributeName="fill" values="#ff0000;#ffff00;#ff0000" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;6;4" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Combat enhancement -->
  <rect x="65" y="90" width="3" height="8" fill="#00ffff" opacity="0.8" rx="1"/>
  <rect x="76" y="90" width="3" height="8" fill="#00ffff" opacity="0.8" rx="1"/>
  
  <!-- Tension lines -->
  <path d="M55 65 Q72 55 89 65" stroke="#ff8888" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M58 75 Q72 70 86 75" stroke="#ff8888" stroke-width="1" fill="none" opacity="0.6"/>
  
  <!-- Force field -->
  <circle cx="72" cy="70" r="35" fill="none" stroke="#ff4444" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="35;45;35" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Damage sparks -->
  <circle cx="100" cy="50" r="1" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="0.1s" repeatCount="indefinite" begin="0s"/>
  </circle>
  
  <circle cx="110" cy="45" r="1" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="0.1s" repeatCount="indefinite" begin="0.05s"/>
  </circle>
  
  <circle cx="105" cy="40" r="1" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="0.1s" repeatCount="indefinite" begin="0.1s"/>
  </circle>
</svg>