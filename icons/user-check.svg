<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff66;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc44;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- User head -->
  <circle cx="28" cy="24" r="10" fill="url(#userGrad)" stroke="#ffffff" stroke-width="2">
    <animate attributeName="transform" values="scale(1); scale(1.02); scale(1)" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- User body -->
  <path d="M12 52 Q12 40 28 40 Q44 40 44 52 L44 60 L12 60 Z" 
        fill="url(#userGrad)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Verification checkmark circle -->
  <circle cx="48" cy="24" r="12" fill="#ffffff" stroke="url(#checkGrad)" stroke-width="3">
    <animate attributeName="r" values="11;13;11" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Checkmark -->
  <path d="M42 24 L46 28 L54 20" fill="none" stroke="url(#checkGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dasharray" values="0,24;24,0" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Checkmark glow -->
  <path d="M42 24 L46 28 L54 20" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <animate attributeName="opacity" values="0;0.8;0" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- User features -->
  <g opacity="0.8">
    <!-- Eyes -->
    <circle cx="24" cy="22" r="1.5" fill="#ffffff"/>
    <circle cx="32" cy="22" r="1.5" fill="#ffffff"/>
    
    <!-- Smile -->
    <path d="M22 28 Q28 32 34 28" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Verification badge -->
  <g transform="translate(20, 8)" opacity="0.9">
    <polygon points="4,0 8,3 4,6 0,3" fill="url(#checkGrad)" stroke="#ffffff" stroke-width="1">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <text x="4" y="4" text-anchor="middle" font-family="Arial" font-size="3" font-weight="bold" fill="#ffffff">✓</text>
  </g>
  
  <!-- ID badge -->
  <rect x="16" y="45" width="24" height="12" rx="2" fill="#ffffff" stroke="#00d4ff" stroke-width="1"/>
  <rect x="18" y="47" width="6" height="8" rx="1" fill="#cccccc"/>
  <rect x="26" y="47" width="12" height="2" rx="1" fill="#333333"/>
  <rect x="26" y="50" width="8" height="1" rx="0.5" fill="#666666"/>
  <rect x="26" y="52" width="10" height="1" rx="0.5" fill="#666666"/>
  
  <!-- Status indicators -->
  <g transform="translate(8, 36)" opacity="0.8">
    <circle cx="0" cy="0" r="3" fill="#00ff00" stroke="#ffffff" stroke-width="1">
      <animate attributeName="fill" values="#00ff00;#ffff00;#00ff00" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="1" text-anchor="middle" font-family="Arial" font-size="2" font-weight="bold" fill="#000000">OK</text>
  </g>
  
  <!-- Security level -->
  <g transform="translate(52, 48)" opacity="0.7">
    <rect width="16" height="8" rx="2" fill="#001100" stroke="#00ff00" stroke-width="1"/>
    <text x="8" y="5" text-anchor="middle" font-family="monospace" font-size="4" fill="#00ff00">
      VERIFIED
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Access level bars -->
  <g transform="translate(48, 36)" opacity="0.7">
    <rect x="0" y="0" width="2" height="8" fill="#00ff00"/>
    <rect x="3" y="2" width="2" height="6" fill="#00ff00"/>
    <rect x="6" y="4" width="2" height="4" fill="#ffff00"/>
    <rect x="9" y="6" width="2" height="2" fill="#ff6600"/>
    <text x="6" y="12" text-anchor="middle" font-family="Arial" font-size="3" fill="#00ff00">ACCESS</text>
  </g>
  
  <!-- User data stream -->
  <g opacity="0.5">
    <rect x="12" y="56" width="32" height="1" fill="#00d4ff">
      <animate attributeName="width" values="8;32;8" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="12" y="58" width="32" height="1" fill="#00d4ff">
      <animate attributeName="width" values="16;32;16" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Biometric scan -->
  <g opacity="0.6">
    <rect x="18" y="14" width="20" height="1" fill="#00ff00">
      <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="18" y="16" width="20" height="1" fill="#00ff00">
      <animate attributeName="opacity" values="0;0.8;0" dur="2s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="18" y="18" width="20" height="1" fill="#00ff00">
      <animate attributeName="opacity" values="0;0.8;0" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Trust score -->
  <g transform="translate(8, 8)" opacity="0.8">
    <rect width="16" height="8" rx="2" fill="#000011" stroke="#00d4ff" stroke-width="1"/>
    <text x="8" y="5" text-anchor="middle" font-family="monospace" font-size="4" fill="#00d4ff">
      TRUST: 98%
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Authentication success -->
  <g transform="translate(32, 64)" opacity="0.8">
    <rect width="24" height="6" rx="2" fill="#00ff00" stroke="#ffffff" stroke-width="1"/>
    <text x="12" y="4" text-anchor="middle" font-family="Arial" font-size="4" font-weight="bold" fill="#000000">AUTHENTICATED</text>
  </g>
  
  <!-- Digital signature -->
  <g transform="translate(56, 8)" opacity="0.6">
    <rect width="12" height="8" rx="2" fill="#001122" stroke="#00aaff" stroke-width="1"/>
    <text x="6" y="4" text-anchor="middle" font-family="monospace" font-size="3" fill="#00aaff">SIGNED</text>
    <path d="M2 6 Q6 4 10 6" stroke="#00aaff" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Clearance level -->
  <g transform="translate(8, 60)" opacity="0.7">
    <rect width="32" height="6" rx="2" fill="#ffffff" stroke="#00d4ff" stroke-width="1"/>
    <text x="16" y="4" text-anchor="middle" font-family="Arial" font-size="4" fill="#000000">CLEARANCE: ALPHA</text>
  </g>
  
  <!-- Security particles -->
  <g opacity="0.6">
    <circle cx="36" cy="18" r="1" fill="#00ff66">
      <animate attributeName="cy" values="18;14;18" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42" cy="32" r="1" fill="#00ff66">
      <animate attributeName="cy" values="32;28;32" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="24" cy="36" r="1" fill="#00ff66">
      <animate attributeName="cy" values="36;32;36" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Encryption indicator -->
  <g transform="translate(48, 60)" opacity="0.6">
    <rect width="16" height="6" rx="1" fill="#000000" stroke="#ffff00" stroke-width="1"/>
    <text x="8" y="4" text-anchor="middle" font-family="monospace" font-size="3" fill="#ffff00">256-BIT ENC</text>
  </g>
  
  <!-- Connection status -->
  <line x1="38" y1="24" x2="42" y2="24" stroke="#00ff00" stroke-width="2" stroke-dasharray="2,2">
    <animate attributeName="stroke-dashoffset" values="0;4" dur="1s" repeatCount="indefinite"/>
  </line>
  
  <!-- User activity pulse -->
  <circle cx="28" cy="36" r="16" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="12;20;12" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>