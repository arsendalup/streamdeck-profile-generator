<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="72" height="72" fill="transparent"/>
  <g transform="translate(16, 8)">
    <!-- Flask neck -->
    <rect x="16" y="4" width="8" height="12" fill="#2d4a5a" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Flask mouth -->
    <rect x="14" y="2" width="12" height="4" fill="#4a9eff" stroke="#ffffff" stroke-width="2" rx="2"/>
    
    <!-- Flask body -->
    <path d="M16 16 L8 32 L8 44 C8 48, 12 52, 16 52 L24 52 C28 52, 32 48, 32 44 L32 32 L24 16" 
          fill="#2d4a5a" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Refined material/liquid -->
    <path d="M10 34 L10 42 C10 44, 12 46, 14 46 L26 46 C28 46, 30 44, 30 42 L30 34 L22 20 L18 20" 
          fill="#44ff44" opacity="0.7"/>
    
    <!-- Bubbles/reaction -->
    <circle cx="16" cy="38" r="2" fill="#44ff44"/>
    <circle cx="24" cy="36" r="1" fill="#44ff44" opacity="0.8"/>
    <circle cx="20" cy="42" r="1" fill="#44ff44" opacity="0.6"/>
    <circle cx="18" cy="32" r="1" fill="#44ff44" opacity="0.4"/>
    
    <!-- Steam/vapor -->
    <g opacity="0.6">
      <path d="M18 6 Q16 2, 18 0" stroke="#4a9eff" stroke-width="2" fill="none"/>
      <path d="M20 6 Q22 2, 20 0" stroke="#4a9eff" stroke-width="2" fill="none"/>
      <path d="M22 6 Q24 2, 22 0" stroke="#4a9eff" stroke-width="2" fill="none"/>
    </g>
    
    <!-- Refinery label -->
    <text x="20" y="58" text-anchor="middle" fill="#44ff44" font-size="8">REFINERY</text>
    
    <!-- Temperature indicator -->
    <rect x="34" y="24" width="2" height="16" fill="#ff4444"/>
    <circle cx="35" cy="42" r="3" fill="#ff4444"/>
  </g>
</svg>