<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chevronLeftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main chevron -->
  <path d="M45 18 L27 36 L45 54" fill="none" stroke="url(#chevronLeftGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0,0; -3,0; 0,0" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Secondary chevron for depth -->
  <path d="M38 25 L27 36 L38 47" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0; -3,0; 0,0" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Glow effect -->
  <path d="M45 18 L27 36 L45 54" fill="none" stroke="#00d4ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Motion trail -->
  <g opacity="0.4">
    <path d="M52 25 L44 33 L52 41" fill="none" stroke="#00d4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="0;0.4;0" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>