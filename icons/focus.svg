<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="focusGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#00d4ff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  
  <!-- Outer focus ring -->
  <circle cx="36" cy="36" r="28" fill="none" stroke="#00d4ff" stroke-width="2" stroke-dasharray="8,4">
    <animateTransform attributeName="transform" type="rotate" values="0 36 36;360 36 36" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Middle focus ring -->
  <circle cx="36" cy="36" r="20" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,3">
    <animateTransform attributeName="transform" type="rotate" values="360 36 36;0 36 36" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner focus ring -->
  <circle cx="36" cy="36" r="12" fill="url(#focusGrad)" stroke="#00d4ff" stroke-width="3">
    <animate attributeName="r" values="12;14;12" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Center target -->
  <circle cx="36" cy="36" r="4" fill="#ffffff" stroke="#00d4ff" stroke-width="2">
    <animate attributeName="r" values="3;5;3" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Focus indicators -->
  <g>
    <!-- Top -->
    <rect x="34" y="8" width="4" height="8" rx="2" fill="#00d4ff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <!-- Bottom -->
    <rect x="34" y="56" width="4" height="8" rx="2" fill="#00d4ff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" begin="0.75s" repeatCount="indefinite"/>
    </rect>
    <!-- Left -->
    <rect x="8" y="34" width="8" height="4" rx="2" fill="#00d4ff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" begin="0.375s" repeatCount="indefinite"/>
    </rect>
    <!-- Right -->
    <rect x="56" y="34" width="8" height="4" rx="2" fill="#00d4ff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" begin="1.125s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Scanning beam -->
  <line x1="36" y1="24" x2="36" y2="48" stroke="#ff6600" stroke-width="1" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" values="0 36 36;360 36 36" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </line>
  
  <!-- Focus pulse -->
  <circle cx="36" cy="36" r="16" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="16;24;16" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>